            search-type="projects"
            :options='{"projects":{"label":"Proyectos","url":"/jobs"},"workers":{"label":"Freelancers","url":"/freelancers"}}'

desde dispositivos m\u00f3viles, incluyendo la adici\u00f3n de fotograf\u00edas y la captura de firmas de conformidad.\u003Cbr\/\u003E\n- Procesos de revisi\u00f3n y aprobaci\u00f3n para el cierre de tickets.\u003Cbr\/\u003E\n- Implementaci\u00f3n de m\u00f3dulos para mantenimiento preventivo y correctivo, gesti\u00f3n de SLA (Acuerdos de Nivel de Servicio), indicadores de rendimiento y exportaci\u00f3n de reportes.\u003Cbr\/\u003E\n- Soporte para m\u00faltiples clientes, asegurando la separaci\u00f3n de datos y archivos mediante controles a nivel de servidor.\u003Cbr\/\u003E\n- Mecanismos de respaldos de informaci\u00f3n, bit\u00e1cora de cambios y pruebas de seguridad exhaustivas.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nSe solicita una cotizaci\u00f3n detallada por etapas, comenzando con un piloto para un n\u00famero limitado de sucursales, seguido de la integraci\u00f3n completa y la ampliaci\u00f3n de la plataforma. La propuesta debe incluir el alcance del trabajo, exclusiones, plazos de entrega, precio total y costos recurrentes asociados.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nCondiciones del proyecto:\u003Cbr\/\u003E\nLas cuentas de servicios en la nube, el dominio y el repositorio de c\u00f3digo fuente deber\u00e1n estar bajo el control exclusivo de mi empresa desde el inicio del proyecto. Se proporcionar\u00e1 acceso de administrador al cliente y acceso revocable al desarrollador. Se espera una entrega progresiva del c\u00f3digo fuente, documentaci\u00f3n t\u00e9cnica, procedimientos de despliegue, herramientas de exportaci\u00f3n de datos y capacitaci\u00f3n, lo que permitir\u00e1 la continuidad del proyecto con otro proveedor si fuera necesario.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nEl contrato deber\u00e1 garantizar a mi empresa la titularidad de los derechos patrimoniales del desarrollo a medida, as\u00ed como la facultad de modificarlo, comercializarlo y otorgar licencias no exclusivas o suscripciones a m\u00faltiples clientes. Es fundamental identificar cualquier do costos, riesgos laborales y su impacto en los beneficios fiscales.\u003Cbr\/\u003E\n- Recibir recomendaciones pr\u00e1cticas, identificar errores comunes a evitar y definir los pr\u00f3ximos pasos concretos.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nRequisitos del profesional:\u003Cbr\/\u003E\n- Contador P\u00fablico matriculado con matr\u00edcula vigente en un Consejo Profesional de Ciencias Econ\u00f3micas.\u003Cbr\/\u003E\n- Experiencia comprobable en constituci\u00f3n de sociedades y gesti\u00f3n de reg\u00edmenes de promoci\u00f3n.\u003Cbr\/\u003E\n- Idealmente, experiencia previa con empresas de servicios digitales o audiovisuales, exportaci\u00f3n de servicios y contrataci\u00f3n de equipos.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nEn su propuesta, por favor detalle su experiencia en casos similares, el honorario por la consulta y su duraci\u00f3n, y si estar\u00eda disponible para acompa\u00f1arnos en la constituci\u00f3n y gesti\u00f3n contable continua de la empresa.\u003Cbr \/\u003E\u003Cbr \/\u003ECategor\u00eda: \u003Cstrong\u003EFinanzas y Negocios\u003C\/strong\u003E\u003Cbr \/\u003ESubcategor\u00eda: \u003Cstrong\u003ETareas de Contabilidad\u003C\/strong\u003E\u003Cbr \/\u003E\u00bfQu\u00e9 necesitas?: \u003Cstrong\u003EPara un emprendimiento ya encaminado\u003C\/strong\u003E\u003Cbr \/\u003E&quot;,&quot;isHourly&quot;:false,&quot;deadline&quot;:null,&quot;deadlineValue&quot;:&quot;&quot;,&quot;isSearchFeatured&quot;:false,&quot;postedDate&quot;:&quot;Hace 5 horas&quot;,&quot;lastEmployerMessage&quot;:null,&quot;isUrgent&quot;:false,&quot;projectClientPlanLabel&quot;:null,&quot;showMainDetails&quot;:true,&quot;showDescription&quot;:true,&quot;showSkills&quot;:true,&quot;skills&quot;:[{&quot;anchorText&quot;:&quot;Contabilidad&quot;,&quot;anchorLink&quot;:&quot;https:\/\/www.workana.com\/jobs?skills=accounting&quot;,&quot;isCertified&quot;:false,&quot;title&quot;:&quot;Trabajos Freelance de Contabilidad&quot;},{&quot;anchorText&quot;:&quot;An\u00e1lisis de Nego ara Kiosco Digital Android con Cms y Modo Offline\u0022\u003EDesarrollo de Aplicaci\u00f3n Interactiva para Kiosco Digital Android co...\u003C\/span\u003E\u003C\/a\u003E&quot;,&quot;url&quot;:&quot;#&quot;,&quot;authorName&quot;:&quot;M. J. I. S.&quot;,&quot;description&quot;:&quot;Se busca un desarrollador con experiencia para crear una aplicaci\u00f3n interactiva destinada a funcionar como kiosco digital en una pantalla t\u00e1ctil Samsung de 65 pulgadas con sistema operativo Android. La aplicaci\u00f3n debe ser intuitiva, visualmente atractiva y dise\u00f1ada para una interacci\u00f3n 100% t\u00e1ctil.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nLa funcionalidad principal incluye:\u003Cbr\/\u003E\n- M\u00faltiples secciones con informaci\u00f3n, im\u00e1genes, v\u00eddeos y mapas interactivos.\u003Cbr\/\u003E\n- Un juego tipo trivia con preguntas, gesti\u00f3n de tiempo, puntuaci\u00f3n y ranking.\u003Cbr\/\u003E\n- Modo de publicidad: Cuando la pantalla est\u00e9 inactiva, deber\u00e1 mostrar anuncios (im\u00e1genes o v\u00eddeos) y volver a la pantalla de inicio al ser tocada.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nRequisitos t\u00e9cnicos y operativos:\u003Cbr\/\u003E\n- Funcionamiento completamente offline: Todos los contenidos deben estar disponibles localmente.\u003Cbr\/\u003E\n- Sincronizaci\u00f3n de datos: Al restablecerse la conexi\u00f3n a internet, el sistema debe sincronizar autom\u00e1ticamente los datos y estad\u00edsticas de uso.\u003Cbr\/\u003E\n- CMS web: Se requiere un sistema de gesti\u00f3n de contenidos (CMS) sencillo basado en web para que el cliente pueda actualizar textos, im\u00e1genes, v\u00eddeos, publicidad y preguntas de la trivia sin necesidad de modificar el c\u00f3digo.\u003Cbr\/\u003E\n- Backend y base de datos: El sistema debe incluir un backend robusto y una base de datos para soportar la aplicaci\u00f3n y el CMS.\u003Cbr\/\u003E\n- Estad\u00edsticas de uso: Implementaci\u00f3n de estad\u00edsticas b\u00e1sicas para monitorear la interacci\u00f3n.\u003Cbr\/\u003E\n- Modo kiosco: La aplicaci\u00f3n debe iniciarse autom\u00e1ticamente al encender la pantalla y operar en modo kiosco, impidiendo el acceso del usuario al sistema Android subyacente.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nLos entregables esperados incluyen la aplicaci\u00f3n instalada y configurada, el CMS, el backend, la base de datos, el c\u00f3digo fuente completo y la documentaci\u00f3n b\u00e1sica del proyecto. Se valorar\u00e1 la experiencia previa en desarrollo de aplicaciones t\u00e1ctiles, modo kiosco y soluciones offline.\u003Cbr \/\u003E\u003Cbr \/\u003ECategor\u00eda: \u003Cstrong\u003EProgramaci\u00f3n y Tecnolog\u00eda\u003C\/strong\u003E\u003Cbr \/\u003ESubcategor\u00eda: \u003Cstrong\u003EProgramaci\u00f3n de Apps. Android, iOS y otros\u003C\/strong\u003E\u003Cbr \/\u003E\u00bfCu\u00e1l es el alcance del proyecto?: \u003Cstrong\u003ECrear una aplicaci\u00f3n nueva\u003C\/strong\u003E\u003Cbr \/\u003E&quot;,&quot;isHourly&quot;:false,&quot;deadline&quot;:null,&quot;deadlineValue&quot;:&quot;&quot;,&quot;isSearchFeatured&quot;:false,&quot;postedDate&quot;:&quot;Hace casi una hora&quot;,&quot;lastEmployerMessage&quot;:&quot;Hace 35 minutos&quot;,&quot;isUrgent&quot;:false,&quot;projectClientPlanLabel&quot;:null,&quot;showMainDetails&quot;:true,&quot;showDescription&quot;:true,&quot;showSkills&quot;:true,&quot;skills&quot;:[{&quot;anchorText&quot;:&quot;Android&quot;,&quot;anchorLink&quot;:&quot;https:\/\/www.workana.com\/jobs?skills=android&quot;,&quot;isCertified&quot;:false,&quot;title&quot;:&quot;Trabajos Freelance de Android&quot;},{&quot;anchorText&quot;:&quot;JavaScript&quot;,&quot;anchorLink&quot;:&quot;https:\/\/www.workana.com\/jobs?skills=javascript&quot;,&quot;isCertified&quot;:false,&quot;title&quot;:&quot;Trabajos Freelance de JavaScript&quot;},{&quot;anchorText&quot;:&quot;HTML5&quot;,&quot;anchorLink&quot;:&quot;https:\/\/www.workana.com\/jobs?skills=html5&quot;,&quot;isCertified&quot;:false,&quot;title&quot;:&quot;Tr a experiencia del usuario y la operatividad del sistema.\u003Cbr\/\u003E\n* Revisi\u00f3n detallada de la conexi\u00f3n y comunicaci\u00f3n entre el frontend y el backend para asegurar su correcta integraci\u00f3n.\u003Cbr\/\u003E\n* Correcci\u00f3n de problemas de rendimiento que puedan ralentizar la aplicaci\u00f3n o afectar su eficiencia.\u003Cbr\/\u003E\n* Mejora de componentes existentes cuando sea necesario para optimizar su funcionamiento y usabilidad.\u003Cbr\/\u003E\n* Realizaci\u00f3n de pruebas rigurosas para verificar la efectividad de todas las correcciones implementadas.\u003Cbr\/\u003E\n* Entrega de una versi\u00f3n estable y completamente funcional del proyecto.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nBuscamos un profesional responsable, con una s\u00f3lida capacidad para analizar problemas de forma r\u00e1pida y proponer soluciones eficientes y duraderas. La comunicaci\u00f3n durante el desarrollo se realizar\u00e1 principalmente a trav\u00e9s de chat, para revisar los avances, resolver dudas y asegurar una colaboraci\u00f3n fluida.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nLa entrega esperada es una aplicaci\u00f3n corregida, optimizada y lista para futuras mejoras o para su despliegue en producci\u00f3n.\u003Cbr \/\u003E\u003Cbr \/\u003ECategor\u00eda: \u003Cstrong\u003EProgramaci\u00f3n y Tecnolog\u00eda\u003C\/strong\u003E\u003Cbr \/\u003ESubcategor\u00eda: \u003Cstrong\u003EProgramaci\u00f3n Web\u003C\/strong\u003E\u003Cbr \/\u003E\u00bfCu\u00e1l es el alcance del proyecto?: \u003Cstrong\u003EBug o cambio peque\u00f1o\u003C\/strong\u003E\u003Cbr \/\u003E&quot;,&quot;isHourly&quot;:false,&quot;deadline&quot;:null,&quot;deadlineValue&quot;:&quot;&quot;,&quot;isSearchFeatured&quot;:false,&quot;postedDate&quot;:&quot;Hace casi una hora&quot;,&quot;lastEmployerMessage&quot;:&quot;Hace un mes&quot;,&quot;isUrgent&quot;:false,&quot;projectClientPlanLabel&quot;:null,&quot;showMainDetails&quot;:true,&quot;showDescription&quot;:true,&quot;showSkills&quot;:true,&quot
