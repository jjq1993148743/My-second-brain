<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Ko-fi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,600,700,800&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4efe8;
            color: #202020;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #cdb2f2;
        }

        body { overflow: hidden; }

        .kofi-404-runner {
            --crt-pad: 24px;
            --crt-inner: 12px;
            --crt-chin: 0px;

            width: 100%;
            height: 100dvh;
            padding: 20px 0;
            color: #202020;
            background:
                radial-gradient(150% 120% at 50% -10%, #ede1ff 0%, #cdb2f2 52%, #a586dd 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kofi-crt-monitor {
            display: flex;
            flex-direction: column;
            width: min(1052px, calc(100% - 32px));
            height: 100%;
            padding: var(--crt-pad);
            background: transparent;
        }

        .kofi-crt-screen {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: var(--crt-inner);
            border-radius: 18px;
            background: linear-gradient(150deg, #2a2c30, #131417);
            box-shadow:
                inset 0 0 0 1px rgba(0, 0, 0, 0.6),
                inset 0 2px 8px rgba(0, 0, 0, 0.65),
                0 1px 0 1px rgba(255, 255, 255, 0.35),
                0 14px 30px rgba(48, 32, 78, 0.32);
        }

        .kofi-game-shell {
            position: relative;
            overflow: hidden;
            background: #f4efe8;
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 10px;
        }

        .kofi-crt-glass {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            border-radius: 10px;
            overflow: hidden;
            background:
                radial-gradient(
                    125% 90% at 50% 0%,
                    rgba(255, 255, 255, 0.18) 0%,
                    rgba(255, 255, 255, 0) 42%
                ),
                radial-gradient(
                    135% 135% at 50% 50%,
                    rgba(0, 0, 0, 0) 52%,
                    rgba(38, 18, 66, 0.32) 100%
                );
            box-shadow:
                inset 0 0 34px rgba(0, 0, 0, 0.32),
                inset 0 0 90px rgba(150, 110, 220, 0.12);
        }

        .kofi-crt-glass::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(
                118deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0) 32%
            );
            mix-blend-mode: screen;
            animation: kofiCrtGlow 6.5s ease-in-out infinite;
        }

        @keyframes kofiCrtGlow {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.9; }
        }

        .kofi-crt-chin {
            height: var(--crt-chin);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }

        .kofi-crt-brand {
            font-size: 0.84rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(72, 48, 112, 0.9);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .kofi-crt-led {
            position: absolute;
            right: 16px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #5be07a;
            box-shadow:
                0 0 6px 1px rgba(91, 224, 122, 0.9),
                inset 0 0 2px rgba(255, 255, 255, 0.8);
            animation: kofiCrtPulse 2.6s ease-in-out infinite;
        }

        @keyframes kofiCrtPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        @media (prefers-reduced-motion: reduce) {
            .kofi-crt-led { animation: none; }
            .kofi-crt-glass::after { animation: none; }
        }

        .kofi-game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }

        .kofi-game-hud {
            position: absolute;
            inset: 18px 20px auto 20px;
            z-index: 5;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            pointer-events: none;
        }

        .kofi-label {
            margin: 0 0 4px;
            color: rgba(32, 32, 32, 0.6);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .kofi-score {
            margin: 0;
            font-size: clamp(1.44rem, 3.2vw, 2.4rem);
            font-weight: 400;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .kofi-health {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
        }

        .kofi-cup {
            width: 34px;
            height: 28px;
            display: inline-block;
            background: center / contain no-repeat var(--cup-url);
            opacity: 0.25;
            transform-origin: center bottom;
        }

        .kofi-cup.is-full { opacity: 1; }

        .kofi-overlay {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(244, 239, 232, 0.86);
            opacity: 1;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        .kofi-overlay.is-hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .kofi-overlay.is-gameover {
            inset: 50% auto auto 50%;
            width: min(360px, calc(100% - 32px));
            transform: translate(-50%, -50%);
            padding: 0;
            background: transparent;
        }

        .kofi-panel {
            width: min(520px, 100%);
            display: grid;
            gap: 18px;
            justify-items: center;
            padding: clamp(24px, 6vw, 42px);
            border: 1px solid rgba(32, 32, 32, 0.14);
            border-radius: 18px;
            background: #f9f7f4;
            text-align: center;
        }

        .kofi-overlay.is-gameover .kofi-panel {
            width: 100%;
            gap: 14px;
            padding: 22px;
        }

        .kofi-overlay.is-gameover h1 {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-style: italic;
            color: #C09BFF;
            line-height: 1;
        }

        .kofi-overlay.is-won {
            inset: 50% auto auto 50%;
            width: min(420px, calc(100% - 32px));
            transform: translate(-50%, -50%);
            padding: 0;
            background: transparent;
        }

        .kofi-overlay.is-won .kofi-panel {
            width: 100%;
            gap: 10px;
            padding: 22px;
        }

        .kofi-overlay.is-won h1 {
            font-size: clamp(1.9rem, 6vw, 2.8rem);
            font-style: italic;
            color: #C09BFF;
            line-height: 1;
        }

        .kofi-overlay.is-won p {
            color: #202020;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .kofi-panel h1 {
            margin: 0;
            font-size: clamp(2.4rem, 8vw, 5.3rem);
            line-height: 0.9;
            letter-spacing: 0;
        }

        .kofi-panel p {
            margin: 0;
            color: rgba(32, 32, 32, 0.72);
            font-size: clamp(1rem, 2.5vw, 1.28rem);
            line-height: 1.45;
        }

        .kofi-overlay.is-gameover p {
            color: #202020;
            font-size: 1.28rem;
            font-weight: 950;
        }

        .kofi-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Start-screen HTML buttons — positioned in game-shell by JS to match canvas title layout */
        .kofi-start-cta {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            min-width: 160px;
            transition: opacity 240ms ease, visibility 240ms ease;
        }
        .kofi-start-cta.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .kofi-start-cta .kofi-button.is-faded {
            opacity: 0.42;
            transition: opacity 600ms ease;
        }

        .kofi-button {
            min-height: 46px;
            min-width: 148px;
            border: 1px solid #202020;
            border-radius: 999px;
            padding: 11px 18px;
            color: #202020;
            background: #ffffff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }

        .kofi-button.is-primary {
            background: #C09BFF;
            color: #202020;
            border-color: #C09BFF;
        }

        .kofi-button:hover, .kofi-button:focus-visible {
            outline: none;
            transform: translateY(-1px);
        }

        .kofi-sound-toggle {
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 6;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(32, 32, 32, 0.18);
            border-radius: 999px;
            background: #ffffff;
            color: #202020;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 4px 14px rgba(32, 32, 32, 0.08);
            transition: transform 140ms ease, background 140ms ease, color 140ms ease, box-shadow 140ms ease;
        }

        .kofi-sound-toggle:hover, .kofi-sound-toggle:focus-visible {
            outline: none;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(32, 32, 32, 0.12);
        }

        .kofi-sound-toggle.is-muted {
            background: #f4efe8;
            color: rgba(32, 32, 32, 0.55);
        }

        @media (max-width: 850px) {
            .kofi-404-runner {
                --crt-pad: 14px;
                --crt-inner: 8px;
                --crt-chin: 0px;
            }

            .kofi-crt-monitor { border-radius: 18px; }
            .kofi-crt-screen { border-radius: 12px; }
            .kofi-crt-brand { font-size: 0.66rem; letter-spacing: 0.1em; }
            .kofi-crt-led { right: 12px; width: 7px; height: 7px; }

            .kofi-game-hud { inset: 14px 14px auto 14px; }
            .kofi-cup { width: 29px; height: 24px; }
            .kofi-sound-toggle { right: 14px; bottom: 14px; width: 38px; height: 38px; }
        }

        /* Landscape mobile: shrink chrome and cap width so the canvas stays ~16:9
           instead of stretching into a wide flat strip. */
        @media (orientation: landscape) and (max-height: 600px) {
            .kofi-404-runner {
                --crt-pad: 8px;
                --crt-inner: 6px;
                --crt-chin: 0px;
                padding: 8px 0;
            }
            .kofi-crt-monitor {
                /* overhead: 2×8 wrap-pad + 2×8 crt-pad + 2×6 crt-inner + 24 chin = 68px height
                             2×8 crt-pad + 2×6 crt-inner = 28px width
                   canvas_height = 100dvh − 68px → cap width at height × 1.8 + 28px */
                width: min(1052px, calc(100% - 20px), calc((100dvh - 68px) * 1.8 + 28px));
            }
            /* Compact gameover/win panel so it fits inside the short canvas */
            .kofi-overlay.is-gameover .kofi-panel,
            .kofi-overlay.is-won .kofi-panel {
                gap: 8px;
                padding: 14px 18px;
            }
            .kofi-overlay.is-gameover h1,
            .kofi-overlay.is-won h1 {
                font-size: 1.4rem;
            }
            .kofi-overlay.is-gameover p,
            .kofi-overlay.is-won p {
                font-size: 0.95rem;
            }
            .kofi-actions { gap: 7px; }
            .kofi-button {
                min-height: 36px;
                padding: 7px 14px;
            }
        }
    </style>
</head>
<body>
    <div id="kofi404Runner" class="kofi-404-runner w-full mx-auto" style="--cup-url: url('/game_assets/collectibles/kofi-cup.png')">
        <div class="kofi-crt-monitor">
            <div class="kofi-crt-screen">
                <div class="kofi-game-shell">
                    <canvas class="kofi-game-canvas" tabindex="0" aria-label="Ko-fi 404 endless runner" width="714" height="440"></canvas>

                    <div class="kofi-crt-glass" aria-hidden="true"></div>

                    <div class="kofi-game-hud" aria-hidden="true">
                        <div>
                            <p class="kofi-label">Score</p>
                            <p class="kofi-score" data-score="">0000</p>
                        </div>
                        <div>
                            <p class="kofi-label">Coffee Power</p>
                            <div class="kofi-health" data-health=""><span class="kofi-cup is-full"></span><span class="kofi-cup is-full"></span><span class="kofi-cup is-full"></span></div>
                        </div>
                    </div>

                    <button class="kofi-sound-toggle" type="button" data-sound-toggle="" aria-label="Sound on (click to mute)" aria-pressed="true" title="Sound on"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>

                    <div class="kofi-overlay is-hidden" data-overlay="">
                        <div class="kofi-panel">
                            <h1 data-title="">404 — Page Not Found</h1>
                            <p data-message="">The page is missing. What do you do?</p>
                            <div class="kofi-actions">
                                <button class="kofi-button" type="button" data-home="">Back to Ko-fi</button>
                                <button class="kofi-button is-primary" type="button" data-start="">Try Again</button>
                            </div>
                        </div>
                    </div>

                    <div class="kofi-start-cta" data-start-cta="" style="top: 214px;">
                        <button class="kofi-button is-faded" type="button" data-start-home="">Back to Ko-fi</button>
                        <button class="kofi-button is-primary" type="button" data-start-play="">Tap to Play</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
      (() => {
        "use strict";

        const root = document.querySelector("#kofi404Runner");
        const canvas = root.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = root.querySelector("[data-score]");
        const healthEl = root.querySelector("[data-health]");
        const overlay = root.querySelector("[data-overlay]");
        const titleEl = root.querySelector("[data-title]");
        const messageEl = root.querySelector("[data-message]");
        const startButton = root.querySelector("[data-start]");
        const homeButton = root.querySelector("[data-home]");
        const startCta = root.querySelector("[data-start-cta]");
        const startHomeBtn = startCta && startCta.querySelector("[data-start-home]");
        const startPlayBtn = startCta && startCta.querySelector("[data-start-play]");
        const soundToggleEl = root.querySelector("[data-sound-toggle]");

        let homePillFadeTimer = null;
        const HOME_PILL_FADE_DELAY_MS = 6000;
        let overlayFadeTimer = null;
        const OVERLAY_FADE_MS = 240;

        const CONFIG = {
          homeUrl: "https://ko-fi.com/",
          maxHealth: 3,
          gravity: 2500,
          jumpForce: -860,
          startSpeed: 240,
          maxSpeed: 430,
          floorColor: "#F9F7F4",
          skyColor: "#F4EFE8",
        };

        const ASSETS = {
          characterSprites: Array.from(
            { length: 24 },
            (_, i) =>
              encodeURI(
                `/game_assets/character-explore/character 1 -2_${String(i + 11).padStart(5, "0")}.png`,
              ),
          ),
          backgrounds: {
            cloud1:      "/game_assets/custom-bg/cloud1.png",
            cloud2:      "/game_assets/custom-bg/cloud2.png",
            cloudA:      "/game_assets/custom-bg/cloudA.png",
            cloudB:      "/game_assets/custom-bg/cloudB.png",
            star:        "/game_assets/custom-bg/star.png",
            rock:        "/game_assets/custom-bg/rock.png",
            background1: "/game_assets/custom-bg/background_1.png",
            background2: "/game_assets/custom-bg/background_2.png",
            background3: "/game_assets/custom-bg/background_3.png",
            floor:       "/game_assets/custom-bg/floor.png",
          },
          obstacles: Array.from(
            { length: 14 },
            (_, i) => encodeURI(`/game_assets/obstacles/Asset ${i + 63}@2x.png`),
          ),
          collectible:    "/game_assets/collectibles/kofi-cup.png",
          coverCharacter: "/game_assets/cover/cover-character.png",
          sounds: {
            coffee:   "/game_assets/sound/coffee.mp3",
            hit:      "/game_assets/sound/hit.mp3",
            gameOver: "/game_assets/sound/game-over.mp3",
            win:      "/game_assets/sound/win.mp3",
          },
        };

        const images = {
          character:      loadImages(ASSETS.characterSprites),
          obstacles:      loadImages(ASSETS.obstacles),
          collectible:    loadImage(ASSETS.collectible),
          backgrounds:    Object.fromEntries(
            Object.entries(ASSETS.backgrounds).map(([key, src]) => [key, loadImage(src)]),
          ),
          coverCharacter: loadImage(ASSETS.coverCharacter),
        };

        const SFX_VOLUME = 0.9;
        const MUSIC_VOLUME = 0.4;

        const sounds = Object.fromEntries(
          Object.entries(ASSETS.sounds).map(([key, src]) => {
            if (!src) return [key, null];
            const audio = new Audio(src);
            audio.preload = "auto";
            if (key === "music") {
              audio.loop = true;
              audio.volume = MUSIC_VOLUME;
            } else {
              audio.volume = SFX_VOLUME;
            }
            return [key, audio];
          }),
        );

        let soundEnabled = (() => {
          try { return localStorage.getItem("kofi404_sound") !== "off"; }
          catch (err) { return true; }
        })();

        const state = {
          mode: "start",
          width: 960, height: 540, dpr: 1,
          floorY: 420, lastTime: 0,
          score: 0, distance: 0,
          health: CONFIG.maxHealth,
          speed: CONFIG.startSpeed,
          obstacleTimer: 1.2, collectibleTimer: 3.8,
          animTime: 0, invulnerable: 0,
          obstacles: [], collectibles: [], particles: [], rings: [],
          shake: 0,
          titleVisibility: 1,
          pillBounds: null,
          fireworkTimer: 0,
          bgDrift: 0,
        };

        const WIN_SCORE = 10000;
        const MOBILE_BP = 850;

        const player = {
          x: 92, y: 0,
          width: 122, height: 146,
          groundInset: 16,
          vy: 0, grounded: true, paceDir: 1,
        };

        const obstaclePool = [], collectiblePool = [], particlePool = [];
        let obstacleBag = [], lastObstacleImage = null;

        function refillObstacleBag() {
          obstacleBag = images.obstacles.slice();
          for (let i = obstacleBag.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = obstacleBag[i]; obstacleBag[i] = obstacleBag[j]; obstacleBag[j] = tmp;
          }
          if (lastObstacleImage && obstacleBag.length > 1 && obstacleBag[obstacleBag.length - 1] === lastObstacleImage) {
            const swapIdx = Math.floor(Math.random() * (obstacleBag.length - 1));
            const last = obstacleBag.length - 1;
            const tmp = obstacleBag[last]; obstacleBag[last] = obstacleBag[swapIdx]; obstacleBag[swapIdx] = tmp;
          }
        }

        function pickObstacleImage() {
          if (!obstacleBag.length) refillObstacleBag();
          const image = obstacleBag.pop();
          lastObstacleImage = image;
          return image;
        }

        function loadImage(src) {
          const image = new Image();
          image.src = src;
          image.onload = draw;
          return image;
        }

        function loadImages(paths) { return paths.map(loadImage); }

        function playSound(name) {
          if (!soundEnabled) return;
          const sound = sounds[name];
          if (!sound) return;
          try {
            if (name !== "music") sound.currentTime = 0;
            sound.play().catch(() => {});
          } catch (err) {}
        }

        function stopSound(name) {
          const sound = sounds[name];
          if (!sound) return;
          sound.pause();
          if (name !== "music") sound.currentTime = 0;
        }

        function ensureMusic() {
          if (!soundEnabled) return;
          const music = sounds.music;
          if (!music) return;
          if (music.paused && state.mode === "playing") music.play().catch(() => {});
        }

        function setSoundEnabled(enabled) {
          soundEnabled = enabled;
          try { localStorage.setItem("kofi404_sound", enabled ? "on" : "off"); } catch (err) {}
          if (!enabled) { Object.values(sounds).forEach((s) => { if (s) s.pause(); }); }
          else ensureMusic();
          updateSoundButton();
        }

        const SOUND_ON_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
        const SOUND_OFF_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';

        function updateSoundButton() {
          if (!soundToggleEl) return;
          soundToggleEl.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
          soundToggleEl.setAttribute("aria-label", soundEnabled ? "Sound on (click to mute)" : "Sound off (click to unmute)");
          soundToggleEl.title = soundEnabled ? "Sound on" : "Sound off";
          soundToggleEl.classList.toggle("is-muted", !soundEnabled);
          soundToggleEl.innerHTML = soundEnabled ? SOUND_ON_SVG : SOUND_OFF_SVG;
        }

        function setStartFloorPose() {
          player.y = playerFloorY(); player.vy = 0; player.grounded = true;
        }

        function resize() {
          const rect = canvas.getBoundingClientRect();
          state.dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = rect.width  > 0 ? rect.width  : window.innerWidth;
          const h = rect.height > 0 ? rect.height : window.innerHeight;
          state.width  = Math.max(320, w);
          state.height = Math.max(360, h);
          canvas.width  = Math.round(state.width  * state.dpr);
          canvas.height = Math.round(state.height * state.dpr);
          ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

          const prevFloorY = state.floorY;
          state.floorY = state.height * 0.78;
          const floorShift = state.floorY - prevFloorY;
          if (floorShift !== 0) {
            for (const item of state.obstacles) item.y += floorShift;
            for (const item of state.collectibles) item.y += floorShift;
            for (const item of state.particles) item.y += floorShift;
            for (const ring of state.rings) ring.y += floorShift;
          }

          const isMobile = state.width < MOBILE_BP;
          player.height = isMobile ? 146 : 168;
          const firstFrame = images.character[0];
          if (firstFrame && firstFrame.complete && firstFrame.naturalWidth > 0) {
            player.width = player.height * (firstFrame.naturalWidth / firstFrame.naturalHeight);
          } else {
            player.width = player.height * (122 / 146);
          }
          if (state.mode === "start") { setStartFloorPose(); }
          else { player.y = Math.min(player.y || playerFloorY(), playerFloorY()); }
          draw();
        }

        function resetGame() {
          state.mode = "playing";
          state.score = 0; state.distance = 0;
          state.health = CONFIG.maxHealth;
          state.speed = CONFIG.startSpeed;
          state.obstacleTimer = 0.3; state.collectibleTimer = 3.4;
          state.animTime = 0; state.invulnerable = 0;
          state.obstacles.forEach((item) => releaseObject(item, obstaclePool));
          state.collectibles.forEach((item) => releaseObject(item, collectiblePool));
          state.particles.forEach((item) => releaseObject(item, particlePool));
          state.obstacles = []; state.collectibles = []; state.particles = []; state.rings = [];
          state.shake = 0;
          obstacleBag = []; lastObstacleImage = null;
          player.x = 92; player.paceDir = 1;
          player.y = playerFloorY(); player.vy = 0; player.grounded = true;
          overlay.classList.add("is-hidden");
          if (overlayFadeTimer) clearTimeout(overlayFadeTimer);
          overlayFadeTimer = setTimeout(() => {
            overlayFadeTimer = null;
            if (!overlay.classList.contains("is-hidden")) return;
            overlay.classList.remove("is-gameover", "is-won");
            titleEl.textContent = "404 — Page Not Found";
          }, OVERLAY_FADE_MS);
          state.fireworkTimer = 0;
          if (startCta) startCta.classList.add("is-hidden");
          if (startHomeBtn) startHomeBtn.classList.remove("is-faded");
          if (homePillFadeTimer) { clearTimeout(homePillFadeTimer); homePillFadeTimer = null; }
          updateUI();
          if (sounds.music) sounds.music.currentTime = 0;
          ensureMusic();
        }

        function showStart() {
          state.mode = "start";
          state.distance = 0; state.animTime = 0;
          player.x = 92; player.paceDir = 1;
          setStartFloorPose();
          overlay.classList.remove("is-gameover", "is-won");
          overlay.classList.add("is-hidden");
          if (startCta) startCta.classList.remove("is-hidden");
          if (startHomeBtn) startHomeBtn.classList.remove("is-faded");
          if (homePillFadeTimer) { clearTimeout(homePillFadeTimer); homePillFadeTimer = null; }
          homePillFadeTimer = setTimeout(() => {
            if (startHomeBtn) startHomeBtn.classList.add("is-faded");
          }, HOME_PILL_FADE_DELAY_MS);
          updateUI(); draw();
        }

        function showGameOver() {
          state.mode = "gameover";
          if (overlayFadeTimer) { clearTimeout(overlayFadeTimer); overlayFadeTimer = null; }
          titleEl.textContent = "Game over!";
          messageEl.textContent = `Score ${Math.floor(state.score).toString().padStart(4, "0")}`;
          startButton.textContent = "Play again";
          overlay.classList.add("is-gameover");
          overlay.classList.remove("is-hidden", "is-won");
          if (homePillFadeTimer) { clearTimeout(homePillFadeTimer); homePillFadeTimer = null; }
          canvas.style.cursor = "";
          stopSound("music"); playSound("gameOver");
        }

        function showWin() {
          state.mode = "won";
          if (overlayFadeTimer) { clearTimeout(overlayFadeTimer); overlayFadeTimer = null; }
          titleEl.textContent = "Congratulations!";
          messageEl.textContent = `You made it to ${Math.floor(state.score).toString().padStart(4, "0")}`;
          startButton.textContent = "Play again";
          overlay.classList.remove("is-gameover");
          overlay.classList.add("is-won");
          overlay.classList.remove("is-hidden");
          if (homePillFadeTimer) { clearTimeout(homePillFadeTimer); homePillFadeTimer = null; }
          canvas.style.cursor = "";
          state.fireworkTimer = 0;
          stopSound("music"); playSound("win");
        }

        function spawnFirework() {
          const colors = ["#72A5F2","#FF6433","#FFFFFF","#C19BFF","#FFA05A","#FFD96E"];
          const color = randomItem(colors);
          const x = randomBetween(state.width * 0.12, state.width * 0.88);
          const y = randomBetween(state.height * 0.15, state.height * 0.55);
          for (let i = 0; i < 26; i += 1) {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomBetween(160, 360);
            state.particles.push(getObject(particlePool, {
              x, y,
              vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
              size: randomBetween(4, 8), life: randomBetween(0.9, 1.5), maxLife: 1.5,
              gravity: 260, color, shape: "sparkle", rotation: Math.random() * Math.PI,
            }));
          }
        }

        function returnHome() {
          try {
            if (window.top && window.top !== window.self) { window.top.location.href = CONFIG.homeUrl; return; }
          } catch (err) {}
          window.location.href = CONFIG.homeUrl;
        }

        function jump() {
          if (state.mode === "start" || state.mode === "gameover" || state.mode === "won") {
            resetGame(); return;
          }
          if (!player.grounded) return;
          player.vy = CONFIG.jumpForce; player.grounded = false;
          ensureMusic();
        }

        function updateUI() {
          scoreEl.textContent = Math.floor(state.score).toString().padStart(4, "0");
          healthEl.innerHTML = "";
          for (let i = 0; i < CONFIG.maxHealth; i += 1) {
            const cup = document.createElement("span");
            cup.className = `kofi-cup${i < state.health ? " is-full" : ""}`;
            healthEl.appendChild(cup);
          }
        }

        function getObject(pool, defaults) { return Object.assign(pool.pop() || {}, defaults, { active: true }); }
        function releaseObject(item, pool) { item.active = false; pool.push(item); }

        function spawnObstacle() {
          const image = pickObstacleImage();
          const _sizeMul = state.width < MOBILE_BP ? 0.8 : 1;
          const height = randomBetween(48, 68) * _sizeMul;
          const aspect = image && image.complete && image.naturalWidth > 0 ? image.naturalWidth / image.naturalHeight : 1;
          const width = height * aspect;
          const spawnX = state.width + randomBetween(90, 170);
          state.obstacles.push(getObject(obstaclePool, {
            x: spawnX, spawnX, spawnDistance: state.distance,
            y: state.floorY - height + 4, width, height, image, hit: false,
          }));
        }

        function spawnCollectible() {
          const image = images.collectible;
          const baseHeight = 35;
          const aspect = image && image.complete && image.naturalWidth > 0 ? image.naturalWidth / image.naturalHeight : 44 / 35;
          state.collectibles.push(getObject(collectiblePool, {
            x: state.width + 90, y: state.floorY - randomBetween(150, 235),
            width: baseHeight * aspect, height: baseHeight, image, phase: Math.random() * Math.PI * 2,
          }));
        }

        function spawnCollectEffect(x, y) {
          for (let i = 0; i < 16; i += 1) {
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.95;
            const speed = randomBetween(70, 210);
            state.particles.push(getObject(particlePool, {
              x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
              size: randomBetween(3, 6), life: 0.9, maxLife: 0.9,
              gravity: 180, color: "#C09BFF", shape: "sparkle", rotation: Math.random() * Math.PI,
            }));
          }
          state.rings.push({ x, y, radius: 6, maxRadius: 68, life: 0.55, maxLife: 0.55, color: "#C09BFF" });
        }

        function spawnHitEffect(x, y) {
          for (let i = 0; i < 24; i += 1) {
            const angle = Math.random() * Math.PI * 2;
            const speed = randomBetween(180, 380);
            state.particles.push(getObject(particlePool, {
              x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
              size: randomBetween(4, 9), life: 0.55, maxLife: 0.55,
              gravity: 780, color: "#C09BFF", shape: "shard", rotation: Math.random() * Math.PI,
            }));
          }
          state.shake = Math.max(state.shake, 0.36);
        }

        function update(delta) {
          const targetVis = state.mode === "gameover" || state.mode === "won" ? 0 : 1;
          state.titleVisibility += (targetVis - state.titleVisibility) * Math.min(1, delta * 6);

          if (state.mode === "won") {
            state.fireworkTimer -= delta;
            if (state.fireworkTimer <= 0) { spawnFirework(); state.fireworkTimer = randomBetween(0.25, 0.6); }
          }

          if (state.mode === "start") {
            state.animTime += delta * 16;
            setStartFloorPose();
            const paceLeft = 20, paceRight = state.width - player.width - 20;
            player.x += player.paceDir * 110 * delta;
            if (player.x >= paceRight) { player.x = paceRight; player.paceDir = -1; }
            if (player.x <= paceLeft)  { player.x = paceLeft;  player.paceDir = 1;  }
          }

          if (state.mode !== "playing") {
            state.bgDrift += delta * 400;
            updateParticles(delta);
            return;
          }

          state.distance += state.speed * delta;
          state.score += delta * state.speed * 0.025;
          const _isDesktop = state.width >= MOBILE_BP;
          const _desktopMul = _isDesktop ? 1.1 : 1;
          const _milestoneBonus = _isDesktop ? Math.floor(state.score / 500) * 35 : 0;
          state.speed = Math.min(CONFIG.maxSpeed + _milestoneBonus, CONFIG.startSpeed + state.score * 1.2 * _desktopMul + _milestoneBonus);
          state.animTime += delta * 16;
          state.invulnerable = Math.max(0, state.invulnerable - delta);

          player.vy += CONFIG.gravity * delta;
          player.y += player.vy * delta;
          const floor = playerFloorY();
          if (player.y >= floor) { player.y = floor; player.vy = 0; player.grounded = true; }

          state.obstacleTimer -= delta;
          if (state.obstacleTimer <= 0) {
            spawnObstacle();
            const _obstFreqMul = state.width >= MOBILE_BP ? 0.9 : 1;
            state.obstacleTimer = randomBetween(1.1, 1.9) * Math.max(0.78, 1 - state.score / 4200) * _obstFreqMul;
          }

          state.collectibleTimer -= delta;
          if (state.collectibleTimer <= 0) {
            spawnCollectible();
            state.collectibleTimer = randomBetween(4.9, 8.3) * (1 + state.score / 4000);
          }

          updateObstacles(delta); updateCollectibles(delta); updateParticles(delta); updateUI();
          if (state.score >= WIN_SCORE) showWin();
        }

        function updateObstacles(delta) {
          const hitbox = playerHitbox();
          for (let i = state.obstacles.length - 1; i >= 0; i -= 1) {
            const item = state.obstacles[i];
            item.x = item.spawnX - (state.distance - item.spawnDistance);
            if (rectsOverlap(hitbox, item) && !item.hit && state.invulnerable <= 0) {
              item.hit = true; state.health -= 1; state.invulnerable = 1.05;
              spawnHitEffect(hitbox.x + hitbox.width / 2, hitbox.y + hitbox.height / 2);
              playSound("hit");
              if (state.health <= 0) showGameOver();
            }
            if (item.x + item.width < -80) { state.obstacles.splice(i, 1); releaseObject(item, obstaclePool); }
          }
        }

        function updateCollectibles(delta) {
          const hitbox = playerHitbox();
          for (let i = state.collectibles.length - 1; i >= 0; i -= 1) {
            const item = state.collectibles[i];
            item.x -= state.speed * 0.82 * delta;
            item.phase += delta * 4;
            const floatingBox = { ...item, y: item.y + Math.sin(item.phase) * 8 };
            if (rectsOverlap(hitbox, floatingBox)) {
              state.health = Math.min(CONFIG.maxHealth, state.health + 1);
              state.score += 40;
              spawnCollectEffect(item.x + item.width / 2, item.y + item.height / 2);
              playSound("coffee");
              state.collectibles.splice(i, 1); releaseObject(item, collectiblePool); continue;
            }
            if (item.x + item.width < -80) { state.collectibles.splice(i, 1); releaseObject(item, collectiblePool); }
          }
        }

        function updateParticles(delta) {
          for (let i = state.particles.length - 1; i >= 0; i -= 1) {
            const item = state.particles[i];
            item.life -= delta; item.x += item.vx * delta; item.y += item.vy * delta;
            item.vy += (item.gravity ?? 600) * delta;
            if (item.shape === "shard") item.rotation += delta * 6;
            if (item.life <= 0) { state.particles.splice(i, 1); releaseObject(item, particlePool); }
          }
          for (let i = state.rings.length - 1; i >= 0; i -= 1) {
            const ring = state.rings[i];
            ring.life -= delta;
            if (ring.life <= 0) state.rings.splice(i, 1);
          }
          if (state.shake > 0) state.shake = Math.max(0, state.shake - delta);
        }

        function playerHitbox() {
          return { x: player.x + player.width * 0.28, y: player.y + player.height * 0.16, width: player.width * 0.46, height: player.height * 0.66 };
        }

        function playerFloorY() { return state.floorY - player.height + player.groundInset; }

        function rectsOverlap(a, b) {
          return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
        }

        function draw() {
          ctx.clearRect(0, 0, state.width, state.height);
          let shaking = false;
          if (state.shake > 0) {
            const intensity = state.shake * 18;
            ctx.save();
            ctx.translate((Math.random() - 0.5) * intensity, (Math.random() - 0.5) * intensity);
            shaking = true;
          }
          drawBackground(); drawSceneTitle(); drawWorld(); drawPlayer(); drawParticles();
          if (shaking) ctx.restore();
        }

        function bgCloudDist() {
          return state.mode === "playing" ? state.distance : state.bgDrift;
        }

        function drawBackground() {
          ctx.fillStyle = CONFIG.skyColor;
          ctx.fillRect(0, 0, state.width, state.height);
          const isMobile = state.width < MOBILE_BP;

          drawParallaxProps(
            images.backgrounds.cloudA, 0.004,
            isMobile
              ? [{ x: 0.12, y: 0.14, size: 104 }, { x: 0.74, y: 0.42, size: 88 }]
              : [{ x: 0.12, y: 0.09, size: 130 }, { x: 0.74, y: 0.14, size: 110 }],
            2600, null, bgCloudDist(),
          );
          drawParallaxProps(
            images.backgrounds.cloudB, 0.004,
            isMobile
              ? [{ x: 0.42, y: 0.28, size: 112 }, { x: 0.92, y: 0.12, size: 94 }]
              : [{ x: 0.42, y: 0.20, size: 140 }, { x: 0.92, y: 0.07, size: 118 }],
            2800, null, bgCloudDist(),
          );
          drawParallaxProps(
            images.backgrounds.rock, 0.002,
            [{ x: 0.5 - (Math.min(250, state.width * 0.24) * (isMobile ? 1.2 : 1)) / (2 * state.width), y: isMobile ? 0.35 : 0.15, size: Math.min(250, state.width * 0.24) * (isMobile ? 1.2 : 1) }],
            2200,
          );
          drawParallaxProps(
            images.backgrounds.star, 0.006,
            [{ x: 0.05, y: 0.08, size: 13 }, { x: 0.26, y: 0.45, size: 17 }, { x: 0.47, y: 0.2, size: 14 }, { x: 0.68, y: 0.27, size: 12 }, { x: 0.88, y: 0.14, size: 11 }],
            1200,
          );
          drawParallaxProps(
            images.backgrounds.cloud1, 0.012,
            isMobile
              ? [{ x: 0.08, y: 0.28, size: 118 }, { x: 0.42, y: 0.24, size: 96 }, { x: 0.78, y: 0.46, size: 126 }]
              : [{ x: 0.08, y: 0.28, size: 118 }, { x: 0.42, y: 0.16, size: 96 }, { x: 0.78, y: 0.35, size: 126 }],
            1380, null, bgCloudDist(),
          );
          drawParallaxProps(
            images.backgrounds.cloud2, 0.016,
            isMobile
              ? [{ x: 0.18, y: 0.44, size: 108 }, { x: 0.58, y: 0.35, size: 84 }, { x: 0.88, y: 0.28, size: 102 }]
              : [{ x: 0.18, y: 0.39, size: 108 }, { x: 0.58, y: 0.31, size: 84 }, { x: 0.88, y: 0.18, size: 102 }],
            1290, null, bgCloudDist(),
          );
          drawMixedParallaxProps([
            { image: images.backgrounds.background1, x: 0.07, size: 54,  yOffset: 0   },
            { image: images.backgrounds.background3, x: 0.34, size: 58,  yOffset: -12 },
            { image: images.backgrounds.background1, x: 0.72, size: 62,  yOffset: 0   },
            { image: images.backgrounds.background3, x: 0.94, size: 48,  yOffset: -10 },
          ], 0.028, 1120, state.floorY - 108);
          drawParallaxProps(images.backgrounds.background2, 0.045, [{ x: 0.29, y: 0, size: 124 }, { x: 0.74, y: 0, size: 112 }], 980, state.floorY - 32);
        }

        function drawSceneTitle() {
          if (state.titleVisibility <= 0.01) return;
          const baseAlpha = state.titleVisibility;
          const cx = state.width / 2;
          const isMobile = state.width < MOBILE_BP;
          // isShort: landscape mobile — canvas is ~300-350px tall, need compact layout above the floor
          // isNarrow: portrait phone — canvas is ~300-400px wide, avoid title/subtitle stretching edge to edge
          const isShort = state.height < 380;
          const isNarrow = !isShort && state.width < 420;

          ctx.save();

          // Title sizing per context:
          // isShort — height-based but also scaled by width so it fills the wide landscape canvas
          // isNarrow — no mobile multiplier, lower floor so it stays proportional to narrow canvas
          // normal  — standard width/height min with mobile boost
          const titleMul = (isMobile && !isShort && !isNarrow) ? 1.2 : 1;
          const titleSize = isShort
            ? Math.max(state.width * 0.13, Math.min(state.height * 0.22, 72))
            : Math.max(isNarrow ? 44 : 56, Math.min(state.width * 0.16, state.height * 0.27)) * titleMul;

          const titleY = state.height * 0.13 + titleSize * 0.42;
          ctx.globalAlpha = baseAlpha;
          ctx.fillStyle = "#C09BFF";
          ctx.font = `italic 950 ${titleSize}px "DM Sans", Inter, system-ui, sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("404", cx, titleY);

          // Skip subtitle on short viewports — saves ~30px of vertical space
          // On narrow portrait: no mobile multiplier, and letter-spacing scaled to canvas width so
          // "The page is missing." doesn't stretch edge-to-edge on a 310px canvas
          const subMul = (isMobile && !isShort && !isNarrow) ? 1.15 : 1;
          const subSize = isShort ? 0 : Math.max(11, Math.min(state.width * 0.014, 14)) * subMul;
          let pillAnchorY = titleY + titleSize * 0.5;
          if (!isShort) {
            const subY = isMobile ? pillAnchorY + 10 + subSize * 0.5 : titleY + titleSize * 0.42 - subSize * 0.3;
            ctx.fillStyle = "rgba(32, 32, 32, 0.55)";
            ctx.font = `800 ${subSize}px "DM Sans", Inter, system-ui, sans-serif`;
            const supportsLetterSpacing = "letterSpacing" in ctx;
            // Letter spacing scales with canvas width so it reads naturally regardless of viewport size
            const lsScale = Math.min(0.34, (state.width / 1050) * 0.34);
            if (supportsLetterSpacing) ctx.letterSpacing = `${subSize * lsScale}px`;
            ctx.fillText("The page is missing.", cx, subY);
            if (supportsLetterSpacing) ctx.letterSpacing = "0px";
            pillAnchorY = subY + subSize * 0.5;
          }

          // Position the HTML start CTA to sit just below the canvas-drawn subtitle
          if (startCta) startCta.style.top = `${Math.round(pillAnchorY + 8)}px`;

          ctx.restore();
        }

        function drawParallaxLayer(image, speedFactor, y, layerHeight, overlap = 0) {
          if (!image.complete || image.naturalWidth === 0) return;
          const tileWidth = (image.naturalWidth / image.naturalHeight) * layerHeight;
          const offset = -((state.distance * speedFactor) % tileWidth);
          const step = Math.max(1, tileWidth - overlap);
          for (let x = offset - tileWidth; x < state.width + tileWidth; x += step) {
            ctx.drawImage(image, x, y, tileWidth, layerHeight);
          }
        }

        function drawParallaxProps(image, speedFactor, placements, spacing, baseY = null, distanceOverride = null) {
          if (!image.complete || image.naturalWidth === 0) return;
          const dist = distanceOverride !== null ? distanceOverride : state.distance;
          const travel = Math.max(spacing, state.width * 0.72);
          const offset = -((dist * speedFactor) % travel);
          placements.forEach((p) => {
            const drawWidth = p.size;
            const drawHeight = (image.naturalHeight / image.naturalWidth) * drawWidth;
            const y = baseY === null ? state.height * p.y : baseY;
            for (let x = state.width * p.x + offset - travel; x < state.width + travel; x += travel) {
              ctx.drawImage(image, x, y, drawWidth, drawHeight);
            }
          });
        }

        function drawMixedParallaxProps(items, speedFactor, spacing, baseY) {
          const travel = Math.max(spacing, state.width * 0.78);
          const offset = -((state.distance * speedFactor) % travel);
          items.forEach((item) => {
            if (!item.image.complete || item.image.naturalWidth === 0) return;
            const drawWidth = item.size;
            const drawHeight = (item.image.naturalHeight / item.image.naturalWidth) * drawWidth;
            const y = baseY + item.yOffset;
            for (let x = state.width * item.x + offset - travel; x < state.width + travel; x += travel) {
              ctx.drawImage(item.image, x, y, drawWidth, drawHeight);
            }
          });
        }

        function drawWorld() {
          ctx.fillStyle = CONFIG.floorColor;
          ctx.fillRect(0, state.floorY, state.width, state.height - state.floorY);
          drawParallaxLayer(images.backgrounds.floor, 1, state.floorY, Math.max(70, state.height - state.floorY), 1);
          state.collectibles.forEach((item) => {
            const y = item.y + Math.sin(item.phase) * 8;
            drawImageOrCup(item.image, item.x, y, item.width, item.height);
          });
          state.obstacles.forEach((item) => drawImageOrBlock(item.image, item.x, item.y, item.width, item.height));
        }

        function drawPlayer() {
          const frame = images.character[Math.floor(state.animTime) % images.character.length];
          if (frame && frame.complete && frame.naturalWidth > 0) {
            player.width = player.height * (frame.naturalWidth / frame.naturalHeight);
          }
          if (state.mode === "start") {
            setStartFloorPose();
            if (frame && frame.complete && frame.naturalWidth > 0) {
              ctx.save();
              if (player.paceDir === -1) {
                ctx.translate(player.x + player.width / 2, 0);
                ctx.scale(-1, 1);
                ctx.translate(-(player.x + player.width / 2), 0);
              }
              ctx.drawImage(frame, player.x, player.y, player.width, player.height);
              ctx.restore();
            } else {
              ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#202020"; ctx.lineWidth = 3;
              roundedRect(player.x, player.y, player.width * 0.7, player.height * 0.8, 18, true, true);
            }
            return;
          }
          const blink = state.invulnerable > 0 && Math.floor(state.invulnerable * 18) % 2 === 0;
          if (blink) ctx.globalAlpha = 0.45;
          if (frame && frame.complete && frame.naturalWidth > 0) {
            ctx.drawImage(frame, player.x, player.y, player.width, player.height);
          } else {
            ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#202020"; ctx.lineWidth = 3;
            roundedRect(player.x, player.y, player.width * 0.7, player.height * 0.8, 18, true, true);
          }
          ctx.globalAlpha = 1;
        }

        function drawParticles() {
          state.particles.forEach((item) => {
            const maxLife = item.maxLife || 0.7;
            const lifeRatio = Math.max(0, item.life / maxLife);
