d Pipeline Development\u0022\u003ETalent Scout Specialist for Candidate Sourcing and Pipeline Develop...\u003C\/span\u003E\u003C\/a\u003E&quot;,&quot;url&quot;:&quot;#&quot;,&quot;authorName&quot;:&quot;M. C.&quot;,&quot;description&quot;:&quot;We are looking for a proactive and detail-oriented Talent Scout Specialist to assist with talent discovery, candidate research, and the development of a well-organized recruitment pipeline. The ideal freelancer will be capable of identifying promising professionals across relevant online platforms, evaluating their suitability against defined criteria, and presenting well-researched candidate profiles for further assessment.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nThis project requires a structured approach to talent mapping, professional research, and candidate relationship development. We value accuracy, consistency, sound judgment, and the ability to work independently while meeting agreed objectives.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nKey Responsibilities\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nTalent Identification: Research professional networks, online directories, career platforms, and other relevant sources to identify individuals whose skills and backgrounds align with our recruitment objectives.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nCandidate Qualification: Assess publicly available professional information, including work history, competencies, industry experience, and other role-related criteria.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nTalent Mapping: Identify potential candidate pools across relevant industries and professional backgrounds, organizing findings into clear and searchable records.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nInitial Outreach: Prepare and send personalized, professional introductory messages to suitable candidates, following the communication guidelines provided.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nCandidate Database Management: Maintain accurate records containing relevant profile information, research notes, contact status, and follow-up requirements.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nResearch Documentation: Compile structured candidate reports and shortlists that allow our internal team to compare profiles and prioritize promising prospects.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nPipeline Monitoring: Track outreach activity, candidate responses, pending follow-ups, and progress toward agreed sourcing targets.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nQuality Assurance: Verify information for consistency, eliminate duplicate records, and ensure that submitted profiles meet the established requirements.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nConfidentiality and Compliance: Handle candidate information responsibly, respect privacy requirements, and follow applicable data protection rules and platform policies.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nRequired Qualifications\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nWe are seeking a freelancer with experience or demonstrated capability in recruitment research, talent acquisition, candidate sourcing, or professional online investigation.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nThe successful candidate should demonstrate:\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nStrong analytical and organizational skills.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nExcellent written communication and professional correspondence.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nThe ability to evaluate candidate profiles against specific selection criteria.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nConfidence using online research tools, spreadsheets, and candidate tracking systems.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nConsistent attention to detail and accuracy.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nThe ability to prioritize tasks, follow structured procedures, and manage deadlines independently.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nProfessional discretion when handling confidential business and candidate information.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nExpected Deliverables\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nThe project will involve producing practical, review-ready recruitment materials, including:\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nCandidate Shortlists: Organized lists of potential candidates with relevant professional details and a brief explanation of their suitability.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nTalent Research Records: Structured documentation of sourcing channels, search criteria, and relevant findings.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nOutreach Tracking: Clear records of initial contact attempts, responses, and follow-up status.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nProgress Reports: Periodic summaries of completed research, candidate pipeline development, and outstanding tasks.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nQuality-Controlled Database: An organized, updated collection of candidate records with duplicate checks and consistent formatting.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nSpecific targets, reporting frequency, and delivery milestones will be agreed upon before work begins.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nHow to Apply\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nPlease submit a brief proposal outlining your relevant experience in talent sourcing, recruitment research, or candidate identification.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nYour application should also explain:\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nWhich methods and online resources you would use to identify suitable professionals.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nHow you would evaluate candidate suitability and maintain accurate records.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nHow you would organize your workflow, track progress, and ensure the quality of your findings.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nYour availability and estimated approach to completing the project requirements.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nWe are interested in working with someone who combines initiative, sound research skills, professional communication, and a systematic approach to identifying talent.\u003Cbr \/\u003E\u003Cbr \/\u00 is role. The ideal candidate will possess strong editing skills, a keen eye for detail, and the ability to elevate our existing video content to a superior level. We encourage applicants to review our social media channels to familiarize themselves with our current editing style and content, as we aim to match or exceed this quality.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nFor each project, raw footage will be provided, which may originate from one or two cameras. The majority of final videos are expected to be between 1 minute 15 seconds and 2 minutes 15 seconds in length, with occasional videos extending up to 3 minutes.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nAs part of our selection process, we will conduct a paid editing test. Each candidate will receive raw footage and specific instructions to produce a fully edited final video. The editor who demonstrates the best overall work will be chosen for ongoing projects.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nInitially, the workload will involve approximately 30 to 40 videos per month, with a strong potential for increased volume based on consistent performance and quality. We are committed to establishing a lasting partnership.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nInterested candidates are requested to share their portfolio, confirm their Spanish proficiency, state their availability for 30 to 40 videos per month, outline their typical turnaround times, and provide their rates.\u003Cbr \/\u003E\u003Cbr \/\u003ECategory: \u003Cstrong\u003EDesign \u0026amp; Multimedia\u003C\/strong\u003E\u003Cbr \/\u003ESubcategory: \u003Cstrong\u003EMake or edit a video\u003C\/strong\u003E\u003Cbr \/\u003EWhat do you need?: \u003Cstrong\u003ENew video from existing footage\u003C\/strong\u003E\u003Cbr \/\u003E&quot;,&quot;isHourly&quot;:false,&quot;deadline&quot;:null,&quot;deadlineValue&quot;:&quot;&quot;,&quot;isSearchFeatured&quot;:false,&quot;postedDate&quot;:&quot;Almost an hour ago&quot;,&quot;lastEmployerMessage&quot;:null,&quot;isUrgent&quot; 0 \/ month )\u0022\u003ESpanish Speaking - Comment Va ( $50 \/ month )\u003C\/span\u003E\u003C\/a\u003E&quot;,&quot;url&quot;:&quot;#&quot;,&quot;authorName&quot;:&quot;W. D.&quot;,&quot;description&quot;:&quot;We are seeking a fluent Spanish speaker to manage and grow our online community through active engagement in social media comments. The ideal candidate will serve as the warm and authentic voice of our brand, fostering meaningful interactions and ensuring our audience feels heard and valued. This role involves consistent interaction with followers, initiating conversations, and identifying key community contributions.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nKey Responsibilities:\u003Cbr\/\u003E\n- Respond to comments on our social media posts in a natural, engaging tone.\u003Cbr\/\u003E\n- Ask thoughtful follow-up questions to sustain and deepen conversations.\u003Cbr\/\u003E\n- Pin and highlight standout community comments to increase visibility.\u003Cbr\/\u003E\n- Monitor and flag any spam, hate speech, or content requiring immediate attention.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nRequirements:\u003Cbr\/\u003E\n- Strong understanding of social media dynamics and user behavior.\u003Cbr\/\u003E\n- Ability to adopt a warm, natural writing voice that aligns with our brand\u0026#039;s tone without sounding artificial or scripted.\u003Cbr\/\u003E\n- Flexibility to adapt tone and perspective as needed for different interactions.\u003Cbr\/\u003E\n- Reliable weekday availability for quick check-ins and consistent engagement.\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nGoal: To cultivate an active, engaging, and organically diverse comment section that enhances our brand\u0026#039;s presence and connection with its Spanish-speaking audience.\u003Cbr \/\u003E\u003Cbr \/\u003ECategory: \u003Cstrong\u003ESales \u0026amp; Marketing\u003C\/strong\u003E\u003Cbr \/\u003ESubcategory: \u003Cstrong\u003ECommunity Management\u003C\/strong\u003E\u003Cbr \/\u003EWhat do you need?: \u003Cstrong\u 6#039; and \u0026#039;z\u0026#039; are pronounced as \u0026#039;s\u0026#039;). Please apply only if this is your natural accent; strongly regional accents such as Rioplatense, Caribbean, or Castilian are not suitable for this course.\u003Cbr\/\u003E\n A quiet working environment and a high-quality microphone (e.g., A good headset or USB microphone) are essential for re-recordings. Audio quality comparable to a phone speaker will not pass review.\u003Cbr\/\u003E\n Headphones are mandatory, as they allow you to discern subtle audio details that laptop speakers might obscure.\u003Cbr\/\u003E\n You must use a desktop browser (Chrome or Safari).\u003Cbr\/\u003E\n\u003Cbr\/\u003E\nScope and Compensation:\u003Cbr\/\u003E\n\u003Cbr\/\u003E\n The initial phase will involve a batch comprising the Spanish letter-sound set, along with a small collection of words and minimal pairs. These are short clips requiring careful judgment and re-recording where the machine-generated audio falls short of a native speaker\u0026#039;s ear.\u003Cbr\/\u003E\n We anticipate ongoing batches as we continue to develop and stage more Spanish content, including additional word recordings and sentence clips. We are looking for professionals interested in repeat work.\u003Cbr\/\u003E\n We prioritize careful linguistic judgment over speed; every submitted clip will undergo individual review before final acceptance.\u003Cbr \/\u003E\u003Cbr \/\u003ECategory: \u003Cstrong\u003EWriting \u0026amp; Translation\u003C\/strong\u003E\u003Cbr \/\u003ESubcategory: \u003Cstrong\u003EProofreading\u003C\/strong\u003E\u003Cbr \/\u003EHow many words?: \u003Cstrong\u003EMore than 5,000 words\u003C\/strong\u003E\u003Cbr \/\u003E&quot;,&quot;isHourly&quot;:true,&quot;deadline&quot;:null,&quot;deadlineValue&quot;:&quot;&quot;,&quot;isSearchFeatured&quot;:false,&quot;postedDate&quot;:&quot;2 hours ago&quot;,&quot;lastEmployerMessage&quot;:null,&quot;isUrgent&quot;:false,&quot;projectClientPlanLabel&quot;:null,&quot;showMa
