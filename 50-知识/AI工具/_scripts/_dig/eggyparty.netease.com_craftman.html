<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>创作者平台</title>
    <!-- 转化漏斗 html_load 时间戳：必须在 HTML 解析期记下，SDK 加载后读它补发。
         只记时间不发请求，零网络开销，不影响 FP/FCP。 -->
    <script>
      window.__TRACK_HTML_LOAD_TIME__ = Date.now();
    </script>
    <!-- 首屏骨架屏样式：HTML 到达即可绘制，不依赖主 JS / 登录。
         - 移动端(<600px)按 750 设计稿用 vw 等比（--u = 1 设计 px），与 MobileLayout + MobileHome 布局对齐；
           不用 rem：此时 index.css 里的 root 字号规则可能还没生效。
         - ≥600px 只显示居中加载点。
         - 兼容 Chrome 60 / iOS 11：不用 flex gap、aspect-ratio。
         - 类名须含 "skeleton"：SDK 白屏监控据此识别为「加载中」。
         骨架 DOM 同时被 src/components/AppSkeleton.tsx 复用（React 接管后的登录/懒加载等待态），改结构时两边一起看。 -->
    <style>
      body {
        margin: 0;
      }
      .app-skeleton {
        --u: calc(100vw / 750);
        box-sizing: border-box;
        min-height: 100vh;
        background: #f0f0f0;
      }
      .app-skeleton *,
      .app-skeleton *::before,
      .app-skeleton *::after {
        box-sizing: border-box;
      }
      .app-skeleton__mobile {
        display: none;
      }
      .app-skeleton__desktop {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .app-skeleton__dot {
        width: 0.625rem;
        height: 0.625rem;
        margin: 0 0.3125rem;
        border-radius: 50%;
        background: #f6b93b;
        animation: app-skeleton-dot 1.2s ease-in-out infinite;
      }
      .app-skeleton__dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .app-skeleton__dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes app-skeleton-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (max-width: 599px) {
        .app-skeleton__mobile {
          display: block;
        }
        .app-skeleton__desktop {
          display: none;
        }
      }
      .app-skeleton__header {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 60;
        width: 100%;
        height: calc(var(--u) * 172);
        background: #fad06c linear-gradient(180deg, #fbd67c 0%, #f9cd66 100%);
      }
      .app-skeleton__menu,
      .app-skeleton__title,
      .app-skeleton__avatar {
        position: absolute;
        background: rgba(255, 255, 255, 0.55);
      }
      .app-skeleton__menu {
        left: calc(var(--u) * 33);
        bottom: calc(var(--u) * 45);
        width: calc(var(--u) * 60);
        height: calc(var(--u) * 60);
        border-radius: calc(var(--u) * 12);
      }
      .app-skeleton__title {
        left: 50%;
        bottom: calc(var(--u) * 38);
        width: calc(var(--u) * 176);
        height: calc(var(--u) * 34);
        border-radius: calc(var(--u) * 8);
        transform: translateX(-50%);
      }
      .app-skeleton__avatar {
        right: calc(var(--u) * 36);
        bottom: calc(var(--u) * 35);
        width: calc(var(--u) * 76);
        height: calc(var(--u) * 76);
        border-radius: 50%;
      }
      .app-skeleton__body {
        padding: calc(var(--u) * 200) calc(var(--u) * 42) calc(var(--u) * 42);
      }
      .app-skeleton__body > * + * {
        margin-top: calc(var(--u) * 24);
      }
      .app-skeleton__banner {
        width: 100%;
        height: 0;
        padding-top: 56.29%;
        border-radius: calc(var(--u) * 12);
        background: #e3e3e3;
      }
      .app-skeleton__card {
        padding: calc(var(--u) * 24);
        border-radius: calc(var(--u) * 19);
        background: #fff;
      }
      .app-skeleton__bar {
        border-radius: calc(var(--u) * 6);
        background: #ececec;
      }
      .app-skeleton__card-title {
        width: calc(var(--u) * 168);
        height: calc(var(--u) * 36);
      }
      .app-skeleton__row {
        height: calc(var(--u) * 44);
        margin-top: calc(var(--u) * 16);
      }
      .app-skeleton__tiles {
        display: flex;
        margin-top: calc(var(--u) * 20);
        overflow: hidden;
      }
      .app-skeleton__tile {
        flex: 0 0 auto;
        width: calc(var(--u) * 250);
        height: calc(var(--u) * 200);
        border-radius: calc(var(--u) * 8);
      }
      .app-skeleton__tile + .app-skeleton__tile {
        margin-left: calc(var(--u) * 4);
      }
      .app-skeleton__map {
        height: calc(var(--u) * 220);
        margin-top: calc(var(--u) * 16);
        border-radius: calc(var(--u) * 12);
      }
      .app-skeleton__banner,
      .app-skeleton__bar {
        animation: app-skeleton-pulse 1.4s ease-in-out infinite;
      }
      @keyframes app-skeleton-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-skeleton__banner,
        .app-skeleton__bar,
        .app-skeleton__dot {
          animation: none;
        }
      }

      /* React 接管后的变体（AppSkeleton variant="content"）：嵌在 MobileLayout 的真实 header 之下 */
      .app-skeleton-host--content .app-skeleton {
        min-height: 0;
      }
      .app-skeleton-host--content .app-skeleton__header {
        display: none;
      }
      .app-skeleton-host--content .app-skeleton__body {
        padding-top: calc(var(--u) * 28);
      }
      .app-skeleton-host--content .app-skeleton__desktop {
        min-height: 50vh;
      }
    </style>
    <script type="module" crossorigin src="https://u5.gsf.netease.com/epcp_cn_pc_1.0.6d2191a9/js/index.js"></script>
    <link rel="stylesheet" crossorigin href="https://u5.gsf.netease.com/epcp_cn_pc_1.0.6d2191a9/css/index.css">
  </head>
  <body>
    <div id="root"><div class="app-skeleton" aria-hidden="true"><div class="app-skeleton__mobile"><div class="app-skeleton__header"><div class="app-skeleton__menu"></div><div class="app-skeleton__title"></div><div class="app-skeleton__avatar"></div></div><div class="app-skeleton__body"><div class="app-skeleton__banner"></div><div class="app-skeleton__card"><div class="app-skeleton__bar app-skeleton__card-title"></div><div class="app-skeleton__bar app-skeleton__row"></div><div class="app-skeleton__bar app-skeleton__row"></div><div class="app-skeleton__bar app-skeleton__row"></div><div class="app-skeleton__bar app-skeleton__row"></div></div><div class="app-skeleton__card"><div class="app-skeleton__bar app-skeleton__card-title"></div><div class="app-skeleton__tiles"><div class="app-skeleton__bar app-skeleton__tile"></div><div class="app-skeleton__bar app-skeleton__tile"></div><div class="app-skeleton__bar app-skeleton__tile"></div></div></div><div class="app-skeleton__card"><div class="app-skeleton__bar app-skeleton__card-title"></div><div class="app-skeleton__bar app-skeleton__map"></div><div class="app-skeleton__bar app-skeleton__map"></div></div></div></div><div class="app-skeleton__desktop"><span class="app-skeleton__dot"></span><span class="app-skeleton__dot"></span><span class="app-skeleton__dot"></span></div></div></div>
  </body>
</html>
