<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  background:#eaf1f5;color:#2c3a44}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:46px 52px 74px;gap:20px}
/* 每个 block 均分可用高度，内容垂直居中 —— 消除留白与溢出的关键 */
.blk{flex:1 1 0;display:flex;flex-direction:column;justify-content:center;min-height:0}
.blk.fixed{flex:0 0 auto}

/* 标签条 */
.tag{align-self:center;background:#c0392b;color:#eaf1f5;font-size:26px;font-weight:900;
  padding:10px 30px;border-radius:44px;letter-spacing:1px}
/* 大标题 */
h1,h2{text-align:center;font-weight:900;color:#fff;-webkit-text-stroke:14px #8e2f24;
  paint-order:stroke fill;letter-spacing:-4px;padding:10px 0;line-height:1.26}
h1{font-size:84px} h2{font-size:76px}
h1 em,h2 em{font-style:normal;color:#c0392b;-webkit-text-stroke:14px #8e2f24}
.lead{text-align:center;font-size:25px;color:#7f929c;margin-top:10px;font-weight:700}

/* 图片 */
.photo{border-radius:20px;overflow:hidden;border:2px solid #d6e1e6;flex:1 1 0;min-height:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* 步骤条 */
.steps{display:flex;flex-direction:column;gap:16px}
.step{background:#ffffff;border-radius:18px;padding:26px 30px;display:flex;gap:20px;
  border:2px solid #d6e1e6;align-items:center}
.step .n{width:60px;height:60px;border-radius:14px;flex:0 0 60px;background:#c0392b;
  color:#eaf1f5;font-size:29px;font-weight:900;display:flex;align-items:center;justify-content:center}
.step .st{font-size:28px;font-weight:900;line-height:1.3}
.step .sd{font-size:21px;color:#7f929c;line-height:1.55;margin-top:5px}
.step .sd b{color:#c0392b;font-weight:900}

/* 卡片组 */
.cards{display:flex;gap:14px}
.card{flex:1;background:#ffffff;border-radius:16px;padding:24px 20px;border:2px solid #d6e1e6}
.card .cn{font-size:22px;font-weight:900;color:#c0392b;letter-spacing:2px}
.card .ct{font-size:27px;font-weight:900;line-height:1.26;margin-top:8px}
.card .cd{font-size:20px;color:#7f929c;line-height:1.48;margin-top:7px}
.card .cd b{color:#c0392b;font-weight:900}

/* 行表 */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:16px;padding:16px 0;border-bottom:2px dashed #d6e1e6;align-items:flex-start}
.row:last-child{border-bottom:0}
.row .k{flex:0 0 200px;font-size:24px;font-weight:900}
.row .v{flex:1;font-size:21px;color:#7f929c;line-height:1.5}
.row .v b{color:#c0392b;font-weight:900}

/* 文字块 */
.text{background:#ffffff;border-radius:18px;padding:28px 32px;border-left:9px solid #c0392b}
.text .th{font-size:26px;font-weight:900;color:#c0392b;letter-spacing:1px}
.text .tl{margin-top:12px;font-size:23px;line-height:1.72}
.text .tl b{font-weight:900}
.text.warn{border-left-color:#e0453c}
.text.warn .th{color:#e0453c}

/* 结论压条 */
.bar{background:#c0392b;border-radius:16px;padding:22px 30px;text-align:center}
.bar .b1{font-size:21px;font-weight:900;color:#eaf1f5;letter-spacing:2px;opacity:.75}
.bar .b2{font-size:27px;font-weight:900;color:#eaf1f5;line-height:1.4;margin-top:8px}

.src{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:17px;
  color:#7f929c;opacity:.8}
