<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>二期5 · 你管它叫什么</title><style>
*{margin:0;padding:0;box-sizing:border-box}

  <div class="ask">我只会搜“猫吐毛球”这四个字。</div>
  <h1>换个说法，<em>一样能对上号</em></h1>
  <div class="sub">毛球、化毛、肚子里有毛，说的都是同一件事</div>

  <div class="sbox"><svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#8a9099" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#8a9099" stroke-width="2.4" stroke-linecap="round"/></svg><div class="kw">猫吐毛球<span class="caret"></span></div></div>

  <div class="sug">
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫吐毛球是什么原因</span><span class="hot">热</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫吐毛球 一长条</span><span class="hot">热</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫换毛季 老是吐</span><span class="hot">热</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫肚子里有毛 怎么办</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫吐出来像一只袜子</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫便便里全是毛</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>化毛膏 到底有没有用</span></div>
<div class="sg"><svg class="m" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="7" stroke="#b9bfc7" stroke-width="2.4"/><path d="M15.8 15.8 L21 21" stroke="#b9bfc7" stroke-width="2.4" stroke-linecap="round"/></svg><span>猫毛球症 怎么排出来</span></div>
  </div>

  <div class="who">不会写代码的铲屎官不是好厨子，爱用数据说话。我供养了7条主子，期间发生了很多问题。主子们多灾多难，我也“久病成医”了。所有心得记录在此，希望对余华们有所帮助。</div>
