<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  position:relative}

body{background:#f6f5f0;padding:58px 52px 78px;display:flex;flex-direction:column;height:1656px}
.tag{align-self:center;background:#2f4a3c;color:#e6ddc9;font-size:26px;font-weight:900;
  padding:10px 30px;border-radius:44px}
h2{font-size:80px;font-weight:900;line-height:1.26;text-align:center;margin-top:22px;color:#fff;
  -webkit-text-stroke:13px #2f4a3c;paint-order:stroke fill;letter-spacing:-3px;padding:6px 0}
h2 em{font-style:normal;color:#b5462f}

.sec{margin-top:30px;font-size:28px;font-weight:900;color:#2f4a3c;padding-left:16px;
  border-left:10px solid #3f8f5f;letter-spacing:1px}
.dos{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.do{background:#fff;border-radius:16px;padding:26px 28px;display:flex;gap:22px;align-items:center;
  box-shadow:0 6px 20px rgba(47,74,60,.09);border:4px solid #d8eadf}
.ck{width:56px;height:56px;border-radius:50%;flex:0 0 56px;background:#3f8f5f;color:#fff;
  font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.dt{font-size:29px;font-weight:900;color:#2f4a3c;line-height:1.3}
.dd{font-size:22px;color:#6b7263;line-height:1.5;margin-top:6px}

.sec2{margin-top:28px;font-size:28px;font-weight:900;color:#b5462f;padding-left:16px;
  border-left:10px solid #b5462f;letter-spacing:1px}
.dont{margin-top:16px;background:#2f4a3c;border-radius:18px;padding:28px 30px}
.dont .dl{font-size:24px;color:#e0e8e0;line-height:1.75}
.dont .dl b{color:#e6ddc9;font-weight:900}
.dont .dl .x{color:#b5462f;font-weight:900;margin-right:8px}
.src{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:17px;color:#9aa090}
</style></head><body>
<div class="tag">主线只有一条：把水提上来</div>
<h2>该做 3 件<br>别做 3 件</h2>

<div class="sec">要做的</div>
<div class="dos">
  <div class="do"><div class="ck">1</div><div>
    <div class="dt">干粮换一部分湿粮</div>
    <div class="dd">粮里加温水也行。水进去，尿就不那么浓</div></div></div>
  <div class="do"><div class="ck">2</div><div>
    <div class="dt">水点加到 3–4 处</div>
    <div class="dd">猫不爱在食盆边喝水，<b>多点位比换个贵水碗有效</b></div></div></div>
  <div class="do"><div class="ck">3</div><div>
    <div class="dt">每天换水、每天洗碗</div>
    <div class="dd">碗壁滑腻它会直接不喝；冬天水太凉也不喝，试温水</div></div></div>
</div>

<div class="sec2">别做的</div>
<div class="dont">
  <div class="dl">
    <div><span class="x">✕</span>别照着「防结石」三个字乱买处方粮——<b>先确认是哪一类</b></div>
    <div style="margin-top:12px"><span class="x">✕</span>别信玉米须水、化石茶、喝醋排石——<b>对猫没有依据</b></div>
    <div style="margin-top:12px"><span class="x">✕</span>别长期自制猫饭——<b>钙磷比例和盐最难拿捏</b></div>
  </div>
</div>
<div class="src">依据《2025 iCatCare 共识》第 8 节：多处自由饮水 ·《默克兽医手册》尿石症条目</div>
</body></html>
