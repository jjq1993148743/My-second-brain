<div class="rows">
<div class="row">
      <div class="ic" style="background:#2f4a3c">捻</div>
      <div class="tx"><div class="t">铲的时候指尖捻一下</div><div class="d">有研磨感 = 有砂；没有 = 只是普通结块。一次就记住这个手感</div></div>
    </div>
<div class="row">
      <div class="ic" style="background:#3f8f5f">接</div>
      <div class="tx"><div class="t">白瓷小碗接一次尿</div><div class="d">静置十几分钟，看碗底有没有细沙状沉淀。照片拍下来比记忆可靠</div></div>
    </div>
<div class="row">
      <div class="ic" style="background:#b5462f">记</div>
      <div class="tx"><div class="t">把发作日期标在日历上</div><div class="d">一年几次 vs 连着来，决定了要不要认真查</div></div>
    </div>
