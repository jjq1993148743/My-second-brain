<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>J1</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f9fb;
  padding:46px 42px 32px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  position:relative;overflow:hidden}
.d1{position:absolute;top:-110px;right:-95px;width:340px;height:340px;border-radius:50%;background:#8ecae6;opacity:.4}
.d2{position:absolute;bottom:-140px;left:-115px;width:380px;height:380px;border-radius:50%;background:#ffd60a;opacity:.3}

.tag{position:relative;z-index:2;background:#0a4d68;color:#fff;font-size:27px;font-weight:900;
  padding:10px 30px;border-radius:44px;letter-spacing:2px;box-shadow:0 6px 0 #062f40}
h1{position:relative;z-index:2;font-size:96px;font-weight:900;line-height:1.05;text-align:center;
  margin-top:20px;color:#fff;-webkit-text-stroke:15px #00293b;paint-order:stroke fill;
  text-shadow:0 9px 0 rgba(0,41,59,.25);letter-spacing:-4px}
h1 em{font-style:normal;color:#ffd60a}
.sub{position:relative;z-index:2;margin-top:16px;font-size:31px;font-weight:900;color:#00293b;
  background:#ffd60a;padding:10px 26px;border-radius:12px;transform:rotate(-1.5deg);
  box-shadow:0 5px 0 #d4a900}

/* 对比区：用插画示意，不用别人照片 */
.compare{position:relative;z-index:2;margin-top:34px;width:100%;display:flex;gap:22px}
.side{flex:1;background:#fff;border-radius:22px;padding:28px 24px;box-shadow:0 8px 22px rgba(0,60,80,.12)}
.side.no{border:4px solid #e5484d}
.side.ok{border:4px solid #2e9e5b}
.side .st{font-size:31px;font-weight:900;margin-bottom:20px}
.side.no .st{color:#8a1f1f}
.side.ok .st{color:#1c5b34}
.li{font-size:24px;line-height:1.5;color:#3a4a52;padding:13px 0;border-bottom:1px dashed #e0e8ec}
.li:last-child{border-bottom:none}
.li b{color:#0a4d68;font-weight:900}

.why{position:relative;z-index:2;margin-top:30px;width:100%;background:#00293b;border-radius:20px;
  padding:30px 34px;box-shadow:0 8px 24px rgba(0,41,59,.25)}
.why .wt{font-size:30px;font-weight:900;color:#ffd60a}
.why .wd{font-size:24px;line-height:1.65;color:#c5d5dd;margin-top:12px}
.why .wd b{color:#fff}

.foot{position:relative;z-index:2;margin-top:22px;font-size:19px;color:#7a8a92;text-align:center}
</style></head><body>
<div class="d1"></div><div class="d2"></div>

<div class="tag">养猫 7 年 · 最容易白花钱的一条</div>
<h1>黑下巴擦不掉<br>元凶是<em>那个碗</em></h1>
<div class="sub">换碗比买任何东西都管用</div>

<div class="compare">
  <div class="side no">
    <div class="st">塑料碗在做什么</div>
    <div class="li">碗面全是<b>细划痕</b></div>
    <div class="li">划痕里藏油、藏菌</div>
    <div class="li">下巴天天泡在里面</div>
    <div class="li">你擦得再勤也赶不上</div>
  </div>
  <div class="side ok">
    <div class="st">换成什么</div>
    <div class="li"><b>不锈钢</b>或陶瓷</div>
    <div class="li">表面光滑没划痕</div>
    <div class="li">每天洗、每天擦干</div>
    <div class="li">很多黑点光靠这个就能下去</div>
  </div>
</div>

<div class="why">
  <div class="wt">为什么这条最值得先做</div>
  <div class="wd">黑下巴最常见的原因是<b>油脂分泌旺 + 塑料碗</b>。猫的舌头舔不到自己下巴，这块全靠人帮。换碗不花钱、当天就能做，比买祛痘膏、换粮都直接。</div>
</div>

<div class="foot">《猫病学》第 5 版 第 1 篇第 2 条「痤疮」｜第 67 条「嗜酸性肉芽肿复合物」</div>
</body></html>
