<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>J2</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f9fb;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center}
.hd{text-align:center}
.tag{display:inline-block;background:#0a4d68;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:76px;font-weight:900;line-height:1.1;margin-top:18px;color:#00293b;letter-spacing:-2px}
h1 em{font-style:normal;color:#e5484d}
.sub{font-size:28px;color:#7a8a92;margin-top:14px}

.tbl{margin-top:56px;display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:22px;background:#fff;border-radius:18px;
  padding:34px 32px;box-shadow:0 4px 14px rgba(0,60,80,.08)}
.n{width:66px;height:66px;border-radius:33px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:#fff;flex-shrink:0;line-height:1.1;text-align:center}
.tx{flex:1}
.tx .a{font-size:33px;font-weight:900;color:#00293b;line-height:1.28}
.tx .b{font-size:24px;color:#6a7a82;margin-top:7px;line-height:1.45}
.tx .b b{color:#e5484d;font-weight:900}
.g .n{background:#2e9e5b}
.y .n{background:#f0a52e}
.r .n{background:#e5484d}
.tag-l{font-size:21px;font-weight:900;padding:9px 18px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.g .tag-l{background:#e3f2e8;color:#1c5b34}
.y .tag-l{background:#fdf3dd;color:#7a5206}
.r .tag-l{background:#fbe3e3;color:#8a1f1f}

.foot{margin-top:48px;font-size:20px;color:#8a9aa2;text-align:center;line-height:1.6}
</style></head><body>

<div class="hd">
  <div class="tag">先分清是哪一档，再决定要不要动手</div>
  <h1>黑下巴分<em>3 档</em><br>第 3 档别再擦了</h1>
  <div class="sub">第 1 档在家能管，第 3 档得让医生定方向</div>
</div>

<div class="tbl">

  <div class="row g">
    <div class="n">第<br>1<br>档</div>
    <div class="tx">
      <div class="a">只是煤渣样黑点</div>
      <div class="b">像沾了煤渣，摸上去干、不烫不疼，能一颗颗看见</div>
    </div>
    <div class="tag-l">换碗 + 每天擦</div>
  </div>

  <div class="row y">
    <div class="n">第<br>2<br>档</div>
    <div class="tx">
      <div class="a">油腻、有小硬粒、冒白头</div>
      <div class="b">摸着油，有硬粒，重的时候冒白头、结痂、掉几撮毛</div>
    </div>
    <div class="tag-l">擦三天看趋势</div>
  </div>

  <div class="row r">
    <div class="n">第<br>3<br>档</div>
    <div class="tx">
      <div class="a">嘴唇肿厚外翻、下巴溃烂流脓</div>
      <div class="b">嘴角发红、烂、结痂；连嘴里也一起烂，吃两口停一下、流口水。<b>这已经不是黑下巴</b></div>
    </div>
    <div class="tag-l">尽快看一次</div>
  </div>

</div>

<div class="foot">第 3 档走的是另一类反应（免疫相关），不是"洗洗就好"<br>《猫病学》第 5 版 第 1 篇第 2 条「痤疮」｜第 67 条「嗜酸性肉芽肿复合物」</div>
</body></html>
