<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>二期5 · 你管它叫什么</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html, body { width:1242px; height:1656px; }
body { font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif; background:#fbf7f1; color:#14161a; padding:0 56px; display:flex; flex-direction:column; justify-content:center; }
.ask { font-size:40px; font-weight:800; color:#e5484d; line-height:1.4; }
h1 { font-size:68px; font-weight:900; line-height:1.18; margin-top:20px; }
h1 em { font-style:normal; color:#e5484d; }
.sub { font-size:33px; color:#4a5159; margin-top:20px; line-height:1.5; }
.groups { margin-top:38px; flex:none; display:flex; flex-direction:column; gap:42px; }
.grp { display:flex; flex-direction:column; gap:16px; }
.gl { font-size:29px; font-weight:800; color:#8a9099; }
.chips { display:flex; flex-wrap:wrap; gap:14px; }
.chip { font-size:34px; font-weight:700; border-radius:14px; padding:18px 30px; }
.c1 { background:#eef7f1; color:#1f7a44; }
.c2 { background:#fdf6ea; color:#b3791a; }
.c3 { background:#fdf1f1; color:#c93a3f; }
.who { margin-top:40px; font-size:27px; color:#8a9099; line-height:1.5; }
</style></head><body>

  <div class="ask">这事儿，我平时只会说“它不吃饭”。</div>
  <h1>说法五花八门，<em>指的是同一件事</em></h1>
  <div class="sub">不管你怎么搜，这儿都接得住</div>

  <div class="groups">
<div class="grp"><div class="gl">平时这么说</div><div class="chips"><span class="chip c1">不吃饭</span><span class="chip c1">没胃口</span><span class="chip c1">食欲差</span><span class="chip c1">厌食</span><span class="chip c1">拒食</span><span class="chip c1">挑食</span><span class="chip c1">不肯吃粮</span><span class="chip c1">含住又吐出来</span></div></div>
<div class="grp"><div class="gl">各地的老话</div><div class="chips"><span class="chip c2">伤食</span><span class="chip c2">不吃食儿</span><span class="chip c2">倒了胃口（北方）</span><span class="chip c2">米水不进</span></div></div>
<div class="grp"><div class="gl">网上的说法</div><div class="chips"><span class="chip c3">拒碗</span><span class="chip c3">绝食抗议</span><span class="chip c3">饭来张口失败</span></div></div>
  </div>

  <div class="who">不会写代码的铲屎官不是好厨子，爱用数据说话。我供养了7条主子，期间发生了很多问题。主子们多灾多难，我也“久病成医”了。所有心得记录在此，希望对余华们有所帮助。</div>
</body></html>
