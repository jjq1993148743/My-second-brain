<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>二期4 · 先做这一件事</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html, body { width:1242px; height:1656px; }
body { font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif; background:#ffffff; color:#14161a; padding:0 48px; display:flex; flex-direction:column; justify-content:center; }
.ask { font-size:35px; font-weight:800; color:#e5484d; line-height:1.38; }
h1 { font-size:60px; font-weight:900; line-height:1.18; margin-top:12px; }
h1 em { font-style:normal; color:#e5484d; }
.sub { font-size:31px; color:#6b7280; margin-top:14px; }
.cards { margin-top:30px; flex:none; display:flex; flex-direction:column; gap:22px; }
.card { border-radius:20px; border:2px solid #dcecdf; background:#f4faf6; padding:32px 40px; display:flex; align-items:center; gap:28px; }
.no { flex:0 0 76px; height:76px; border-radius:50%; background:#2e9e5b; color:#fff; font-size:40px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.body { flex:1; }
.t { font-size:35px; font-weight:800; line-height:1.3; }
.w { font-size:28px; color:#5b636c; margin-top:10px; line-height:1.45; }
.foot { margin-top:22px; font-size:26px; color:#3d444d; line-height:1.5; background:#f7f8fa; border-radius:14px; padding:18px 24px; }
.foot b { color:#e5484d; }
</style></head><body>

  <div class="ask">换粮、买开胃的，都先放一放。大多数“不吃”，改喂法三天就有答案。</div>
  <h1>先做这 3 件事，<em>都跟喂法有关</em></h1>
  <div class="sub">不用吃药，也不用买东西</div>

  <div class="cards">
<div class="card"><div class="no">1</div><div class="body"><div class="t">先停一切加餐</div><div class="w">零食、冻干、罐头、人食全停 3 天，只留正餐和水。一天好几顿垫着，正餐当然不香。</div></div></div>
<div class="card"><div class="no">2</div><div class="body"><div class="t">一天的量拆成 4–6 小顿</div><div class="w">凉粮一律加温水拌到不烫手，换宽口浅盘，端去它常待的安静角落。</div></div></div>
<div class="card"><div class="no">3</div><div class="body"><div class="t">空盆满 24 小时就带去看</div><div class="w">别拖到第二天。幼猫和偏胖的猫当天就该动手。</div></div></div>
  </div>

  <div class="foot"><b>时间线：</b>三天还没好转 → 别自己硬试了，带上记录去医院。<br>症状不等于诊断，最终由兽医排查。</div>
</body></html>
