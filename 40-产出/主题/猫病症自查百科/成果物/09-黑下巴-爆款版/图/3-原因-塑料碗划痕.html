<div class="rows">
  <div class="row"><div class="ic">1</div><div class="tx">塑料碗面全是<b>细划痕</b>，肉眼看着干净，其实沟槽里藏油藏菌</div></div>
  <div class="row"><div class="ic">2</div><div class="tx">猫吃饭时下巴<b>天天泡在里面</b>，你擦得再勤也赶不上它脏得快</div></div>
</div>

<div class="why">
  <div class="wt">为什么偏偏是下巴</div>
  <div class="wd">猫的舌头<b>舔不到自己下巴</b>，这块全靠人帮。油脂腺又集中在下巴，出油一旺、碗一脏，毛孔就堵。</div>
