<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;position:relative}

body{background:#fdf9f3;padding:60px 56px 78px;display:flex;flex-direction:column;height:1656px}
.tag{align-self:center;background:#7a3e1d;color:#fff;font-size:27px;font-weight:900;
  padding:10px 30px;border-radius:44px}
h2{font-size:84px;font-weight:900;line-height:1.22;padding:8px 0;text-align:center;margin-top:24px;color:#fff;
  -webkit-text-stroke:14px #3b1a08;paint-order:stroke fill;letter-spacing:-3px}
h2 em{font-style:normal;color:#ffd60a}

.sec{margin-top:34px;font-size:30px;font-weight:900;color:#7a3e1d;padding-left:16px;
  border-left:10px solid #ffd60a}
.steps{margin-top:20px;display:flex;flex-direction:column;gap:20px;flex:1;justify-content:center}
.step{flex:1;background:#fff;border-radius:20px;padding:30px 30px;display:flex;gap:22px;
  box-shadow:0 7px 20px rgba(80,40,10,.10);align-items:center}
.sn{width:64px;height:64px;border-radius:50%;flex:0 0 64px;background:#7a3e1d;color:#fff;
  font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center}
.st{font-size:32px;font-weight:900;color:#3b1a08;line-height:1.3}
.step .txt{flex:1;display:flex;flex-direction:column;justify-content:center}
.sd{font-size:24px;color:#6b5747;line-height:1.55;margin-top:8px}
.sd b{color:#c0392b;font-weight:900}

.dont{margin-top:30px;background:#3b1a08;border-radius:20px;padding:28px 32px}
.dont .dt{font-size:28px;font-weight:900;color:#ff9f9f}
.dont .dd{font-size:24px;color:#e5d5c8;line-height:1.68;margin-top:12px}
.dont .dd b{color:#ffd60a}
.src{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:18px;color:#a89886}
</style></head><body>
<div class="tag">每天三分钟，比买任何药都管用</div>
<h2>在家就做<em>三步</em></h2>

<div class="sec">要做的</div>
<div class="steps">
  <div class="step"><div class="sn">1</div><div class="txt"><div class="st">换碗</div>
    <div class="sd">塑料的全换成<b>不锈钢或陶瓷</b>，每天洗。这一步最见效、最省钱，很多黑点光靠它就能下去。</div></div></div>
  <div class="step"><div class="sn">2</div><div class="txt"><div class="st">温水泡软再擦</div>
    <div class="sd">温水或生理盐水打湿棉柔巾，敷一下让油垢软了再轻擦，<b>别硬抠黑粒</b>。</div></div></div>
  <div class="step"><div class="sn">3</div><div class="txt"><div class="st">擦完必须擦干</div>
    <div class="sd">湿哒哒捂着反而容易起红疹。每天顺手擦，比隔一周来一次大洗有用得多。</div></div></div>
</div>

<div class="dont">
  <div class="dt">千万别做</div>
  <div class="dd">
    ✕ 涂<b>人用祛痘膏、牙膏、酒精</b>——刺激猫的皮肤，还可能被它舔进嘴<br>
    ✕ 用<b>含激素</b>的药膏自己上<br>
    ✕ 黑点还没分清就<b>换粮</b>——先换碗，粮最后再动
  </div>
</div>
<div class="src">《猫病学》第 5 版 第 1 篇第 2 条「痤疮」｜本期不涉及任何用药，用药须凭宠物医院处方</div>
</body></html>
