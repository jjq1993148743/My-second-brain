  <div class="two">
    <div class="card c1">
      <div class="ch">换软食之前</div>
      <div class="ct">叼起来、含两下、掉出去</div>
      <div class="cd">再用另一边嚼，或者走到饭盆前<b>张嘴想咬又"咔"一声跳开</b>——它饿，但不敢吃</div>
    </div>
    <div class="card c2">
      <div class="ch">换软食之后</div>
      <div class="ct">泡软的能大口吃</div>
      <div class="cd">同样的粮、温水泡到不烫手，<b>它吃得下 → 证明不是没食欲，是咬不动</b></div>
    </div>
  </div>

  <div class="key">
    <div class="kh">这个对比本身就是一次诊断</div>
    <div class="kl">很多人以为"它最近吃得少"是胃口问题，换软食试一顿就分清了。<b>先把热量保住</b>，再谈治牙——嘴疼的猫掉体重非常快，饿几天比牙病本身更危险。</div>
  </div>
