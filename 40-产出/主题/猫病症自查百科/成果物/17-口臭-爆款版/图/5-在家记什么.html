  <div class="table">
    <div class="th"><div>记什么</div><div>怎么记</div></div>
    <div class="tr"><div class="c1">体重</div><div class="c2">每两周固定一天称。<b>嘴疼的猫掉体重非常快</b>，这是判断严重程度最直观的一格</div></div>
    <div class="tr"><div class="c1">碗底</div><div class="c2">每天看一眼有没有<b>一圈粉红色血水</b></div></div>
    <div class="tr"><div class="c1">下巴毛</div><div class="c2">是不是总湿、结绺、发褐，<b>甚至带血丝</b>——口水拉丝的痕迹</div></div>
  </div>

  <div class="multi">
    <div class="mh">多猫家庭：别共用食盆和勺子</div>
    <div class="ml">口炎本身不传染，但<b>引起口炎的病原（尤其杯状病毒）靠共用碗和接触传播</b>。一只确诊，碗、勺子、水碗立刻分开。</div>
  </div>
