<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>二期3 · 几天算不正常</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html, body { width:1242px; height:1656px; }
body { font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif; background:#ffffff; color:#14161a; padding:0 48px; display:flex; flex-direction:column; justify-content:center; }
.ask { font-size:35px; font-weight:800; color:#e5484d; line-height:1.38; }
h1 { font-size:60px; font-weight:900; line-height:1.18; margin-top:12px; }
h1 em { font-style:normal; color:#e5484d; }
.sub { font-size:31px; color:#6b7280; margin-top:14px; }
.cards { margin-top:30px; flex:none; display:flex; flex-direction:column; gap:22px; }
.card { border-radius:20px; border:2px solid; padding:32px 40px; display:flex; flex-direction:column; justify-content:center; }
.card .freq { font-size:46px; font-weight:900; }
.card .say { font-size:32px; font-weight:700; margin-top:12px; line-height:1.38; }
.card .why { font-size:28px; color:#5b636c; margin-top:10px; line-height:1.45; }
.g { background:#eef7f1; border-color:#cfe8da; } .g .freq { color:#2e9e5b; }
.a { background:#fdf6ea; border-color:#f3e2c2; } .a .freq { color:#c98a1a; }
.r { background:#fdf1f1; border-color:#f3d2d2; } .r .freq { color:#e5484d; }
.foot { margin-top:22px; font-size:26px; color:#5b636c; line-height:1.5; background:#f7f8fa; border-radius:14px; padding:18px 24px; }
.foot b { color:#14161a; }
</style></head><body>

  <div class="ask">我一开始总觉得“再等等看”。</div>
  <h1>拖到第几天，<em>就别等了？</em></h1>
  <div class="sub">从“再看看”到“别等了”，中间有一条线</div>

  <div class="cards">
<div class="card g"><div class="freq">偶尔一次</div><div class="say">精神照旧、照吃照玩，第二天就好了</div><div class="why">不用管，看下一顿。</div></div>
<div class="card a"><div class="freq">连着 1–2 天</div><div class="say">一天几次都不成形，但还肯吃、还肯玩</div><div class="why">开始记账：每天拍一张、数次数，同时做两周“减法”。</div></div>
<div class="card r"><div class="freq">超过 3 天、或这几种</div><div class="say">幼猫、精神垮了、不喝水、便里血多</div><div class="why">当天带去看，别在家灌药。</div></div>
  </div>

  <div class="foot"><b>怎么记（就四样）：</b>哪天、拉了几次、成形几次、拍一张照。<br>手机里单开一页，三天后这一页顶得上一沓检查单。</div>
</body></html>
