<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>二期5 · 你管它叫什么</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html, body { width:1242px; height:1656px; }
body { font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif; background:#fbf7f1; color:#14161a; padding:0 84px; display:flex; flex-direction:column; justify-content:center; }
.ask { font-size:40px; font-weight:800; color:#e5484d; line-height:1.4; }
h1 { font-size:64px; font-weight:900; line-height:1.18; margin-top:20px; }
h1 em { font-style:normal; color:#e5484d; }
.sub { font-size:32px; color:#4a5159; margin-top:18px; line-height:1.5; }
.chat { margin-top:38px; display:flex; flex-direction:column; gap:16px; }
.bub { display:flex; }
.bub.r { justify-content:flex-end; }
.bub span { max-width:820px; font-size:30px; line-height:1.4; border-radius:20px; padding:20px 28px; background:#fff; border:2px solid #e6e1d8; color:#2b3138; }
.bub.r span { background:#e3f2e8; border-color:#a8d5bb; color:#1c5b34; }
.who { margin-top:40px; font-size:26px; color:#9aa1ab; line-height:1.5; }
</style></head><body>

  <div class="ask">这些话，我一句一句都说过。</div>
  <h1>你问的每一句，<em>都指向同一件事</em></h1>
  <div class="sub">不管你怎么搜，这儿都接得住</div>

  <div class="chat">
<div class="bub "><span>它今天又软了，是不是我喂错了？</span></div>
<div class="bub r"><span>换了粮还是软，到底哪出问题了？</span></div>
<div class="bub "><span>是不是着凉了？</span></div>
<div class="bub r"><span>它精神挺好的，应该没事吧？</span></div>
<div class="bub "><span>擦屁股擦到它开始躲我了……</span></div>
<div class="bub r"><span>要不要喂点益生菌？</span></div>
<div class="bub "><span>我家另一只好像也开始了。</span></div>
  </div>

  <div class="who">不会写代码的铲屎官不是好厨子。爱用数据说话，全网搜罗养猫心得，记录在此，希望对余华们有所帮助。</div>
</body></html>
