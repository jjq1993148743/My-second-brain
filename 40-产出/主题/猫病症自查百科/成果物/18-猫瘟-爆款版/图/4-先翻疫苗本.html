      <div class="cn">01 看几针</div>
      <div class="ct">三针齐不齐</div>
      <div class="cd">幼猫<b>三针少一针都不算完</b></div>
    </div>
    <div class="card">
      <div class="cn">02 看时间</div>
      <div class="ct">末针隔了多久</div>
      <div class="cd">隔太久保护力会掉，<b>不是打一次管一生</b></div>
    </div>

      <div class="cn">03 看记录</div>
      <div class="ct">记录在不在</div>

    <div class="kh">为什么这一栏比症状更优先</div>
    <div class="kl">幼猫「<b>精神差半天 + 没打全三针</b>」这个组合本身就够你当天出门，不用等别的症状凑齐。<b>疫苗打全的室内成年猫，风险低得多</b>——所以先看本子，再看猫。</div>
