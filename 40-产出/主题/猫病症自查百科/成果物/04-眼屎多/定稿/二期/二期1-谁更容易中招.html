<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>二期1 · 谁更容易中招</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html, body { width:1242px; height:1656px; }
body { font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif; background:#ffffff; color:#14161a; padding:0 52px; display:flex; flex-direction:column; justify-content:center; }
.ask { font-size:35px; font-weight:800; color:#e5484d; line-height:1.38; }
h1 { font-size:70px; font-weight:900; line-height:1.18; margin-top:12px; }
h1 em { font-style:normal; color:#e5484d; }
.sub { font-size:31px; color:#6b7280; margin-top:14px; }
.rows { margin-top:30px; flex:none; display:flex; flex-direction:column; gap:18px; }
.row { display:flex; align-items:center; gap:24px; border:2px solid #eef1f4; border-radius:18px; background:#fafbfc; padding:26px 30px; }
.who { flex:0 0 300px; font-size:33px; font-weight:800; color:#e5484d; line-height:1.3; }
.desc { flex:1; font-size:30px; line-height:1.42; }
.foot { margin-top:24px; font-size:24px; color:#8a9099; line-height:1.5; }
</style></head><body>

  <div class="ask">我一直以为眼屎多是“上火”。</div>
  <h1>这几种猫，<em>眼睛最不省心</em></h1>
  <div class="sub">对一下，你家猫在不在里面</div>

  <div class="rows">
<div class="row"><div class="who">幼猫<br>尤其刚领养、没打完疫苗</div><div class="desc">多半和鼻支那条路一起，眼睛只是先露出来的那一处</div></div>
<div class="row"><div class="who">扁脸、眼突的<br>波斯、加菲、喜马拉雅</div><div class="desc">泪管浅、眼睛露在外面，容易干、容易伤</div></div>
<div class="row"><div class="who">长毛猫<br>无毛猫</div><div class="desc">长毛的毛容易扎进眼；无毛猫少了毛的缓冲，一擦就伤</div></div>
<div class="row"><div class="who">散养<br>和外面猫打过照面的</div><div class="desc">疱疹病毒靠接触和飞沫走，出过门的风险不一样</div></div>
<div class="row"><div class="who">冬天屋里干<br>换毛季毛絮多</div><div class="desc">这一段任何品种都会糊眼加重，跟品种没关系</div></div>
  </div>

  <div class="foot">这只是概率，别对号入座。症状不等于诊断，最终由兽医排查。</div>
</body></html>
