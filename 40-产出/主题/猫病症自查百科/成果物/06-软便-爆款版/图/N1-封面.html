<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>N1</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fff8e8;
  padding:44px 40px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  position:relative;overflow:hidden}
.d1{position:absolute;top:-100px;right:-90px;width:320px;height:320px;border-radius:50%;background:#ffe066;opacity:.6}
.d2{position:absolute;bottom:-130px;left:-110px;width:360px;height:360px;border-radius:50%;background:#a8e6cf;opacity:.42}
.tag{position:relative;z-index:2;background:#ff3b30;color:#fff;font-size:27px;font-weight:900;
  padding:10px 28px;border-radius:42px;letter-spacing:2px;box-shadow:0 6px 0 #c41e16}
h1{position:relative;z-index:2;font-size:96px;font-weight:900;line-height:1.04;text-align:center;
  margin-top:18px;color:#fff;-webkit-text-stroke:15px #2b1a00;paint-order:stroke fill;
  text-shadow:0 9px 0 rgba(43,26,0,.22);letter-spacing:-4px}
h1 em{font-style:normal;color:#ffd60a}
.sub{position:relative;z-index:2;margin-top:14px;font-size:31px;font-weight:900;color:#2b1a00;
  background:#ffd60a;padding:9px 24px;border-radius:12px;transform:rotate(-1.5deg);
  box-shadow:0 5px 0 #d4a900}
.hero{position:relative;z-index:2;margin-top:24px;width:100%;height:460px;border-radius:22px;
  overflow:hidden;border:8px solid #fff;box-shadow:0 10px 26px rgba(60,40,0,.2)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
.hero .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:26px;font-weight:900;padding:44px 24px 18px}
.grid{position:relative;z-index:2;margin-top:26px;width:100%;flex:1;align-content:center;
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pic{background:#fff;border-radius:18px;padding:11px 10px 8px;
  box-shadow:0 6px 16px rgba(60,40,0,.13);display:flex;flex-direction:column;align-items:center}
.pic img{width:100%;height:118px;object-fit:contain}
.pic .lb{margin-top:7px;font-size:20px;font-weight:900;color:#2b1a00}
.pic.hi{outline:5px solid #ff3b30;outline-offset:-5px}
.foot{position:relative;z-index:2;margin-top:20px;font-size:19px;color:#8a7a55;text-align:center}
</style></head><body>
<div class="d1"></div><div class="d2"></div>
<div class="tag">养猫第 7 年 · 没去医院</div>
<h1>软便拖了两周<br>我<em>反而</em>把它弄好了</h1>
<div class="sub">第 3 种拖过两周，别在家等</div>

<div class="hero">
  <img src="素材/beer-全身.jpg">
  <div class="cap">啤酒 ｜ 就是它，让我蹲在猫砂盆前<b>看了两周</b></div>
</div>

<div class="grid">
  <div class="pic"><img src="素材3/1L-粪球形.png"><div class="lb">① 干硬球</div></div>
  <div class="pic"><img src="素材3/2L-结荚长条形.png"><div class="lb">② 理想成形</div></div>
  <div class="pic hi"><img src="素材3/2R-软榻但成型.png"><div class="lb">③ 后段糊</div></div>
  <div class="pic"><img src="素材3/4L-粘稠糊状.png"><div class="lb">④ 糊状</div></div>
  <div class="pic hi"><img src="素材3/5L-带血.png"><div class="lb">⑤ 带血</div></div>
  <div class="pic"><img src="素材3/4R-水状.png"><div class="lb">⚠ 水样</div></div>
</div>
<div class="foot">形态对照标准来自 Purina 粪便评分表与《猫病学》第 5 版</div>
</body></html>
