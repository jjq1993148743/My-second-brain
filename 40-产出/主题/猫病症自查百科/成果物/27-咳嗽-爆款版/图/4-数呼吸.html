<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  background:#f7ecd8;color:#4a3c2a}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:46px 52px 74px;gap:20px}
/* 每个 block 均分可用高度，内容垂直居中 —— 消除留白与溢出的关键 */
.blk{flex:1 1 0;display:flex;flex-direction:column;justify-content:center;min-height:0}
.blk.fixed{flex:0 0 auto}

/* 标签条 */
.tag{align-self:center;background:#a56a2a;color:#f7ecd8;font-size:26px;font-weight:900;
  padding:10px 30px;border-radius:44px;letter-spacing:1px}
/* 大标题 */
h1,h2{text-align:center;font-weight:900;color:#fff;-webkit-text-stroke:14px #7d4e1a;
  paint-order:stroke fill;letter-spacing:-4px;padding:10px 0;line-height:1.26}
h1{font-size:84px} h2{font-size:76px}
h1 em,h2 em{font-style:normal;color:#a56a2a;-webkit-text-stroke:14px #7d4e1a}
.lead{text-align:center;font-size:25px;color:#a8936f;margin-top:10px;font-weight:700}

/* 图片 */
.photo{border-radius:20px;overflow:hidden;border:2px solid #ecdcbc;flex:1 1 0;min-height:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* 步骤条 */
.steps{display:flex;flex-direction:column;gap:16px}
.step{background:#ffffff;border-radius:18px;padding:26px 30px;display:flex;gap:20px;
  border:2px solid #ecdcbc;align-items:center}
.step .n{width:60px;height:60px;border-radius:14px;flex:0 0 60px;background:#a56a2a;
  color:#f7ecd8;font-size:29px;font-weight:900;display:flex;align-items:center;justify-content:center}
.step .st{font-size:28px;font-weight:900;line-height:1.3}
.step .sd{font-size:21px;color:#a8936f;line-height:1.55;margin-top:5px}
.step .sd b{color:#a56a2a;font-weight:900}

/* 卡片组 */
.cards{display:flex;gap:14px}
.card{flex:1;background:#ffffff;border-radius:16px;padding:24px 20px;border:2px solid #ecdcbc}
.card .cn{font-size:22px;font-weight:900;color:#a56a2a;letter-spacing:2px}
.card .ct{font-size:27px;font-weight:900;line-height:1.26;margin-top:8px}
.card .cd{font-size:20px;color:#a8936f;line-height:1.48;margin-top:7px}
.card .cd b{color:#a56a2a;font-weight:900}

/* 行表 */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:16px;padding:16px 0;border-bottom:2px dashed #ecdcbc;align-items:flex-start}
.row:last-child{border-bottom:0}
.row .k{flex:0 0 200px;font-size:24px;font-weight:900}
.row .v{flex:1;font-size:21px;color:#a8936f;line-height:1.5}
.row .v b{color:#a56a2a;font-weight:900}

/* 文字块 */
.text{background:#ffffff;border-radius:18px;padding:28px 32px;border-left:9px solid #a56a2a}
.text .th{font-size:26px;font-weight:900;color:#a56a2a;letter-spacing:1px}
.text .tl{margin-top:12px;font-size:23px;line-height:1.72}
.text .tl b{font-weight:900}
.text.warn{border-left-color:#e0453c}
.text.warn .th{color:#e0453c}

/* 结论压条 */
.bar{background:#a56a2a;border-radius:16px;padding:22px 30px;text-align:center}
.bar .b1{font-size:21px;font-weight:900;color:#f7ecd8;letter-spacing:2px;opacity:.75}
.bar .b2{font-size:27px;font-weight:900;color:#f7ecd8;line-height:1.4;margin-top:8px}

.src{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:17px;
  color:#a8936f;opacity:.8}
</style></head><body><div class="page"><div class="blk fixed"><h2>数睡眠<br><em>呼吸</em></h2><div class="lead">真睡着时看肚子起伏</div></div><div class="blk"><div class="text"><div class="th">怎么数</div><div class="tl"><div style="margin-top:12px">真睡着（身体完全松、没做梦）看腹部起伏，数 30 秒乘 2，连数 3 天取平均。</div><div style="margin-top:12px">明显比自己的基线快、或持续超过每分钟 30 次，就去查一次。</div></div></div></div><div class="blk fixed"><div class="bar"><div class="b1">一句话记住</div><div class="b2">白天刚玩完、刚吃完、做梦时数的都不算</div></div></div></div><div class="src">依据《猫病学》第 5 版 第 1 篇第 40 条「咳嗽」· 第 27 条「慢性支气管疾病」· 第 222 条「气管疾病」· 第 60 条「呼吸困难」· 第 87 条「心丝虫病及心丝虫相关呼吸道疾病」· 第 174 条「胸腔积液」</div></body></html>
