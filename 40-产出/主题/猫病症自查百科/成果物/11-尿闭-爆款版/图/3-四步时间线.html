<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  position:relative}

body{background:#f7f4f1;padding:58px 52px 78px;display:flex;flex-direction:column;height:1656px}
.tag{align-self:center;background:#16181d;color:#fff;font-size:26px;font-weight:900;
  padding:10px 30px;border-radius:8px}
h2{font-size:80px;font-weight:900;line-height:1.26;text-align:center;margin-top:22px;color:#fff;
  -webkit-text-stroke:13px #16181d;paint-order:stroke fill;letter-spacing:-3px;padding:6px 0}
h2 em{font-style:normal;color:#ff4d2e}

.cards{margin-top:34px;display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center}
.card{flex:1;background:#fff;border-radius:16px;padding:26px 30px;display:flex;gap:24px;
  box-shadow:0 7px 22px rgba(22,24,29,.10);border-left:12px solid #ccc;align-items:center}
.step{flex:0 0 96px;font-size:22px;font-weight:900;color:#8a8075;letter-spacing:1px}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.t{font-size:34px;font-weight:900;color:#16181d;line-height:1.26}
.d{font-size:23px;color:#6b6157;line-height:1.5;margin-top:8px}
.badge{display:inline-block;align-self:flex-start;margin-top:12px;font-size:21px;font-weight:900;
  padding:7px 18px;border-radius:8px}

.warn{margin-top:24px;background:#ff4d2e;border-radius:16px;padding:26px 30px;text-align:center}
.warn .wt{font-size:32px;font-weight:900;color:#fff;line-height:1.4}
.warn .wd{font-size:22px;color:#ffe0d8;margin-top:8px}
.src{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:17px;color:#9a9186}
</style></head><body>
<div class="tag">这条路走得很快，别用"再看看"耽误</div>
<h2>从蹲盆到危险<br>只有<em>四步</em></h2>

<div class="cards">
<div class="card" style="border-left-color:#2e9e5b">
      <div class="step">第一步</div>
      <div class="body">
        <div class="t">频繁蹲盆</div>
        <div class="d">一小时跑五六次，每次蹲很久，盆里什么都没有</div>
        <span class="badge" style="background:#2e9e5b22;color:#2e9e5b">这时候就该走了</span>
      </div>
    </div>
<div class="card" style="border-left-color:#e8a317">
      <div class="step">第二步</div>
      <div class="body">
        <div class="t">开始叫、舔生殖器</div>
        <div class="d">一边蹲一边叫，出来就舔，后腹摸着发硬</div>
        <span class="badge" style="background:#e8a31722;color:#e8a317">别再观察一晚</span>
      </div>
    </div>
<div class="card" style="border-left-color:#ff4d2e">
      <div class="step">第三步</div>
      <div class="body">
        <div class="t">不吃、呕吐、窝着不动</div>
        <div class="d">精神垮下来，跳不上沙发，后腿发僵</div>
        <span class="badge" style="background:#ff4d2e22;color:#ff4d2e">已经在伤肾了</span>
      </div>
    </div>
<div class="card" style="border-left-color:#8f1a0a">
      <div class="step">第四步</div>
      <div class="body">
        <div class="t">瘫着、呼吸变快、脚垫发凉</div>
        <div class="d">从「频繁蹲」转成「完全不动」，这不是好转</div>
        <span class="badge" style="background:#8f1a0a22;color:#8f1a0a">这是后段</span>
      </div>
    </div>
</div>

<div class="warn">
  <div class="wt">第一步出现，就该出发了</div>
  <div class="wd">不要等第二步、不要等天亮、不要在家喂水喂药等它自己通</div>
</div>
<div class="src">依据《2025 iCatCare 猫下泌尿道疾病共识》：尿道梗阻是危及生命的并发症</div>
</body></html>
