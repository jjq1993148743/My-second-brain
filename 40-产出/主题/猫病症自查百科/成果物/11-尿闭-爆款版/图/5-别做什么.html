<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  position:relative}

body{background:#f7f4f1;padding:58px 52px 78px;display:flex;flex-direction:column;height:1656px}
.tag{align-self:center;background:#ff4d2e;color:#fff;font-size:26px;font-weight:900;
  padding:10px 30px;border-radius:8px}
h2{font-size:82px;font-weight:900;line-height:1.26;text-align:center;margin-top:22px;color:#fff;
  -webkit-text-stroke:13px #16181d;paint-order:stroke fill;letter-spacing:-3px;padding:6px 0}
h2 em{font-style:normal;color:#ff4d2e}

.dont{margin-top:36px;display:flex;flex-direction:column;gap:20px;flex:1;justify-content:center}
.d{flex:1;background:#fff;border-radius:16px;padding:30px;display:flex;gap:24px;
  align-items:center;box-shadow:0 7px 22px rgba(22,24,29,.10);border:4px solid #ffd9d1}
.x{width:64px;height:64px;border-radius:50%;flex:0 0 64px;background:#ff4d2e;color:#fff;
  font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center}
.txt{flex:1;display:flex;flex-direction:column;justify-content:center}
.dt{font-size:33px;font-weight:900;color:#16181d;line-height:1.28}
.dd{font-size:23px;color:#6b6157;line-height:1.5;margin-top:8px}
.dd b{color:#ff4d2e;font-weight:900}

.do{margin-top:26px;background:#16181d;border-radius:18px;padding:32px;text-align:center}
.do .dh{font-size:34px;font-weight:900;color:#fff;line-height:1.35}
.do .dh em{font-style:normal;color:#ff4d2e}
.do .dl{font-size:23px;color:#d6cfc6;margin-top:14px;line-height:1.6}
.src{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:17px;color:#9a9186}
</style></head><body>
<div class="tag">这三件事会让它更危险</div>
<h2>别<em>按肚子</em><br>别等天亮</h2>

<div class="dont">
  <div class="d"><div class="x">✕</div><div class="txt">
    <div class="dt">别按、别揉、别想帮它挤</div>
    <div class="dd">后腹摸到硬球说明膀胱已经胀满，<b>外力一压可能直接撑破</b></div></div></div>
  <div class="d"><div class="x">✕</div><div class="txt">
    <div class="dt">别"观察一晚"</div>
    <div class="dd">堵死之后是<b>按小时</b>伤肾、乱电解质，不是按天</div></div></div>
  <div class="d"><div class="x">✕</div><div class="txt">
    <div class="dt">别在家灌水喂药</div>
    <div class="dd">尿路堵死<b>不是靠多喝水能压开的</b>，灌进去只会更胀</div></div></div>
</div>

<div class="do">
  <div class="dh">该做的只有一件：<em>当天去医院</em></div>
  <div class="dl">路上用航空箱，让它自己蹲趴着。不要搂在怀里压住后腹，也不要抱着它颠。</div>
</div>
<div class="src">依据《2025 iCatCare 猫下泌尿道疾病共识》·《猫病学》第 5 版 第 1 篇第 227 条</div>
</body></html>
