<div class="why">
  <div class="wt">原因很直接</div>
  <div class="wd">公猫的尿道<b>又长又细</b>，一点炎性碎屑就能堵死。母猫的尿道短而宽，极少整条堵住——所以"憋尿"这个现象本身就带很强的性别指向。</div>
</div>

<div class="rows">
  <div class="row"><div class="ic">1</div><div class="tx">年轻到中年、偏胖、室内、<b>运动少</b>的公猫是主力</div></div>
  <div class="row"><div class="ic">2</div><div class="tx"><b>绝育后发胖</b>的公猫：活动量掉、喝水少、又爱憋</div></div>
  <div class="row"><div class="ic">3</div><div class="tx">有过一次膀胱炎的，<b>复发时更容易走到堵这一步</b></div></div>
</div>
