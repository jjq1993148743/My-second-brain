<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  position:relative}


.tag{align-self:center;background:#072e3a;color:#fff;font-size:27px;font-weight:900;
  padding:11px 32px;border-radius:44px;letter-spacing:1px;box-shadow:0 6px 0 #041c24}
h2{font-size:84px;font-weight:900;line-height:1.24;text-align:center;margin-top:24px;color:#fff;
  -webkit-text-stroke:13px #072e3a;paint-order:stroke fill;letter-spacing:-3px;padding:6px 0}
h2 em{font-style:normal;color:#00d9c8}
h2 b{font-style:normal;color:#ffc94d}
.src{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:18px;color:#8fa9b0}

body{background:#f2f8f9;padding:62px 56px 78px;display:flex;flex-direction:column;height:1656px}
.cards{margin-top:38px;display:flex;flex-direction:column;gap:24px;flex:1;justify-content:center}
.card{flex:1;background:#fff;border-radius:24px;padding:30px 34px;display:flex;gap:26px;
  box-shadow:0 8px 26px rgba(7,46,58,.11);border-left:12px solid #ccc;align-items:center}
.card.a{border-left-color:#00d9c8}
.card.b{border-left-color:#ffc94d}
.card.c{border-left-color:#ff5c5c}
.num{width:76px;height:76px;border-radius:50%;flex:0 0 76px;display:flex;align-items:center;
  justify-content:center;font-size:34px;font-weight:900;color:#fff;background:#072e3a}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.t{font-size:38px;font-weight:900;color:#072e3a;line-height:1.24}
.d{font-size:25px;color:#5b757d;line-height:1.55;margin-top:10px}
.d b{color:#072e3a;font-weight:900}
.badge{display:inline-block;align-self:flex-start;margin-top:14px;font-size:23px;font-weight:900;
  padding:8px 20px;border-radius:10px}
.card.a .badge{background:#e0f7f5;color:#00726a}
.card.b .badge{background:#fdf3d9;color:#8a5c00}
.card.c .badge{background:#ffe4e4;color:#a02020}

.note{margin-top:30px;background:#072e3a;border-radius:20px;padding:28px 32px}
.note .nt{font-size:27px;font-weight:900;color:#00d9c8}
.note .nd{font-size:24px;color:#c8dde2;line-height:1.62;margin-top:10px}
.note .nd b{color:#fff}
</style></head><body>
<div class="tag">三个信号叠加才要紧，单看一个容易误判</div>
<h2>喝水变多<em>不算</em><br>尿变<b>大而散</b>才算</h2>

<div class="cards">
  <div class="card a">
    <div class="num">1</div>
    <div class="body">
      <div class="t">数结块：个数和大小</div>
      <div class="d">每天铲完数一次，连数 7 天。从"几个小而硬"变成"两三个又大又软"，就是明确变化</div>
      <span class="badge">最便宜的尿量计</span>
    </div>
  </div>
  <div class="card b">
    <div class="num">2</div>
    <div class="body">
      <div class="t">量水：刻度杯记 3 天</div>
      <div class="d">带刻度的杯子专给它加水，早晚各记一次。参考上限约每公斤体重 40 毫升／天</div>
      <span class="badge">眼睛看不准，量才准</span>
    </div>
  </div>
  <div class="card c">
    <div class="num">3</div>
    <div class="body">
      <div class="t">称体重：每周固定一次</div>
      <div class="d">抱猫上秤再减自己体重。喝得多却在掉秤，是两个信号叠加</div>
      <span class="badge">三周连着掉才是真掉</span>
    </div>
  </div>
</div>

<div class="note">
  <div class="nt">先说结论：这是"记录题"，不是"调理题"</div>
  <div class="nd">猫明显喝多尿多，八成最终指向身体某条线（老年猫最常见是肾）。<b>别自己做控水试验</b>，也别急着换粮——先记三天数据，带着数字去看，一次就能说清。</div>
</div>
</body></html>
