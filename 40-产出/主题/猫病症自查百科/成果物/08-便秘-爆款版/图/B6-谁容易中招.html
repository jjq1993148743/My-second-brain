<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>B6</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;min-height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f6f8fb;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center}
.hd{text-align:center}
.tag{display:inline-block;background:#5a4a8a;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:72px;font-weight:900;line-height:1.12;margin-top:16px;color:#1a1030;letter-spacing:-2px}
h1 em{font-style:normal;color:#7a5cc4}
.sub{font-size:27px;color:#8a82a0;margin-top:14px}

.cats{margin-top:50px;display:flex;flex-direction:column;gap:20px}
.cat{background:#fff;border-radius:18px;padding:30px 34px;box-shadow:0 4px 14px rgba(60,40,100,.09);
  border-left:8px solid #7a5cc4}
.cat .ct{font-size:31px;font-weight:900;color:#1a1030;line-height:1.28}
.cat .cd{font-size:23px;line-height:1.55;color:#6a6280;margin-top:10px}
.cat .cd b{color:#e5484d;font-weight:900}

.foot{margin-top:40px;font-size:20px;color:#8a82a0;text-align:center;line-height:1.6}
</style></head><body>

<div class="hd">
  <div class="tag">不是所有猫都一样容易</div>
  <h1>哪几种猫<em>最容易</em>便秘</h1>
  <div class="sub">对上了，就提前防</div>
</div>

<div class="cats">

  <div class="cat">
    <div class="ct">10 岁以上的老年猫</div>
    <div class="cd">喝水少、肠子动得慢、活动量掉 —— <b>这一条最集中</b></div>
  </div>

  <div class="cat">
    <div class="ct">公猫</div>
    <div class="cd">公猫天生更"憋"，排便间隔本来就比母猫长</div>
  </div>

  <div class="cat">
    <div class="ct">偏胖、不爱动的</div>
    <div class="cd">运动少 → 肠蠕动慢 → 水分被反复吸收</div>
  </div>

  <div class="cat">
    <div class="ct">猫砂盆太少、太脏、被别的猫堵住的</div>
    <div class="cd">它不是拉不出，是<b>不肯在那个盆里拉</b></div>
  </div>

  <div class="cat">
    <div class="ct">后腿、腰、肛门周围疼的</div>
    <div class="cd">关节退化、肛门腺问题、长毛缠住肛周 —— 疼到蹲不下</div>
  </div>

</div>

<div class="foot">多猫家庭特别注意第 4 条：三只猫两个盆，等于有一只在憋<br>《猫病学》第 5 版 第 1 篇第 38 条「便秘」</div>
</body></html>
