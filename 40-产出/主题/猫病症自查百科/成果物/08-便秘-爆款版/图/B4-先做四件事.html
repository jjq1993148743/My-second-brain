<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>B4</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;min-height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f8fb;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center}
.hd{text-align:center}
.tag{display:inline-block;background:#0a4d68;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:74px;font-weight:900;line-height:1.12;margin-top:16px;color:#00293b;letter-spacing:-2px}
h1 em{font-style:normal;color:#0a9dbd}
.sub{font-size:27px;color:#7a8a92;margin-top:14px}

.two{margin-top:52px;display:flex;gap:24px}
.box{flex:1;border-radius:22px;padding:34px 30px}
.box.no{background:#fff;border:4px solid #e5484d}
.box.yes{background:#fff;border:4px solid #2e9e5b}
.bt{font-size:32px;font-weight:900;margin-bottom:22px;display:flex;align-items:center;gap:12px}
.no .bt{color:#8a1f1f}
.yes .bt{color:#1c5b34}
.bd{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#fff}
.no .bd{background:#e5484d}
.yes .bd{background:#2e9e5b}
.li{font-size:24px;line-height:1.5;color:#3a4a52;padding:16px 0;border-bottom:1px dashed #e2eaee}
.li:last-child{border-bottom:none}

.mid{margin-top:44px;background:#00293b;border-radius:18px;padding:34px 38px}
.mid .t{font-size:30px;font-weight:900;color:#ffd60a}
.mid .d{font-size:24px;line-height:1.6;color:#c5d5dd;margin-top:12px}
.mid .d b{color:#fff}

.foot{margin-top:40px;font-size:20px;color:#8a9aa2;text-align:center}
</style></head><body>

<div class="hd">
  <div class="tag">第一步永远是加水，不是加纤维</div>
  <h1>先做这 4 件<br><em>不花钱</em>的事</h1>
  <div class="sub">很多人直接跳到"换处方粮"，顺序反了</div>
</div>

<div class="two">
  <div class="box no">
    <div class="bt"><span class="bd">停</span>这些别做</div>
    <div class="li">别给人用泻药、开塞露、酚酞片</div>
    <div class="li">别在家灌香油、石蜡油</div>
    <div class="li">光加纤维不加水</div>
    <div class="li">一直"再观察一天"</div>
  </div>
  <div class="box yes">
    <div class="bt"><span class="bd">做</span>这些照做</div>
    <div class="li">猫砂盆多摆一个，每天铲两次</div>
    <div class="li">饮水点加到 3-4 处</div>
    <div class="li">往粮里加一点温水</div>
    <div class="li">每天陪它动 10 分钟，饭后最好</div>
  </div>
</div>

<div class="mid">
  <div class="t">为什么"灌油"很危险</div>
  <div class="d">猫被灌油时容易<b>呛进肺里</b>——那一下比便秘严重得多。人用的泻药成分和剂量对猫都可能出大事。这两件在家都别试。</div>
</div>

<div class="foot">2023 WSAVA 伙伴动物胃肠营养指南的处理顺序：水分与纤维 → 活动量 → 排除疼痛与梗阻</div>
</body></html>
