<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>B1</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fdf8f3;
  padding:46px 42px 32px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  position:relative;overflow:hidden}
.d1{position:absolute;top:-110px;right:-95px;width:340px;height:340px;border-radius:50%;background:#ffb703;opacity:.35}
.d2{position:absolute;bottom:-140px;left:-115px;width:380px;height:380px;border-radius:50%;background:#fb8500;opacity:.2}

.tag{position:relative;z-index:2;background:#8a4b08;color:#fff;font-size:27px;font-weight:900;
  padding:10px 30px;border-radius:44px;letter-spacing:2px;box-shadow:0 6px 0 #5c3105}
h1{position:relative;z-index:2;font-size:94px;font-weight:900;line-height:1.05;text-align:center;
  margin-top:20px;color:#fff;-webkit-text-stroke:15px #3d2103;paint-order:stroke fill;
  text-shadow:0 9px 0 rgba(61,33,3,.25);letter-spacing:-4px}
h1 em{font-style:normal;color:#ffd60a}
.sub{position:relative;z-index:2;margin-top:16px;font-size:31px;font-weight:900;color:#3d2103;
  background:#ffd60a;padding:10px 26px;border-radius:12px;transform:rotate(-1.5deg);
  box-shadow:0 5px 0 #d4a900}

.days{position:relative;z-index:2;margin-top:36px;width:100%;display:flex;gap:20px}
.day{flex:1;background:#fff;border-radius:22px;padding:30px 24px;text-align:center;
  box-shadow:0 8px 22px rgba(120,70,10,.12)}
.day .dn{font-size:64px;font-weight:900;line-height:1;color:#8a4b08}
.day .dl{font-size:24px;font-weight:900;color:#3d2103;margin-top:14px}
.day .dd{font-size:20px;color:#9a7a5a;margin-top:9px;line-height:1.4}
.day.warn{border:4px solid #f0a52e}
.day.warn .dn{color:#d17300}
.day.danger{border:4px solid #e5484d}
.day.danger .dn{color:#e5484d}

.why{position:relative;z-index:2;margin-top:32px;width:100%;background:#3d2103;border-radius:20px;
  padding:32px 36px;box-shadow:0 8px 24px rgba(61,33,3,.28)}
.why .wt{font-size:30px;font-weight:900;color:#ffd60a}
.why .wd{font-size:24px;line-height:1.65;color:#e0d0bd;margin-top:12px}
.why .wd b{color:#fff}

.foot{position:relative;z-index:2;margin-top:22px;font-size:19px;color:#9a7a5a;text-align:center}
</style></head><body>
<div class="d1"></div><div class="d2"></div>

<div class="tag">养猫 7 年 · 最容易拖成大事的一条</div>
<h1>猫两天没拉屎<br>该<em>等到第几天</em></h1>
<div class="sub">超过 48 小时算异常，过 72 小时必须管</div>

<div class="days">
  <div class="day">
    <div class="dn">24</div>
    <div class="dl">小时</div>
    <div class="dd">正常范围<br>不用管</div>
  </div>
  <div class="day warn">
    <div class="dn">48</div>
    <div class="dl">小时</div>
    <div class="dd">算异常<br>开始记录</div>
  </div>
  <div class="day danger">
    <div class="dn">72</div>
    <div class="dl">小时</div>
    <div class="dd">必须管<br>别在家等</div>
  </div>
</div>

<div class="why">
  <div class="wt">为什么"没拉"这件事要按小时数</div>
  <div class="wd">猫的便秘不是"今天没拉"这么简单。拖过 72 小时，肠道会反复吸收水分，便块越变越硬；再往后走到<b>巨结肠症</b>，就不是换个粮能解决的了。</div>
</div>

<div class="foot">《猫病学》第 5 版 第 1 篇第 38 条「便秘／顽固性便秘」｜拖重了会走到第 138 条「巨结肠症」</div>
</body></html>
