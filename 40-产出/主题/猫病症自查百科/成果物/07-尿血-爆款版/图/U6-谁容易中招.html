<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>U6</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;min-height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f6f8fb;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center}
.hd{text-align:center}
.tag{display:inline-block;background:#5a4a8a;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:70px;font-weight:900;line-height:1.12;margin-top:16px;color:#1a1030;letter-spacing:-2px}
h1 em{font-style:normal;color:#7a5cc4}
.sub{font-size:27px;color:#8a82a0;margin-top:14px}

/* 触发因素列表 */
.trig{margin-top:44px;background:#fff;border-radius:20px;padding:34px 36px;
  box-shadow:0 5px 16px rgba(60,40,100,.09)}
.trig .tt{font-size:31px;font-weight:900;color:#1a1030;margin-bottom:22px}
.trig .row{display:flex;flex-wrap:wrap;gap:12px}
.trig .chip{font-size:23px;font-weight:900;color:#5a4a8a;background:#f0ecfa;
  padding:13px 22px;border-radius:12px}

/* 高危猫 */
.cats{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.cat{display:flex;align-items:center;gap:18px;background:#fff;border-radius:15px;padding:24px 28px;
  box-shadow:0 3px 12px rgba(60,40,100,.07);border-left:6px solid #7a5cc4}
.cn2{font-size:26px;font-weight:900;color:#1a1030;flex-shrink:0;width:190px;line-height:1.25}
.cd{font-size:22px;color:#6a6280;line-height:1.45;flex:1}
.cd b{color:#c1121f;font-weight:900}

.foot{margin-top:36px;font-size:20px;color:#8a82a0;text-align:center;line-height:1.6}
</style></head><body>

<div class="hd">
  <div class="tag">发作前一周，家里往往变了什么</div>
  <h1>谁容易中招<br>又是什么<em>触发的</em></h1>
  <div class="sub">对上一个，就知道怎么防下一次</div>
</div>

<div class="trig">
  <div class="tt">最常见的 6 个触发因素</div>
  <div class="row">
    <div class="chip">添了新猫</div>
    <div class="chip">家里来客</div>
    <div class="chip">搬家 / 装修</div>
    <div class="chip">寄养回来</div>
    <div class="chip">换了猫砂</div>
    <div class="chip">盆被挪位置</div>
  </div>
</div>

<div class="cats">
  <div class="cat">
    <div class="cn2">室内、偏胖、运动少</div>
    <div class="cd">年轻到中年最常见 —— <b>这一条占比最高</b></div>
  </div>
  <div class="cat">
    <div class="cn2">公猫</div>
    <div class="cd">公母都会得，但公猫<b>后果更重</b>：尿道细，容易整个堵死</div>
  </div>
  <div class="cat">
    <div class="cn2">只吃干粮</div>
    <div class="cd">家里水点又少 —— 这两样叠在一起最危险</div>
  </div>
  <div class="cat">
    <div class="cn2">多猫挤一处</div>
    <div class="cd">食水厕都摆在一排，<b>弱势那只最容易发病</b></div>
  </div>
</div>

<div class="foot">《2025 iCatCare 猫下泌尿道疾病共识指南》｜《猫病学》第 5 版 第 1 篇第 45 条</div>
</body></html>
