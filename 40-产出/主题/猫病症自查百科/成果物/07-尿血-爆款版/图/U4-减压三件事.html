<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>U4</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px;min-height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f8fb;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center}
.hd{text-align:center}
.tag{display:inline-block;background:#0a4d68;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:72px;font-weight:900;line-height:1.12;margin-top:16px;color:#00293b;letter-spacing:-2px}
h1 em{font-style:normal;color:#0a9dbd}
.sub{font-size:27px;color:#7a8a92;margin-top:14px}

.three{margin-top:48px;display:flex;flex-direction:column;gap:20px}
.item{background:#fff;border-radius:20px;padding:32px 34px;box-shadow:0 5px 16px rgba(0,60,80,.09);
  border-left:8px solid #0a9dbd}
.item .ih{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.item .ib{width:48px;height:48px;border-radius:24px;background:#0a9dbd;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex-shrink:0}
.item .it2{font-size:31px;font-weight:900;color:#00293b;line-height:1.25}
.item .id{font-size:23px;line-height:1.58;color:#5a6a72}
.item .id b{color:#c1121f;font-weight:900}

.mid{margin-top:40px;background:#00293b;border-radius:18px;padding:34px 38px}
.mid .t{font-size:30px;font-weight:900;color:#ffd60a}
.mid .d{font-size:24px;line-height:1.6;color:#c5d5dd;margin-top:12px}
.mid .d b{color:#fff}

.foot{margin-top:38px;font-size:20px;color:#8a9aa2;text-align:center;line-height:1.6}
</style></head><body>

<div class="hd">
  <div class="tag">医生最想让你先做这三件</div>
  <h1>减压三件事<br>比<em>吃药</em>更基础</h1>
  <div class="sub">特发性膀胱炎，一半是"环境病"</div>
</div>

<div class="three">

  <div class="item">
    <div class="ih"><div class="ib">1</div><div class="it2">猫砂盆 = 猫的数量 + 1</div></div>
    <div class="id">三只猫就摆四个盆，<b>每天铲两次</b>。多猫家庭最容易出问题的地方，就是"资源挤在一处"。</div>
  </div>

  <div class="item">
    <div class="ih"><div class="ib">2</div><div class="it2">水点分散到各个房间</div></div>
    <div class="id">别只放一处。水碗多摆几个、放流动水盆，很多猫更爱喝流动的水。</div>
  </div>

  <div class="item">
    <div class="ih"><div class="ib">3</div><div class="it2">食、水、厕分开摆</div></div>
    <div class="id">挤在一处，弱势那只连吃饭喝水上厕所都要抢。<b>分散到两三个房间</b>，每只猫都能不被堵着上厕所。</div>
  </div>

</div>

<div class="mid">
  <div class="t">还有一件最容易做到、最省钱的</div>
  <div class="d">把一部分干粮换成<b>湿粮</b>，或往粮里加点温水。只吃干粮、水点又少的猫，是这条线上最高危的一类。</div>
</div>

<div class="foot">《2025 iCatCare 猫下泌尿道疾病诊断与管理共识指南》</div>
</body></html>
