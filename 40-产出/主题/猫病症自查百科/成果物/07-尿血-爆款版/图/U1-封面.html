<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>U1</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fdf6f6;
  padding:46px 42px 32px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  position:relative;overflow:hidden}
.d1{position:absolute;top:-110px;right:-95px;width:340px;height:340px;border-radius:50%;background:#ffb3b3;opacity:.4}
.d2{position:absolute;bottom:-140px;left:-115px;width:380px;height:380px;border-radius:50%;background:#ffd6a5;opacity:.35}

.tag{position:relative;z-index:2;background:#c1121f;color:#fff;font-size:27px;font-weight:900;
  padding:10px 30px;border-radius:44px;letter-spacing:2px;box-shadow:0 6px 0 #7a0a13}
h1{position:relative;z-index:2;font-size:98px;font-weight:900;line-height:1.04;text-align:center;
  margin-top:20px;color:#fff;-webkit-text-stroke:15px #4a0508;paint-order:stroke fill;
  text-shadow:0 9px 0 rgba(74,5,8,.25);letter-spacing:-4px}
h1 em{font-style:normal;color:#ffd60a}
.sub{position:relative;z-index:2;margin-top:16px;font-size:31px;font-weight:900;color:#4a0508;
  background:#ffd60a;padding:10px 26px;border-radius:12px;transform:rotate(-1.5deg);
  box-shadow:0 5px 0 #d4a900}

/* 核心对比：尿在哪里代表什么 */
.hero{position:relative;z-index:2;margin-top:36px;width:100%;display:flex;gap:22px}
.scene{flex:1;background:#fff;border-radius:22px;padding:32px 26px;text-align:center;
  box-shadow:0 8px 22px rgba(140,20,30,.12)}
.scene.soft{border:4px solid #f0a52e}
.scene.wall{border:4px solid #c1121f}
.scene .ico{font-size:64px;line-height:1}
.scene .st{font-size:30px;font-weight:900;margin-top:16px;line-height:1.28}
.scene.soft .st{color:#7a5206}
.scene.wall .st{color:#8a0f18}
.scene .sd{font-size:22px;color:#8a7a72;margin-top:12px;line-height:1.5}
.scene .sd b{color:#c1121f;font-weight:900}

.why{position:relative;z-index:2;margin-top:34px;width:100%;background:#4a0508;border-radius:20px;
  padding:34px 38px;box-shadow:0 8px 24px rgba(74,5,8,.28)}
.why .wt{font-size:31px;font-weight:900;color:#ffd60a}
.why .wd{font-size:24px;line-height:1.65;color:#e8d0d0;margin-top:12px}
.why .wd b{color:#fff}

.foot{position:relative;z-index:2;margin-top:24px;font-size:19px;color:#a08880;text-align:center}
</style></head><body>
<div class="d1"></div><div class="d2"></div>

<div class="tag">养猫 7 年 · 这条最容易误判</div>
<h1>猫尿在床上<br>不是<em>记仇</em></h1>
<div class="sub">它是疼，不是报复你</div>

<div class="hero">
  <div class="scene soft">
    <div class="ico">🛏️</div>
    <div class="st">尿在软的上面<br>床、衣服、沙发</div>
    <div class="sd">它在找一个<b>不硌的地方</b><br>因为尿的时候疼</div>
  </div>
  <div class="scene wall">
    <div class="ico">🧱</div>
    <div class="st">尿在竖面上<br>墙、柜门、家具侧面</div>
    <div class="sd">这是<b>憋不住</b><br>不是在做记号</div>
  </div>
</div>

<div class="why">
  <div class="wt">最常犯的错：把它当"报复"</div>
  <div class="wd">骂、关笼子、按头闻尿 —— <b>通常会让发作更频繁</b>。因为它本来就是因为疼才憋不住，你再加一层压力，只会更糟。</div>
</div>

<div class="foot">《2025 iCatCare 猫下泌尿道疾病诊断与管理共识指南》（JFMS 2025;27(2)，PMID 39935081）<br>《猫病学》第 5 版 第 1 篇第 45 条「特发性膀胱炎」</div>
</body></html>
