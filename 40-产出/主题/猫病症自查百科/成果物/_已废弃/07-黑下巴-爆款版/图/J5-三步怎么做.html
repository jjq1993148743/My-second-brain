<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>J5</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f7fbf7;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center;min-height:1656px}
.hd{text-align:center}
.tag{display:inline-block;background:#1c5b34;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:76px;font-weight:900;line-height:1.1;margin-top:16px;color:#14161a;letter-spacing:-2px}
h1 em{font-style:normal;color:#2e9e5b}
.sub{font-size:27px;color:#7a8580;margin-top:14px}

.steps{margin-top:54px;display:flex;flex-direction:column;gap:26px}
.st{display:flex;align-items:center;gap:24px;background:#fff;border-radius:18px;padding:32px 32px;
  box-shadow:0 4px 14px rgba(0,80,40,.08);border-left:8px solid #2e9e5b}
.sn{width:64px;height:64px;border-radius:32px;background:#2e9e5b;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;flex-shrink:0}
.sc{flex:1}
.sc .a{font-size:31px;font-weight:900;color:#00293b;line-height:1.26}
.sc .b{font-size:23px;color:#6a7a82;margin-top:7px;line-height:1.45}
.sc .b b{color:#1c5b34;font-weight:900}

.box{margin-top:34px;background:#14161a;border-radius:18px;padding:30px 34px}
.box .bt{font-size:28px;font-weight:900;color:#ffd60a}
.box .bd{font-size:23px;line-height:1.6;color:#c9cdd4;margin-top:11px}
.box .bd b{color:#fff}

.foot{margin-top:40px;font-size:20px;color:#8a9990;text-align:center}
</style></head><body>

<div class="hd">
  <div class="tag">顺序别反，第一步不是擦</div>
  <h1>换碗 + 每天擦<br><em>三步往下走</em></h1>
  <div class="sub">最省钱的一步在最前面</div>
</div>

<div class="steps">

  <div class="st">
    <div class="sn">1</div>
    <div class="sc">
      <div class="a">先把塑料碗扔了</div>
      <div class="b">换成不锈钢或陶瓷，每天洗、每天擦干。<b>很多黑点光靠这一步就能下去</b></div>
    </div>
  </div>

  <div class="st">
    <div class="sn">2</div>
    <div class="sc">
      <div class="a">温水泡软再擦</div>
      <div class="b">温水或生理盐水打湿棉柔巾，敷一下把油垢泡软，再轻擦。<b>擦完一定要擦干</b></div>
    </div>
  </div>

  <div class="st">
    <div class="sn">3</div>
    <div class="sc">
      <div class="a">三天看趋势</div>
      <div class="b">变少就继续；越擦越多、冒白头、结痂掉毛 → 停下来，去看一次</div>
    </div>
  </div>

</div>

<div class="box">
  <div class="bt">这几样别往上涂</div>
  <div class="bd">人用祛痘膏、牙膏、酒精——<b>都会刺激猫的皮肤，还可能被它舔进嘴</b>。猫的舌头舔不到自己下巴，这块全靠人帮：每天顺手擦，比隔一周来一次大洗有用得多。</div>
</div>

<div class="foot">《猫病学》第 5 版 第 1 篇第 2 条「痤疮」｜本期不涉及任何用药</div>
</body></html>
