<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>J3</title><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:1656px}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#fdf9f3;
  padding:50px 44px 34px;display:flex;flex-direction:column;justify-content:center;min-height:1656px}
.hd{text-align:center}
.tag{display:inline-block;background:#8a5a2b;color:#fff;font-size:26px;font-weight:900;
  padding:9px 28px;border-radius:40px;letter-spacing:2px}
h1{font-size:74px;font-weight:900;line-height:1.12;margin-top:18px;color:#14161a;letter-spacing:-2px}
h1 em{font-style:normal;color:#c47d1a}
.sub{font-size:27px;color:#9a8a70;margin-top:14px}

.hdr{display:flex;margin-top:56px;gap:14px}
.hdr .c1{width:250px;flex-shrink:0}
.hdr .c2,.hdr .c3{flex:1;padding:17px 20px;text-align:center;font-size:28px;font-weight:900;border-radius:14px 14px 0 0}
.hdr .c2{background:#fdf3dd;color:#7a5206;border:2px solid #f0a52e;border-bottom:none}
.hdr .c3{background:#fbe3e3;color:#8a1f1f;border:2px solid #e5484d;border-bottom:none}

.tbl{display:flex;flex-direction:column}
.r{display:flex;gap:14px}
.r .lab{width:250px;flex-shrink:0;background:#fff;border:1px solid #e8e2d8;border-top:none;
  padding:22px 20px;font-size:24px;font-weight:900;color:#5a4a3a;display:flex;align-items:center}
.r .v2{flex:1;background:#fffdf6;border:1px solid #e8e2d8;border-top:none;padding:22px 20px;
  font-size:22px;line-height:1.45;color:#6a5520;display:flex;align-items:center}
.r .v3{flex:1;background:#fffaf9;border:1px solid #e8e2d8;border-top:none;padding:22px 20px;
  font-size:22px;line-height:1.45;color:#8a2828;display:flex;align-items:center}

.bot{margin-top:34px;background:#14161a;color:#fff;border-radius:18px;padding:30px 34px}
.bot .t{font-size:29px;font-weight:900;color:#ffd60a}
.bot .d{font-size:23px;line-height:1.62;color:#c9cdd4;margin-top:11px}
.bot .d b{color:#fff}

.foot{margin-top:40px;font-size:20px;color:#9a8a70;text-align:center}
</style></head><body>

<div class="hd">
  <div class="tag">很多人把第 3 档当成"没洗干净"</div>
  <h1>单纯脏 vs <em>真的发炎</em><br>4 行分清</h1>
  <div class="sub">分错了，会把该看医生的往后拖</div>
</div>

<div class="hdr">
  <div class="c1"></div>
  <div class="c2">只是脏 / 黑头</div>
  <div class="c3">毛囊发炎</div>
</div>

<div class="tbl">
  <div class="r"><div class="lab">摸着什么感觉</div><div class="v2">干的黑点，一颗颗能摸到</div><div class="v3">油、有硬粒、摸着发烫</div></div>
  <div class="r"><div class="lab">擦三天后</div><div class="v2">明显变少</div><div class="v3"><b>越擦越多</b>，开始冒白头</div></div>
  <div class="r"><div class="lab">周围毛</div><div class="v2">完好</div><div class="v3">结痂、掉几撮毛</div></div>
  <div class="r"><div class="lab">它躲不躲</div><div class="v2">随便碰</div><div class="v3">一碰就躲，用爪子扒嘴</div></div>
</div>

<div class="bot">
  <div class="t">「换碗擦三天」就是一次天然测试</div>
  <div class="d">换成不锈钢或陶瓷、每天温水擦，连做三天：<b>黑点变少 = 只是脏</b>；<b>越擦越多、开始冒白头 = 不只是脏</b>，别再自己折腾，去看一次。</div>
</div>

<div class="foot">自测方向来自《猫病学》第 5 版 第 1 篇第 2 条「痤疮」，不是诊断标准</div>
</body></html>
