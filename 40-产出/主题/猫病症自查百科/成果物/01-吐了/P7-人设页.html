<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1242px; height:1656px; background:#faf9f7; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#222; overflow:hidden; }
  .wrap { padding:44px; }
  .h1 { text-align:center; font-size:46px; font-weight:800; }
  .who { margin-top:26px; background:#fff; border:1px solid #e8e5e0; border-radius:16px; padding:26px 30px; font-size:26px; line-height:1.6; }
  .who b { color:#111; }
  .sec { margin-top:26px; }
  .s-title { font-size:30px; font-weight:800; margin-bottom:14px; }
  .pro { background:#fff; border:1px solid #e8e5e0; border-radius:16px; padding:24px 30px; }
  .p-row { display:flex; align-items:center; font-size:25px; padding:10px 0; border-bottom:1px dashed #eee; }
  .p-row:last-child { border-bottom:none; }
  .p-num { flex:none; width:64px; color:#999; font-weight:800; }
  .p-name { flex:1; font-weight:700; }
  .p-st { flex:none; font-size:22px; padding:4px 16px; border-radius:999px; }
  .done { background:#e3f2e8; color:#1c6b3c; }
  .next { background:#333; color:#fff; }
  .soon { background:#f4f2ef; color:#999; }
  .lao { background:#fdf3dd; border-radius:16px; padding:24px 30px; font-size:25px; line-height:1.6; color:#6b4a06; }
  .lao b { color:#4a3304; }
  .cta { margin-top:26px; background:#333; color:#fff; border-radius:16px; padding:26px 30px; font-size:27px; line-height:1.6; text-align:center; font-weight:700; }
  .cta small { display:block; margin-top:8px; font-size:22px; font-weight:400; color:#bbb; }
</style>
</head>
<body>
<div class="wrap">
  <div class="h1">关于这个栏目</div>

  <div class="who">我是<b>程序员养猫人</b>，不是兽医。把《猫病学》第 5 版和猫科共识翻了一遍，整理成"<b>你今晚在家就能做</b>"的自查图。<br>只讲喂法和观察，<b>不讲诊断、不推药</b>——每条结论后面都附了出处，你可以自己回查。</div>

  <div class="sec">
    <div class="s-title">猫病症自查百科 · 目录</div>
    <div class="pro">
      <div class="p-row"><div class="p-num">01</div><div class="p-name">吐了</div><div class="p-st done">本篇</div></div>
      <div class="p-row"><div class="p-num">02</div><div class="p-name">不吃东西</div><div class="p-st next">下期</div></div>
      <div class="p-row"><div class="p-num">03</div><div class="p-name">软便</div><div class="p-st soon">排期中</div></div>
      <div class="p-row"><div class="p-num">04</div><div class="p-name">眼屎多</div><div class="p-st soon">排期中</div></div>
      <div class="p-row"><div class="p-num">05</div><div class="p-name">尿血</div><div class="p-st soon">排期中</div></div>
    </div>
  </div>

  <div class="sec">
    <div class="s-title">老炮经验（摘自底表）</div>
    <div class="lao">猫开刀那笔账，东西基本都是从地板上捡的——<b>线头、橡皮筋、发圈、塑料袋，全部收进带盖箱子</b>。暹罗这类爱啃织物的，尤其要收。</div>
  </div>

  <div class="cta">你家猫吐的是哪种？评论区说<small>我会按吐法归类回复，攒成下一期的补充案例</small></div>
</div>
</body>
</html>
