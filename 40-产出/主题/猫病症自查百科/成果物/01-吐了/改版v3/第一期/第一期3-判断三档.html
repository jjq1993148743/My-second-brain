<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期3 · 判断三档</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:56px 52px 46px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:74px; font-weight:900; line-height:1.16; }
  .sub { font-size:33px; color:#6b7280; margin-top:14px; }
  .cards { margin-top:28px; flex:1; display:flex; flex-direction:column; gap:18px; }
  .card {
    flex:1; border-radius:20px; padding:30px 36px; border:2px solid;
    display:flex; flex-direction:column; justify-content:center;
  }
  .card .lv { font-size:48px; font-weight:900; letter-spacing:1px; }
  .card .when { font-size:34px; font-weight:700; margin-top:14px; line-height:1.38; }
  .card .why { font-size:28px; color:#5b636c; margin-top:10px; line-height:1.45; }
  .g { background:#eef7f1; border-color:#cfe8da; }
  .g .lv { color:#2e9e5b; }
  .a { background:#fdf6ea; border-color:#f3e2c2; }
  .a .lv { color:#c98a1a; }
  .r { background:#fdf1f1; border-color:#f3d2d2; }
  .r .lv { color:#e5484d; }
  .foot { margin-top:20px; font-size:25px; color:#8a9099; line-height:1.5; }
</style>
</head>
<body>
  <h1>那到底要不要去医院？</h1>
  <div class="sub">三种情况，对应三种做法</div>

  <div class="cards">
    <div class="card g">
      <div class="lv">在家调</div>
      <div class="when">吐完还精神、还想吃，一天最多一两次</div>
      <div class="why">大概率是喂法或习惯问题 —— 先观察，别急着跑医院。</div>
    </div>
    <div class="card a">
      <div class="lv">去排查</div>
      <div class="when">吐的东西和"吃太快"对不上，或同时有别的变化</div>
      <div class="why">方向可能不在胃 —— 尽快找医生看一次，别拖成老毛病。</div>
    </div>
    <div class="card r">
      <div class="lv">当天去</div>
      <div class="when">吐血、吐完垮掉、公猫尿不出来</div>
      <div class="why">有危险信号 —— 别观察过夜，当天就去。</div>
    </div>
  </div>

  <div class="foot">症状不等于诊断：以上是分流参考，最终由兽医排查。</div>
</body>
</html>
