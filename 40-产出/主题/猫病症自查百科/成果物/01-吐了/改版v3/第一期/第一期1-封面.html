<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期1 · 封面</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#fbf7f1; color:#14161a;
    padding:90px 74px 78px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .tag {
    align-self:flex-start; background:#e5484d; color:#fff;
    font-size:34px; font-weight:800; letter-spacing:2px;
    border-radius:14px; padding:13px 28px;
  }
  h1 { font-size:96px; font-weight:900; line-height:1.22; margin-top:32px; letter-spacing:1px; }
  h1 em { font-style:normal; color:#e5484d; }
  .lead { font-size:37px; color:#4a5159; line-height:1.52; margin-top:32px; }
  .lead b { color:#14161a; }
  .bands { margin-top:52px; display:flex; flex-direction:column; gap:18px; }
  .band {
    border-radius:18px; padding:30px 34px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .band .bn { font-size:42px; font-weight:900; color:#fff; letter-spacing:1px; }
  .band .bs { font-size:29px; color:#fff; opacity:.95; }
  .g { background:#2e9e5b; }
  .a { background:#f0a52e; }
  .r { background:#e5484d; }
</style>
</head>
<body>
  <div class="tag">养猫人，都懂这一刻</div>
  <h1>猫吐了，<br>我第一反应是<em>「完了」</em></h1>
  <div class="lead">是不是喂错了？要不要马上跑医院？<br><b>先别慌 —— 对照这 7 种，分清要不要紧。</b></div>
  <div class="bands">
    <div class="band g"><span class="bn">在家调</span><span class="bs">吐粮 · 吐黄水 · 吐毛团</span></div>
    <div class="band a"><span class="bn">去排查</span><span class="bs">干呕伸脖子 · 喝多掉秤</span></div>
    <div class="band r"><span class="bn">当天去</span><span class="bs">蹲盆尿少 · 吐血</span></div>
  </div>
</body>
</html>
