<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期1 · 封面</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#fbf7f1; color:#14161a;
    padding:100px 74px 80px;
    display:flex; flex-direction:column;
  }
  .tag {
    align-self:flex-start; background:#e5484d; color:#fff;
    font-size:35px; font-weight:800; letter-spacing:2px;
    border-radius:14px; padding:13px 28px;
  }
  h1 { font-size:112px; font-weight:900; line-height:1.16; margin-top:34px; letter-spacing:1px; }
  h1 em { font-style:normal; color:#e5484d; }
  .lead { font-size:38px; color:#4a5159; line-height:1.55; margin-top:36px; }
  .bands { margin-top:auto; display:flex; flex-direction:column; gap:18px; }
  .band {
    border-radius:18px; padding:26px 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .band .bn { font-size:40px; font-weight:900; color:#fff; letter-spacing:1px; }
  .band .bs { font-size:28px; color:#fff; opacity:.95; }
  .g { background:#2e9e5b; }
  .a { background:#f0a52e; }
  .r { background:#e5484d; }
</style>
</head>
<body>
  <div class="tag">猫吐了，先别慌</div>
  <h1>你家猫吐的<br>是<em>哪一种？</em></h1>
  <div class="lead">对照下面 7 种，先分清要不要紧 ——<br>再决定跑不跑医院。</div>
  <div class="bands">
    <div class="band g"><span class="bn">在家调</span><span class="bs">吐粮 · 吐黄水 · 吐毛团</span></div>
    <div class="band a"><span class="bn">去排查</span><span class="bs">干呕伸脖子 · 喝多掉秤</span></div>
    <div class="band r"><span class="bn">当天去</span><span class="bs">蹲盆尿少 · 吐血</span></div>
  </div>
</body>
</html>
