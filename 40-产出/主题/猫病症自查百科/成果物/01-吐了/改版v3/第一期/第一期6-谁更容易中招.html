<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期6 · 谁更容易中招</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:56px 52px 46px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:70px; font-weight:900; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:16px; }
  .rows { margin-top:28px; flex:1; display:flex; flex-direction:column; gap:14px; }
  .row {
    flex:1; display:flex; align-items:center; gap:24px;
    border:2px solid #eef1f4; border-radius:18px; background:#fafbfc; padding:14px 28px;
  }
  .who { flex:0 0 300px; font-size:33px; font-weight:800; color:#e5484d; line-height:1.3; }
  .desc { flex:1; font-size:31px; line-height:1.42; }
  .foot { margin-top:20px; font-size:24px; color:#8a9099; line-height:1.5; }
</style>
</head>
<body>
  <h1>谁<em>更容易中招？</em></h1>
  <div class="sub">不是哪种猫专属 —— 但有几群要更留心</div>

  <div class="rows">
    <div class="row">
      <div class="who">2–6 个月<br>幼猫</div>
      <div class="desc">换粮、驱虫、爱乱捡东西那阵，最容易吃太快或吃错</div>
    </div>
    <div class="row">
      <div class="who">2–8 岁<br>青壮年</div>
      <div class="desc">多见肠胃敏感和气道问题；长毛猫这阶段还常伴吐毛球</div>
    </div>
    <div class="row">
      <div class="who">8 岁以上</div>
      <div class="desc">最容易反复呕吐 —— 波斯系、缅因、暹罗这些品种更明显</div>
    </div>
    <div class="row">
      <div class="who">布偶 / 缅因<br>英短 / 美短</div>
      <div class="desc">心肌病被报道较多的品种 —— "伸脖子咔一下"可能不是胃在闹</div>
    </div>
    <div class="row">
      <div class="who">偏胖的<br>绝育公猫</div>
      <div class="desc">尿路容易出问题的那一群 —— 做呕姿势要格外小心</div>
    </div>
  </div>

  <div class="foot">概率提示，不是诊断线。症状不等于诊断，最终由兽医排查。</div>
</body>
</html>
