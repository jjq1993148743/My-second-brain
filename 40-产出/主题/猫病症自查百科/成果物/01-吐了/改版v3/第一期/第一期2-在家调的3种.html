<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期2 · 在家调的3种</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:58px 54px 48px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:72px; font-weight:900; line-height:1.18; }
  h1 em { font-style:normal; color:#2e9e5b; }
  .sub { font-size:32px; color:#6b7280; margin-top:16px; }
  .rows { margin-top:34px; display:flex; flex-direction:column; gap:20px; }
  .row {
    border:2px solid #dcecdf; border-radius:20px; background:#f4faf6;
    padding:38px 34px; display:flex; align-items:center; gap:24px;
  }
  .phen { flex:1; font-size:43px; line-height:1.4; }
  .phen span { color:#9aa1ab; }
  .tag { flex:0 0 250px; background:#2e9e5b; color:#fff; border-radius:14px; padding:20px 14px; text-align:center; font-size:35px; font-weight:800; }
  .note {
    margin-top:auto; background:#f7f8fa; border:2px solid #eceff3; border-radius:18px;
    padding:30px 34px; font-size:33px; line-height:1.5; color:#3d444d;
  }
  .note b { color:#14161a; }
  .who { margin-top:22px; font-size:27px; color:#8a9099; }
</style>
</head>
<body>
  <h1>这 3 种，先<em>在家调</em></h1>
  <div class="sub">都是喂法和习惯的事 —— 不用一上来就跑医院</div>

  <div class="rows">
    <div class="row">
      <div class="phen"><span>以前吃完就安静趴着；</span>现在饭后半小时内准吐，吐出的粮还是一粒一粒没泡开，吐完立刻又要吃</div>
      <div class="tag">吃太快</div>
    </div>
    <div class="row">
      <div class="phen"><span>以前清晨碗里是昨晚剩的粮；</span>现在清晨吐一摊黄水或白沫，碗是空的</div>
      <div class="tag">空腹太久</div>
    </div>
    <div class="row">
      <div class="phen"><span>以前梳毛只梳下一小撮；</span>现在一梳一大把，还常吐出一团毛加黏液</div>
      <div class="tag">毛球 · 换毛季</div>
    </div>
  </div>

  <div class="note">
    这 3 种都不用慌。<b>但改了喂法两周还没改善 —— 就别再自己试了。</b>
  </div>
  <div class="who">我是程序员养猫人，不是兽医 —— 把文献翻成你今晚就能用的图</div>
</body>
</html>
