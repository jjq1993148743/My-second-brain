<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二期1 · 谁更容易中招</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1242px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:56px 52px 46px;
    display:flex; flex-direction:column;
  }
  .ask { font-size:35px; font-weight:800; color:#e5484d; line-height:1.38; }
  h1 { font-size:70px; font-weight:900; line-height:1.18; margin-top:12px; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:14px; }
  .rows { margin-top:26px; flex:1; display:flex; flex-direction:column; gap:16px; justify-content:center; }
  .row {
    display:flex; align-items:center; gap:24px;
    border:2px solid #eef1f4; border-radius:18px; background:#fafbfc; padding:24px 28px;
  }
  .who { flex:0 0 300px; font-size:33px; font-weight:800; color:#e5484d; line-height:1.3; }
  .desc { flex:1; font-size:31px; line-height:1.42; }
  .foot { margin-top:20px; font-size:24px; color:#8a9099; line-height:1.5; }
</style>
</head>
<body>
  <div class="ask">猫不是天生就爱吐。但有几群，确实更得当心。</div>
  <h1>谁<em>更容易中招？</em></h1>
  <div class="sub">看看你家猫在不在下面这几群里</div>

  <div class="rows">
    <div class="row">
      <div class="who">2–6 个月<br>幼猫</div>
      <div class="desc">换粮、驱虫、见啥捡啥那阵，最容易吃太急</div>
    </div>
    <div class="row">
      <div class="who">2–8 岁<br>青壮年</div>
      <div class="desc">肠胃容易闹、气道也爱出问题，长毛猫还老吐毛球</div>
    </div>
    <div class="row">
      <div class="who">8 岁以上</div>
      <div class="desc">最容易反复吐的年纪。波斯、缅因、暹罗更明显</div>
    </div>
    <div class="row">
      <div class="who">布偶 / 缅因<br>英短 / 美短</div>
      <div class="desc">心肌病报道比较多的品种。“伸脖子咔一下”，可能压根不是胃的事</div>
    </div>
    <div class="row">
      <div class="who">偏胖的<br>绝育公猫</div>
      <div class="desc">尿路最容易出毛病的一群。做呕姿势得当回事</div>
    </div>
  </div>

  <div class="foot">这只是概率，别对号入座。症状不等于诊断，最终由兽医排查。</div>
</body>
</html>
