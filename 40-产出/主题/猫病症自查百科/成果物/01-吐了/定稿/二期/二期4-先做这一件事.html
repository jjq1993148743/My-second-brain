<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二期4 · 先做这一件事</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1242px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:46px 48px 44px; display:flex; flex-direction:column;
  }
  .ask { font-size:35px; font-weight:800; color:#e5484d; line-height:1.38; }
  h1 { font-size:60px; font-weight:900; line-height:1.18; margin-top:12px; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:14px; }
  .cards { margin-top:28px; flex:1; display:flex; flex-direction:column; gap:20px; justify-content:center; }
  .card { border-radius:20px; border:2px solid #dcecdf; background:#f4faf6; padding:34px 40px; display:flex; align-items:center; gap:28px; }
  .no { flex:0 0 76px; height:76px; border-radius:50%; background:#2e9e5b; color:#fff; font-size:40px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .body { flex:1; }
  .t { font-size:36px; font-weight:800; line-height:1.3; }
  .w { font-size:29px; color:#5b636c; margin-top:10px; line-height:1.45; }
  .foot { margin-top:20px; font-size:26px; color:#3d444d; line-height:1.5; background:#f7f8fa; border-radius:14px; padding:18px 24px; }
  .foot b { color:#e5484d; }
</style>
</head>
<body>
  <div class="ask">先别急着买这买那。大多数吐，改喂法两周就能看出来。</div>
  <h1>先做这 3 件事，<em>都是喂法</em></h1>
  <div class="sub">不涉及用药。多数吐，两周就能见分晓</div>

  <div class="cards">
    <div class="card">
      <div class="no">1</div>
      <div class="body">
        <div class="t">一天改成 4–6 顿小的，粮薄薄摊开</div>
        <div class="w">光这一件事连做两周。多数“吃完就吐”的，当场就轻了。</div>
      </div>
    </div>
    <div class="card">
      <div class="no">2</div>
      <div class="body">
        <div class="t">早上吐黄水的，睡前加一顿</div>
        <div class="w">别让它空着肚子十几个小时。很多“天天早上吐”的，就这么好了。</div>
      </div>
    </div>
    <div class="card">
      <div class="no">3</div>
      <div class="body">
        <div class="t">一周吐到 2 次以上，先记两周再决定</div>
        <div class="w">记次数、记时间、拍照片，<b>这两周别换粮</b>。换了就说不清是粮的事，还是喂法的事。</div>
      </div>
    </div>
  </div>

  <div class="foot"><b>时间线：</b>两周还没好转 → 别自己硬试了，带上记录去医院。<br>症状不等于诊断，最终由兽医排查。</div>
</body>
</html>
