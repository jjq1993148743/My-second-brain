<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二期3 · 一周吐几次算不正常</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:46px 48px 44px; display:flex; flex-direction:column;
  }
  .ask { font-size:35px; font-weight:800; color:#e5484d; line-height:1.38; }
  h1 { font-size:60px; font-weight:900; line-height:1.18; margin-top:12px; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:14px; }
  .cards { margin-top:28px; flex:1; display:flex; flex-direction:column; gap:22px; justify-content:space-evenly; }
  .card { border-radius:20px; border:2px solid; padding:36px 40px; display:flex; flex-direction:column; justify-content:center; }
  .card .freq { font-size:46px; font-weight:900; }
  .card .say { font-size:33px; font-weight:700; margin-top:12px; line-height:1.38; }
  .card .why { font-size:28px; color:#5b636c; margin-top:10px; line-height:1.45; }
  .g { background:#eef7f1; border-color:#cfe8da; } .g .freq { color:#2e9e5b; }
  .a { background:#fdf6ea; border-color:#f3e2c2; } .a .freq { color:#c98a1a; }
  .r { background:#fdf1f1; border-color:#f3d2d2; } .r .freq { color:#e5484d; }
  .foot { margin-top:20px; font-size:26px; color:#5b636c; line-height:1.5; background:#f7f8fa; border-radius:14px; padding:18px 24px; }
  .foot b { color:#14161a; }
</style>
</head>
<body>
  <div class="ask">“它好像经常吐”——那到底多频繁，才算不正常？</div>
  <h1>一周吐几次，<em>算不正常？</em></h1>
  <div class="sub">“偶尔吐一次”和“已经不对了”，中间有一条线</div>

  <div class="cards">
    <div class="card g">
      <div class="freq">偶尔一次</div>
      <div class="say">大半年才吐一回，吃嘛嘛香、精神也好</div>
      <div class="why">没事，不用管。</div>
    </div>
    <div class="card a">
      <div class="freq">一周 1 次</div>
      <div class="say">连着好几周都这样，或者总在同一个点</div>
      <div class="why">该记账了，别再凭印象说“好像挺经常”。</div>
    </div>
    <div class="card r">
      <div class="freq">一周 ≥ 2 次</div>
      <div class="say">到这份上，就不是“偶尔”了</div>
      <div class="why">把两周的记录理一理，先别换粮，带着记录去。</div>
    </div>
  </div>

  <div class="foot"><b>怎么记（就四样）：</b>哪天、几点、离上顿多久、吐出来的拍张照。<br>手机里单开一页 —— 半年后这一页，顶得上一沓检查单。</div>
</body>
</html>
