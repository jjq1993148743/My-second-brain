<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二期5 · 你管它叫什么</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1242px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#fbf7f1; color:#14161a;
    padding:72px 56px 56px; display:flex; flex-direction:column;
  }
  .ask { font-size:40px; font-weight:800; color:#e5484d; line-height:1.4; }
  h1 { font-size:68px; font-weight:900; line-height:1.18; margin-top:20px; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:33px; color:#4a5159; margin-top:20px; line-height:1.5; }
  .groups { margin-top:34px; flex:1; display:flex; flex-direction:column; gap:40px; justify-content:center; }
  .grp { display:flex; flex-direction:column; gap:16px; }
  .gl { font-size:29px; font-weight:800; color:#8a9099; }
  .chips { display:flex; flex-wrap:wrap; gap:14px; }
  .chip { font-size:34px; font-weight:700; border-radius:14px; padding:18px 30px; }
  .c1 { background:#eef7f1; color:#1f7a44; }
  .c2 { background:#fdf6ea; color:#b3791a; }
  .c3 { background:#fdf1f1; color:#c93a3f; }
  .who { margin-top:auto; padding-top:30px; font-size:27px; color:#8a9099; line-height:1.5; }
</style>
</head>
<body>
  <div class="ask">你家猫这情况，你平时管它叫啥？</div>
  <h1>叫法不一样，<em>说的是一回事</em></h1>
  <div class="sub">你怎么搜，这里都接得住</div>

  <div class="groups">
    <div class="grp">
      <div class="gl">平时这么说</div>
      <div class="chips">
        <span class="chip c1">呕吐</span>
        <span class="chip c1">吐黄水</span>
        <span class="chip c1">吐白沫</span>
        <span class="chip c1">干呕</span>
        <span class="chip c1">反胃</span>
        <span class="chip c1">吐粮</span>
        <span class="chip c1">餐后吐</span>
        <span class="chip c1">吐毛球</span>
      </div>
    </div>
    <div class="grp">
      <div class="gl">各地的老话</div>
      <div class="chips">
        <span class="chip c2">顶胃</span>
        <span class="chip c2">倒胃口（北方）</span>
        <span class="chip c2">泛恶</span>
        <span class="chip c2">作恶</span>
        <span class="chip c2">涌上来（江浙沪）</span>
        <span class="chip c2">呕奶（幼猫）</span>
      </div>
    </div>
    <div class="grp">
      <div class="gl">网上的说法</div>
      <div class="chips">
        <span class="chip c3">玻璃胃</span>
        <span class="chip c3">吐到怀疑猫生</span>
      </div>
    </div>
  </div>

  <div class="who">不会写代码的铲屎官不是好厨子。爱用数据说话，全网搜罗养猫心得，记录在此，希望对余华们有所帮助。</div>
</body>
</html>
