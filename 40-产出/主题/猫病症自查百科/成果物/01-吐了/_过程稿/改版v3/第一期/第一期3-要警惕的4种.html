<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期3 · 要警惕的4种</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:58px 54px 48px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:72px; font-weight:900; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:32px; color:#6b7280; margin-top:16px; }
  .rows { margin-top:30px; flex:1; display:flex; flex-direction:column; gap:16px; }
  .row {
    flex:1; border-radius:20px; padding:32px 34px;
    display:flex; align-items:center; gap:24px; border:2px solid;
  }
  .phen { flex:1; font-size:40px; line-height:1.4; }
  .tag { flex:0 0 250px; color:#fff; border-radius:14px; padding:18px 14px; text-align:center; font-size:34px; font-weight:800; }
  .r-amber { background:#fdf6ea; border-color:#f3e2c2; }
  .r-amber .tag { background:#f0a52e; }
  .r-red { background:#fdf1f1; border-color:#f3d2d2; }
  .r-red .tag { background:#e5484d; }
  .note {
    margin-top:auto; background:#f7f8fa; border:2px solid #eceff3; border-radius:18px;
    padding:28px 34px; font-size:32px; line-height:1.5; color:#3d444d;
  }
  .note b { color:#14161a; }
  .who { margin-top:20px; font-size:27px; color:#8a9099; }
</style>
</head>
<body>
  <h1>这 4 种，<em>别当胃病拖</em></h1>
  <div class="sub">方向不在胃 —— 拖久了就麻烦</div>

  <div class="rows">
    <div class="row r-amber">
      <div class="phen"><span style="color:#9aa1ab">以前喊它有反应；</span>现在蹲在墙角把脖子伸得直直的、肚子一抽一抽，却什么也没吐出来</div>
      <div class="tag">可能是咳</div>
    </div>
    <div class="row r-amber">
      <div class="phen">吐的同时喝得多、体重在往下掉</div>
      <div class="tag">内脏方向</div>
    </div>
    <div class="row r-red">
      <div class="phen">公猫蹲在猫砂盆里使劲、结块越来越小</div>
      <div class="tag">尿路堵</div>
    </div>
    <div class="row r-red">
      <div class="phen">吐出物带血丝、或呈咖啡渣样的深褐色；吐完精神一起垮</div>
      <div class="tag">立刻就医</div>
    </div>
  </div>

  <div class="note">
    前两种<b>尽快安排去看一次</b>；后两种<b>当天就去，别观察过夜</b>。
  </div>
  <div class="who">我是程序员养猫人，不是兽医 —— 把文献翻成你今晚就能用的图</div>
</body>
</html>
