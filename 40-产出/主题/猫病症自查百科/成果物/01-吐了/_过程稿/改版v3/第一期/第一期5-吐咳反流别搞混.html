<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第一期5 · 吐咳反流别搞混</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:56px 52px 46px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:70px; font-weight:900; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:16px; line-height:1.45; }
  .tbl { margin-top:28px; flex:1; display:flex; flex-direction:column; gap:12px; }
  .thead { display:flex; gap:14px; }
  .thead .c0 { flex:0 0 150px; }
  .thead .c1, .thead .c2 {
    flex:1; text-align:center; font-size:42px; font-weight:800;
    border-radius:14px; padding:16px 0; color:#fff;
  }
  .c1 { background:#2e9e5b; }
  .c2 { background:#e5484d; }
  .trow { flex:1; display:flex; gap:14px; align-items:stretch; }
  .trow .c0 { flex:0 0 150px; display:flex; align-items:center; font-size:29px; color:#6b7280; font-weight:700; }
  .trow .c1, .trow .c2 {
    flex:1; display:flex; align-items:center;
    font-size:34px; line-height:1.34; border-radius:14px; padding:16px 22px;
  }
  .trow .c1 { background:#eef7f1; }
  .trow .c2 { background:#fdf3ee; }
  .foot { margin-top:22px; font-size:26px; color:#5b636c; line-height:1.5; }
  .foot b { color:#14161a; }
  .src { margin-top:14px; font-size:23px; color:#9aa1ab; line-height:1.45; }
</style>
</head>
<body>
  <h1>别搞混：<em>吐、咳、反流</em></h1>
  <div class="sub">三件事在主人眼里长得几乎一样，方向却完全不同</div>

  <div class="tbl">
    <div class="thead">
      <div class="c0"></div>
      <div class="c1">吐</div>
      <div class="c2">咳</div>
    </div>
    <div class="trow">
      <div class="c0">肚子</div>
      <div class="c1">明显一抽一抽地收缩</div>
      <div class="c2">不抽，脖子前伸、身子压低贴地</div>
    </div>
    <div class="trow">
      <div class="c0">声音</div>
      <div class="c1">"呕"</div>
      <div class="c2">"咔"</div>
    </div>
    <div class="trow">
      <div class="c0">吐出物</div>
      <div class="c1">粮、黄水、毛团</div>
      <div class="c2">常常什么也没有</div>
    </div>
    <div class="trow">
      <div class="c0">收尾</div>
      <div class="c1">把东西吐出来为止</div>
      <div class="c2">全身一抖，像打了个空嗝</div>
    </div>
    <div class="trow">
      <div class="c0">吐完</div>
      <div class="c1">有时还想回去吃</div>
      <div class="c2">没胃口，趴着不动</div>
    </div>
  </div>

  <div class="foot"><b>还有第三种：反流。</b>刚吃完就出来、没有"呕"的动作 —— 是食道的事，也不是胃。拿不准就录一段短视频，就医时给医生看。</div>
  <div class="src">出处：《猫病学》第 5 版 第 1 篇"病与症"第 236 条「呕吐」｜我是程序员养猫人，不是兽医</div>
</body>
</html>
