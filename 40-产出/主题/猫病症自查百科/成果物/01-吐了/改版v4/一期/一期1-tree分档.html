<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一期1 · 猫吐了先分3档</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#fbf7f1; color:#14161a;
    padding:76px 56px 60px; display:flex; flex-direction:column;
  }
  .ask { font-size:42px; font-weight:800; color:#e5484d; line-height:1.4; }
  h1 { font-size:92px; font-weight:900; line-height:1.18; margin-top:22px; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:34px; color:#4a5159; margin-top:20px; line-height:1.5; }
  .tree { margin-top:30px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .root {
    background:#14161a; color:#fff; font-size:50px; font-weight:900;
    border-radius:20px; padding:22px 64px;
  }
  .stem { width:4px; height:40px; background:#c9ced6; }
  .branches { display:flex; gap:24px; width:100%; }
  .br { flex:1; display:flex; flex-direction:column; align-items:center; }
  .br .top { width:4px; height:30px; background:#c9ced6; }
  .lv { width:100%; text-align:center; font-size:44px; font-weight:900; color:#fff; border-radius:14px; padding:20px 0; }
  .items { width:100%; margin-top:16px; display:flex; flex-direction:column; gap:18px; }
  .it { font-size:38px; line-height:1.35; border-radius:14px; padding:28px 22px; text-align:center; }
  .note { margin-top:auto; padding-top:20px; font-size:26px; color:#6b7280; line-height:1.45; text-align:center; }
  .g .lv { background:#2e9e5b; } .g .it { background:#eef7f1; }
  .a .lv { background:#f0a52e; } .a .it { background:#fdf6ea; }
  .r .lv { background:#e5484d; } .r .it { background:#fdf1f1; }
  .who { margin-top:auto; padding-top:30px; font-size:27px; color:#8a9099; line-height:1.5; }
</style>
</head>
<body>
  <div class="ask">半夜听见“呕——”，你是不是腾地就坐起来了？</div>
  <h1>猫吐了，先<em>分这 3 档</em></h1>
  <div class="sub">先别急着跑医院 —— 对照一下，它落在哪一档</div>

  <div class="tree">
    <div class="root">猫吐了</div>
    <div class="stem"></div>
    <div class="branches">
      <div class="br g">
        <div class="top"></div>
        <div class="lv">在家调</div>
        <div class="items">
          <div class="it">吐粮</div>
          <div class="it">吐黄水</div>
          <div class="it">吐毛团</div>
        </div>
        <div class="note">多半是喂法和习惯的事</div>
      </div>
      <div class="br a">
        <div class="top"></div>
        <div class="lv">去排查</div>
        <div class="items">
          <div class="it">干呕伸脖子</div>
          <div class="it">喝多掉秤</div>
        </div>
        <div class="note">方向可能不在胃</div>
      </div>
      <div class="br r">
        <div class="top"></div>
        <div class="lv">当天去</div>
        <div class="items">
          <div class="it">蹲盆尿少</div>
          <div class="it">吐血</div>
        </div>
        <div class="note">别等，当天就去</div>
      </div>
    </div>
  </div>

  <div class="who">不会写代码的铲屎官不是好厨子 —— 爱用数据说话，全网搜罗养猫心得，记录在此，希望对余华们有所帮助。</div>
</body>
</html>
