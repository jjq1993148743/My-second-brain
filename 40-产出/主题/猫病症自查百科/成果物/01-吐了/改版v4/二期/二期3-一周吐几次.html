<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二期3 · 一周吐几次算不正常</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:54px 48px 44px; display:flex; flex-direction:column;
  }
  h1 { font-size:68px; font-weight:900; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:14px; }
  .cards { margin-top:30px; flex:1; display:flex; flex-direction:column; gap:18px; }
  .card { flex:1; border-radius:20px; border:2px solid; padding:30px 36px; display:flex; flex-direction:column; justify-content:center; }
  .card .freq { font-size:46px; font-weight:900; }
  .card .say { font-size:33px; font-weight:700; margin-top:12px; line-height:1.38; }
  .card .why { font-size:28px; color:#5b636c; margin-top:10px; line-height:1.45; }
  .g { background:#eef7f1; border-color:#cfe8da; } .g .freq { color:#2e9e5b; }
  .a { background:#fdf6ea; border-color:#f3e2c2; } .a .freq { color:#c98a1a; }
  .r { background:#fdf1f1; border-color:#f3d2d2; } .r .freq { color:#e5484d; }
  .foot { margin-top:22px; font-size:26px; color:#5b636c; line-height:1.5; background:#f7f8fa; border-radius:14px; padding:18px 24px; }
  .foot b { color:#14161a; }
</style>
</head>
<body>
  <h1>一周吐几次，<em>算不正常？</em></h1>
  <div class="sub">"偶尔吐一次"和"已经不对了"，中间有一条线</div>

  <div class="cards">
    <div class="card g">
      <div class="freq">偶尔一次</div>
      <div class="say">大半年才吐一回，精神食欲都好</div>
      <div class="why">这算正常，不用管它。</div>
    </div>
    <div class="card a">
      <div class="freq">一周 1 次</div>
      <div class="say">连着好几周都是这样，或总在同一个钟点</div>
      <div class="why">开始记账，别再凭印象说"好像挺经常"。</div>
    </div>
    <div class="card r">
      <div class="freq">一周 ≥ 2 次</div>
      <div class="say">吐的次数到这儿，就已经不是"偶尔"了</div>
      <div class="why">先把两周记录整理齐，别换粮，带着记录去看。</div>
    </div>
  </div>

  <div class="foot"><b>怎么记（就四样）：</b>日期、几点、离上一次吃饭多久、吐出物拍照。<br>手机里单开一页 —— 半年后这一页顶得上一沓检查单。</div>
</body>
</html>
