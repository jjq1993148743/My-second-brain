<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二期4 · 先做这一件事</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#14161a;
    padding:54px 48px 44px; display:flex; flex-direction:column;
  }
  h1 { font-size:68px; font-weight:900; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:31px; color:#6b7280; margin-top:14px; }
  .cards { margin-top:30px; flex:1; display:flex; flex-direction:column; gap:18px; }
  .card { flex:1; border-radius:20px; border:2px solid #dcecdf; background:#f4faf6; padding:30px 36px; display:flex; align-items:center; gap:28px; }
  .no { flex:0 0 76px; height:76px; border-radius:50%; background:#2e9e5b; color:#fff; font-size:40px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .body { flex:1; }
  .t { font-size:36px; font-weight:800; line-height:1.3; }
  .w { font-size:29px; color:#5b636c; margin-top:10px; line-height:1.45; }
  .foot { margin-top:22px; font-size:26px; color:#3d444d; line-height:1.5; background:#f7f8fa; border-radius:14px; padding:18px 24px; }
  .foot b { color:#e5484d; }
</style>
</head>
<body>
  <h1>别急着买什么，<em>先做这 3 件事</em></h1>
  <div class="sub">都是喂法，不涉及用药 —— 大多数吐，这两周就能看出来</div>

  <div class="cards">
    <div class="card">
      <div class="no">1</div>
      <div class="body">
        <div class="t">改成一天 4–6 小顿，粮薄摊或用慢食碗</div>
        <div class="w">只做这一件事，连做两周再看 —— 多数餐后吐会当场变轻。</div>
      </div>
    </div>
    <div class="card">
      <div class="no">2</div>
      <div class="body">
        <div class="t">清晨吐黄水的，加一顿睡前餐</div>
        <div class="w">别让它空着肚子十几个小时 —— 很多"固定清晨吐"就这样没了。</div>
      </div>
    </div>
    <div class="card">
      <div class="no">3</div>
      <div class="body">
        <div class="t">一周吐到 2 次以上，先记两周再决定</div>
        <div class="w">记次数、时间、照片；<b>这期间别换粮</b> —— 换了就说不清是粮的事还是喂法的事。</div>
      </div>
    </div>
  </div>

  <div class="foot"><b>时间线：</b>两周还没改善 → 就别再自己试了，带着记录去医院。症状不等于诊断，最终由兽医排查。</div>
</body>
</html>
