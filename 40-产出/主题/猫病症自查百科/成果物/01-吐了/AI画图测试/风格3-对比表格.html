<!DOCTYPE html><html><head><meta charset="UTF-8"><style>

<div class="hd"><h1>猫<span>吐</span>还是猫<span>咳</span>？<br>一张表分清</h1><div class="s">主人眼里的世界难题 · 兽医只看三个动作</div></div>
<table>
<tr><th>看什么</th><th>呕吐（胃的事）</th><th>咳嗽（气道的事）</th></tr>
<tr><td>脖子</td><td>低头缩着</td><td>向前伸直</td></tr>
<tr><td>肚子</td><td>明显一抽一抽收缩</td><td>基本不动、压低贴地</td></tr>
<tr><td>产物</td><td>有东西出来（粮/黄水/毛）</td><td>常常什么也没有</td></tr>
<tr><td>结尾</td><td>吐完舔嘴</td><td>全身一抖收尾</td></tr>
<tr><td>常见误解</td><td>——</td><td>被当成"哮喘"拖多年</td></tr>
</table>
<div class="warn"><h3>⚠️ 录下来再判断</h3><p>把它"咔"的那一下拍成短视频，对照上面 4 行。<br>这两件事对应的检查方向完全不同，弄反了会白跑一趟。</p></div>
