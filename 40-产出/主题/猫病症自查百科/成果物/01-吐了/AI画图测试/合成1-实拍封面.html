<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{width:1242px;height:1656px;position:relative;overflow:hidden}
.photo{position:absolute;inset:0;background:url('_photo1.jpg') center/cover}
/* 渐变遮罩：上浅下深，字压在下半部 */
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.82) 100%)}
.tag{position:absolute;top:56px;left:56px;background:rgba(255,255,255,.92);color:#D9481F;font-size:30px;font-weight:800;padding:12px 34px;border-radius:40px;letter-spacing:2px}
.em{position:absolute;top:52px;right:56px;font-size:64px;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.txt{position:absolute;bottom:0;left:0;right:0;padding:0 64px 110px}
h1{font-size:96px;color:#fff;font-weight:900;line-height:1.22;text-shadow:0 4px 24px rgba(0,0,0,.5);letter-spacing:2px}
h1 span{color:#FFC46B}
.s{font-size:32px;color:rgba(255,255,255,.92);margin-top:24px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.chips{display:flex;gap:18px;margin-top:36px}
.chip{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(6px);color:#fff;font-size:26px;padding:12px 28px;border-radius:36px}
.foot{position:absolute;bottom:44px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:22px;color:rgba(255,255,255,.65)}
</style></head><body>
<div class="photo"></div><div class="shade"></div>
<div class="tag">猫咪健康 · 自查百科</div>
<div class="em">🐱</div>
<div class="txt">
<h1>猫吐了，<br>先别慌：<span>4 种情况</span><br>对号入座</h1>
<div class="s">同样是吐，方向完全不一样 · 30 秒分清</div>
<div class="chips"><div class="chip">吃饭快?</div><div class="chip">空腹久?</div><div class="chip">还是咳?</div></div>
</div>
<div class="foot"><span>数据来源：猫病学第5版</span><span>左滑看自查步骤 →</span></div>
</body></html>
