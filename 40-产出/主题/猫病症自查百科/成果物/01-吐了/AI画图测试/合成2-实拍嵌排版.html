<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{width:1242px;height:1656px;background:#FFF6EA;padding:64px 58px}
.hd{text-align:center;margin-bottom:36px}
.hd .tag{display:inline-block;background:#FF8A5C;color:#fff;font-size:27px;font-weight:700;padding:9px 30px;border-radius:30px}
.hd h1{font-size:62px;color:#3D2B1F;font-weight:800;margin-top:20px}
.circle{width:560px;height:560px;border-radius:50%;overflow:hidden;margin:0 auto;border:14px solid #fff;box-shadow:0 12px 40px rgba(200,140,80,.25);background:url('_photo3.jpg') center/cover}
.speech{width:fit-content;margin:30px auto 0;background:#fff;border-radius:26px;padding:24px 44px;box-shadow:0 6px 20px rgba(200,140,80,.18);position:relative}
.speech::before{content:"";position:absolute;top:-16px;left:50%;margin-left:-16px;width:32px;height:32px;background:#fff;transform:rotate(45deg)}
.speech p{font-size:32px;color:#5A4636;font-weight:700}
.speech p b{color:#E56B3C}
.list{margin-top:44px}
.item{background:#fff;border-radius:22px;padding:26px 34px;margin-bottom:20px;box-shadow:0 4px 16px rgba(200,140,80,.1);display:flex;gap:20px;align-items:center}
.item .ic{font-size:40px}
.item p{font-size:29px;color:#4A3B2C;line-height:1.55}
.item p b{color:#E56B3C}
.foot{margin-top:32px;text-align:center;font-size:24px;color:#B09A82}
</style></head><body>
<div class="hd"><div class="tag">谁更容易中招</div><h1>这 3 类猫 · 吐要格外小心</h1></div>
<div class="circle"></div>
<div class="speech"><p>「猫：我只是舔毛舔多了而已 🙃」</p></div>
<div class="list">
<div class="item"><div class="ic">🍼</div><p><b>2-6 个月幼猫</b>：换粮、驱虫、乱捡东西，最容易吃快吃错</p></div>
<div class="item"><div class="ic">🐱</div><p><b>长毛猫</b>：舔进肚子的毛多，吐毛球是常事——梳毛加频</p></div>
<div class="item"><div class="ic">👵</div><p><b>8 岁以上老猫</b>：反复呕吐要查肾，波斯/缅因/暹罗更明显</p></div>
</div>
<div class="foot">数据来源：猫病学第5版 ｜ 2 / 6</div>
</body></html>
