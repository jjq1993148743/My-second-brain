<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{width:1242px;height:1656px;background:#141414;padding:70px 60px}
.badge{display:inline-block;background:#FF3B3B;color:#fff;font-size:28px;font-weight:800;padding:10px 30px;border-radius:8px;letter-spacing:4px}
h1{font-size:82px;color:#fff;font-weight:900;margin:30px 0 8px;line-height:1.2}
h1 span{color:#FF3B3B}
.s{font-size:30px;color:#999;margin-bottom:54px}
.blk{border:3px solid #333;border-radius:20px;padding:36px 40px;margin-bottom:28px;position:relative}
.blk.now{border-color:#FF3B3B;background:rgba(255,59,59,.06)}
.blk h3{font-size:38px;color:#fff;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:16px}
.blk.now h3{color:#FF6B6B}
.blk p{font-size:29px;color:#C8C8C8;line-height:1.7}
.blk p b{color:#FF6B6B}
.num{position:absolute;top:-26px;left:32px;background:#FF3B3B;color:#fff;font-size:28px;font-weight:800;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.blk:not(.now) .num{background:#444}
.bot{margin-top:44px;background:#FF3B3B;border-radius:18px;padding:34px 40px}
.bot p{font-size:34px;color:#fff;font-weight:800;line-height:1.6;text-align:center}
.foot{margin-top:32px;text-align:center;font-size:23px;color:#666}
</style></head><body>
<div class="badge">紧急程度自查</div>
<h1>猫吐了<br>这 <span>4 种</span>别拖</h1>
<div class="s">出现任何一条 → 直接去医院</div>
<div class="blk now"><div class="num">1</div><h3>吐出物带血丝 / 咖啡渣样</h3><p>消化道出血信号，<b>立刻就医</b></p></div>
<div class="blk now"><div class="num">2</div><h3>公猫蹲盆做呕状 + 尿团变小</h3><p>那是<b>尿路堵了不是胃病</b>，按急症处理</p></div>
<div class="blk now"><div class="num">3</div><h3>吐 + 喝得多 + 体重在掉</h3><p>和吃太快不是一回事，<b>往内脏方向查</b></p></div>
<div class="blk now"><div class="num">4</div><h3>布偶/缅因/英短/美短 呼吸快+咳</h3><p>往<b>心肌病</b>那条线核对，别按胃病治</p></div>
<div class="bot"><p>偶尔一次吐 = 先改喂法<br>上面任何一条 = 别改喂法，去医院</p></div>
<div class="foot">来源：猫病学第5版 · 2025 iCatCare LUTD 共识 ｜ 5 / 6</div>
</body></html>
