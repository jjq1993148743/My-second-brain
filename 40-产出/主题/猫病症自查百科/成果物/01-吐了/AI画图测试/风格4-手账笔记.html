<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{width:1242px;height:1656px;background:#F6F1E7;padding:60px 50px;position:relative}
body::before{content:"🐾";position:absolute;top:40px;right:50px;font-size:70px;opacity:.15}
.tape{position:absolute;width:180px;height:44px;background:rgba(255,190,150,.5);transform:rotate(-4deg);top:30px;left:50%;margin-left:-90px}
.paper{background:#FFFDF8;border-radius:6px;padding:56px 48px;box-shadow:0 10px 30px rgba(120,90,60,.15);position:relative;min-height:1500px}
.paper::before{content:"";position:absolute;left:64px;top:0;bottom:0;width:2px;background:#F3D9C0}
.item{position:relative;padding-left:44px;margin-bottom:40px}
.item::before{content:"";position:absolute;left:0;top:12px;width:18px;height:18px;border-radius:50%;background:#F0A868;border:4px solid #FBE3C9}
.date{font-size:26px;color:#C9A87E;letter-spacing:4px;margin-bottom:16px}
h1{font-size:64px;color:#4A3B2C;font-weight:800;line-height:1.3;margin-bottom:10px}
h1 em{font-style:normal;color:#E58C4A;border-bottom:8px solid #FBE3C9}
.s{font-size:28px;color:#A68F72;margin-bottom:44px}
.list{list-style:none}
.list li{font-size:30px;color:#5C4B38;line-height:1.7;margin-bottom:26px;padding-left:8px}
.list b{color:#E58C4A}
.doodle{background:#FFF6E8;border-radius:18px;padding:28px 32px;margin-top:10px}
.doodle p{font-size:27px;color:#7A6248;line-height:1.7}
.doodle b{color:#D97742}
.foot{text-align:center;margin-top:40px;font-size:24px;color:#C9A87E;letter-spacing:2px}
</style></head><body>
<div class="tape"></div>
<div class="paper">
<div class="date">CAT HEALTH NOTES · VOL.1</div>
<h1>铲屎官笔记 · <em>呕吐篇</em></h1>
<div class="s">喂法不对，猫天天吐；这 5 件小事先做到</div>
<ul class="list">
<li>粮<b>薄薄摊在平盘</b>上，逼它小口吃——一口吞的猎食天性必反胃</li>
<li>同一天的量<b>拆成 4-6 顿</b>，比换更贵的粮管用</li>
<li><b>睡前留一小份</b>，清晨吐黄水多半是饿的</li>
<li>刚吃完<b>别逗别抱</b>，胃小贲门松，一动就带出来</li>
<li>换粮<b>7-10 天掺着换</b>，出现吐就退回上一档比例</li>
</ul>
<div class="doodle"><p>💡 <b>老炮一句话</b>：吐完别立刻拿罐头"安慰"，它会学会"吐了才有好吃的"。水一直留着，别撤。</p></div>
<div class="foot">— 记录每一个小异常 · 4 / 6 —</div>
</div>
</body></html>
