<!DOCTYPE html><html><head><meta charset="UTF-8"><style>

body::before{content:"";position:absolute;top:-120px;right:-120px;width:400px;height:400px;border-radius:50%;background:#FFE3C8;opacity:.6}
body::after{content:"";position:absolute;bottom:-100px;left:-100px;width:320px;height:320px;border-radius:50%;background:#FFE3C8;opacity:.5}
.tag{display:inline-block;background:#FF8A5C;color:#fff;font-size:30px;font-weight:700;padding:10px 32px;border-radius:40px;letter-spacing:2px}

.sub{font-size:30px;color:#9B7E63;margin-bottom:44px}
.card{background:#fff;border-radius:28px;padding:36px 40px;margin-bottom:26px;box-shadow:0 6px 24px rgba(180,140,100,.12);position:relative;z-index:1}
.card h3{font-size:36px;color:#E56B3C;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.num{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:#FFE3C8;color:#E56B3C;font-size:30px;font-weight:800;flex-shrink:0}

</style></head><body>
<div class="tag">猫咪健康 · 自查百科</div>
<h1>猫总吐？先分清<br>这 4 种情况</h1>
<div class="sub">同样是吐，方向完全不一样</div>
<div class="card"><h3><span class="num">1</span>饭后半小时内吐</h3><p>吐出来的粮<span class="hl">一粒一粒没泡开</span>，吐完立刻还要吃 → 大概率是<span class="hl">吃太快</span>，喂法的事</p></div>
<div class="card"><h3><span class="num">2</span>清晨吐黄水 / 白沫</h3><p>碗是空的、肚子空了十几个小时 → <span class="hl">空腹太久</span>，胃酸刺激</p></div>
<div class="card"><h3><span class="num">3</span>伸脖子"咔咔"像吐又吐不出</h3><p>脖子伸直、身子压低、全身一抖 → <span class="hl">那是咳嗽不是吐</span>，方向完全不同</p></div>
<div class="card"><h3><span class="num">4</span>吐黄水 + 喝得多 + 掉秤</h3><p>和吃太快完全是两回事 → <span class="hl">别在家拖</span>，往内脏方向查</p></div>
<div class="foot"><span class="tip">数据来源：猫病学第5版</span><span class="page">1 / 6</span></div>
</body></html>
