<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{width:1242px;height:1656px;background:#E8E2D5;padding:56px 48px;position:relative}
.hd{text-align:center;margin-bottom:44px}
.hd h1{font-size:66px;color:#2B2B2B;font-weight:900}
.hd .s{font-size:27px;color:#7A7264;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.note{padding:30px 30px;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.n1{background:#FFEFC2;transform:rotate(-1.2deg)}
.n2{background:#D9F2E3;transform:rotate(1deg)}
.n3{background:#FFE0DB;transform:rotate(.8deg)}
.n4{background:#E3ECFF;transform:rotate(-.9deg)}
.n5{background:#F3E4FF;transform:rotate(1.1deg);grid-column:1/3}
.note h4{font-size:30px;margin-bottom:12px;color:#2B2B2B}
.note p{font-size:25px;color:#4A4A4A;line-height:1.65}
.pin{position:absolute;top:-12px;left:50%;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:#C0392B;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.bot{margin-top:26px;background:#2B2B2B;border-radius:16px;padding:26px 32px}
.bot p{font-size:27px;color:#FFEFC2;line-height:1.6;text-align:center}
.foot{text-align:center;margin-top:24px;font-size:23px;color:#8A8272}
</style></head><body>
<div class="hd"><h1>猫吐了 · 便利贴急救板</h1><div class="s">撕下你能用的一条 · 按顺序试</div></div>
<div class="grid">
<div class="note n1"><div class="pin"></div><h4>🍽 吃太快</h4><p>一顿粮薄摊平盘，或换慢食碗。连做两周，餐后吐就停</p></div>
<div class="note n2"><div class="pin"></div><h4>🌅 清晨吐黄水</h4><p>空腹太久。睡前加一小份粮，3 天见效</p></div>
<div class="note n3"><div class="pin"></div><h4>🌀 吐毛球</h4><p>梳毛加频 + 化毛膏/猫草。一梳一大把的猫重点照顾</p></div>
<div class="note n4"><div class="pin"></div><h4>🔄 换粮期</h4><p>新旧粮 7-10 天掺着换，吐了退回上一档别硬推</p></div>
<div class="note n5"><div class="pin"></div><h4>📋 两周记账法（最值钱的一条）</h4><p>手机只记四样：日期、几点、离吃饭多久、吐出物拍照。一周 ≥2 次或总在同一钟点 → 带记录去医院，别在家继续试</p></div>
</div>
<div class="bot"><p>公猫蹲盆做呕状 + 尿团变小 = 尿路堵塞，是急症，不是胃病</p></div>
<div class="foot">来源：猫病学第5版 ｜ 6 / 6</div>
</body></html>
