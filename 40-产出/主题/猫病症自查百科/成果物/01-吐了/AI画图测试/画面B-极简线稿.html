<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
body{width:1242px;height:1656px;background:#FBFAF7;display:flex;flex-direction:column;align-items:center;padding:80px 70px}
.num{align-self:flex-start;font-size:30px;color:#C9C2B4;letter-spacing:6px;margin-bottom:24px}
h1{font-size:70px;color:#26221C;font-weight:900;line-height:1.25;margin-bottom:12px}
h1 span{background:linear-gradient(transparent 62%,#FFD8A8 62%)}
.s{font-size:28px;color:#A39A88;margin:18px 0 50px;align-self:flex-start}

.cap{margin-top:44px;width:100%}
.cap .row{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.cap .dot{width:14px;height:14px;border-radius:50%;background:#E58C4A;margin-top:14px;flex-shrink:0}
.cap p{font-size:30px;color:#4A4034;line-height:1.65}
.cap b{color:#D97742}
.foot{margin-top:30px;align-self:flex-start;font-size:23px;color:#C9C2B4}

<div class="num">VOL.01 · VOMIT</div>
<h1>猫咪呕吐的<br><span>3 个真相</span></h1>
<div class="s">别急着百度，先把这页看完</div>
<svg viewBox="0 0 1100 620" fill="none">
  <!-- 地线 -->
  <line x1="60" y1="540" x2="1040" y2="540" stroke="#D8D2C4" stroke-width="5" stroke-linecap="round"/>
  <!-- 猫：拱背线条 -->
  <path d="M 250 540 Q 240 400 330 370 Q 440 335 560 370 Q 660 400 668 540" stroke="#26221C" stroke-width="12" stroke-linecap="round" fill="#FFF6E8"/>
  <!-- 头 -->
  <circle cx="255" cy="395" r="88" stroke="#26221C" stroke-width="12" fill="#FFF6E8"/>
  <!-- 耳朵 -->
  <path d="M 195 330 L 180 262 L 245 296" stroke="#26221C" stroke-width="12" stroke-linejoin="round" fill="#FFF6E8"/>
  <path d="M 315 330 L 330 262 L 265 296" stroke="#26221C" stroke-width="12" stroke-linejoin="round" fill="#FFF6E8"/>
  <!-- 眼睛（难受眯眼） -->
  <path d="M 218 388 Q 232 378 246 388" stroke="#26221C" stroke-width="9" stroke-linecap="round"/>
  <path d="M 264 388 Q 278 378 292 388" stroke="#26221C" stroke-width="9" stroke-linecap="round"/>
  <!-- 嘴（向下） -->
  <path d="M 238 438 Q 255 428 272 438" stroke="#26221C" stroke-width="9" stroke-linecap="round"/>
  <!-- 尾巴 -->
  <path d="M 655 470 Q 760 450 745 350 Q 738 300 690 300" stroke="#26221C" stroke-width="12" stroke-linecap="round"/>
  <!-- 吐出物 -->
  <ellipse cx="300" cy="548" rx="80" ry="24" fill="#C9DF8B" stroke="#26221C" stroke-width="8"/>
  <circle cx="270" cy="540" r="9" fill="#B98A55"/>
  <circle cx="320" cy="544" r="9" fill="#B98A55"/>
  <!-- 粮碗 -->
  <path d="M 830 540 L 1000 540 L 972 480 L 858 480 Z" fill="#DCEBFA" stroke="#26221C" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="915" cy="480" rx="57" ry="14" fill="#C98B4B" stroke="#26221C" stroke-width="8"/>
  <!-- zzz与汗 -->
  <text x="205" y="270" font-size="52" fill="#A39A88" font-weight="bold">💧</text>
  <text x="700" y="270" font-size="46" fill="#A39A88">?</text>
  <!-- 标注 -->
  <line x1="300" y1="585" x2="300" y2="612" stroke="#A39A88" stroke-width="4"/>
  <text x="228" y="608" font-size="30" fill="#7A7264">吐出物要拍照</text>
</svg>
<div class="cap">
<div class="row"><div class="dot"></div><p><b>吃太快</b>：猫是一口气吞的猎食型，牙齿不细嚼——粮薄摊平盘，多数餐后吐当场就轻</p></div>
<div class="row"><div class="dot"></div><p><b>空腹太久</b>：清晨吐黄水多半是饿的——睡前留一小份粮</p></div>
<div class="row"><div class="dot"></div><p><b>一周 ≥2 次</b>：已经不算偶尔——记两周日志再决定下一步</p></div>
</div>
<div class="foot">SOURCE: 猫病学 5TH ED · PAGE 236</div>
</body></html>
