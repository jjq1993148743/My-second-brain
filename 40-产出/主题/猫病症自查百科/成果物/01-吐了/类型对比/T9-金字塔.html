<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1656px;background:#faf9f7;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:relative;width:1242px;height:1656px}
.h{position:absolute;text-align:center;width:1242px;top:40px;font-size:44px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:8px}
.tier{position:absolute;color:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.tier .p{font-size:44px;font-weight:800}
.tier .t{font-size:30px;font-weight:800;margin-top:6px}
.tier .d{font-size:24px;margin-top:10px;line-height:1.5;opacity:.95}
.top{left:421px;top:230px;width:400px;height:280px;background:#e5484d}
.mid{left:261px;top:560px;width:720px;height:300px;background:#f0a52e}
.bot{left:101px;top:910px;width:1040px;height:380px;background:#2e9e5b}
.note{position:absolute;left:101px;top:1340px;width:1040px;text-align:center;font-size:23px;color:#888;line-height:1.5}
</style></head><body>
<div class="stage">
<div class="h">类型 9 · 金字塔（概率 × 紧迫度）<small>越往上越少见，但越要马上行动</small></div>
<div class="tier top"><div class="p">约 5%</div><div class="t">红 · 当天去医院</div><div class="d">血丝 / 咖啡渣样<br>吐完就蔫不吃不动<br>公猫蹲盆尿团变小</div></div>
<div class="tier mid"><div class="p">约 15%</div><div class="t">黄 · 记账观察，带记录就医</div><div class="d">一周吐 2 次以上、总在同一个钟点；同时喝得多、体重在掉；大半年每周固定吐一次</div></div>
<div class="tier bot"><div class="p">约 80%</div><div class="t">绿 · 在家调喂法</div><div class="d">吃太快：餐后吐未消化猫粮 → 粮摊薄平盘 / 慢食碗，试 2 周<br>空腹久：清晨吐黄水白沫 → 睡前一小份，试 3 天<br>换毛季：吐带毛的团 → 每天梳毛，数一周几次<br>精神食欲照好、水照喝，就先在这一层处理</div></div>
<div class="note">比例是猫科门诊的通行印象，属概率提示不是诊断线；对上了不代表"一定是"。</div>
</div>
</body></html>
