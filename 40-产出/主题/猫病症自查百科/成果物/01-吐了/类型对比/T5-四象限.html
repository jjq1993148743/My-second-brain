<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1656px;background:#faf9f7;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:relative;width:1242px;height:1656px}
svg{position:absolute;left:0;top:0}
.h{position:absolute;text-align:center;width:1242px;top:40px;font-size:44px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:8px}
.q{position:absolute;width:500px;height:520px;border-radius:18px;padding:26px 28px}
.q .t{font-size:32px;font-weight:800}
.q .d{margin-top:14px;font-size:25px;line-height:1.6}
.q .c{margin-top:16px;font-size:27px;font-weight:800}
.qr{background:#fbe3e3;border:3px solid #e5484d}.qr .t,.qr .d,.qr .c{color:#8a1f1f}
.qg{background:#e3f2e8;border:3px solid #2e9e5b}.qg .t,.qg .d,.qg .c{color:#1c5b34}
.qy{background:#fdf3dd;border:3px solid #f0a52e}.qy .t,.qy .d,.qy .c{color:#7a5206}
.al{position:absolute;font-size:25px;font-weight:700;color:#555}
</style></head><body>
<div class="stage">
<svg width="1242" height="1656">
<line x1="621" y1="200" x2="621" y2="1400" stroke="#333" stroke-width="4"/>
<polygon points="621,190 610,214 632,214" fill="#333"/>
<line x1="80" y1="795" x2="1170" y2="795" stroke="#333" stroke-width="4"/>
<polygon points="1180,795 1156,784 1156,806" fill="#333"/>
</svg>
<div class="h">类型 5 · 四象限矩阵<small>频率 × 状态 两轴定位 —— 一眼找到你家猫在哪格</small></div>
<div class="al" style="left:520px;top:150px">精神食欲变差</div>
<div class="al" style="left:520px;top:1420px">精神食欲都好</div>
<div class="al" style="left:80px;top:1450px">← 偶尔吐一次</div>
<div class="al" style="left:900px;top:1450px">一周吐到 2 次以上 →</div>
<div class="q qr" style="left:100px;top:240px"><div class="t">左上 · 偶尔但状态差</div><div class="d">吐完精神一起垮、不吃不动；或吐出物带血丝、咖啡渣样深褐色</div><div class="c">红 · 当天去医院</div></div>
<div class="q qr" style="left:640px;top:240px"><div class="t">右上 · 频繁且状态差</div><div class="d">一周吐多次还伴：公猫蹲盆尿团变小 / 呼吸快不肯跳 / 喝多+掉秤</div><div class="c">红 · 立刻就医，按急症</div></div>
<div class="q qg" style="left:100px;top:820px"><div class="t">左下 · 偶尔且状态好</div><div class="d">餐后吐未消化粮、清晨吐黄水、换毛季吐毛团——精神照好、水照喝</div><div class="c">绿 · 改喂法观察</div></div>
<div class="q qy" style="left:640px;top:820px"><div class="t">右下 · 频繁但状态好</div><div class="d">大半年每周固定吐一次，你习惯了——但猫本来不该这样</div><div class="c">黄 · 记账 2 周带记录就医</div></div>
</div>
</body></html>
