<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1656px;background:#faf9f7;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:relative;width:1242px;height:1656px}
svg{position:absolute;left:0;top:0}
.h{position:absolute;text-align:center;width:1242px;top:40px;font-size:44px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:8px}
.n{position:absolute;width:360px;background:#fff;border:2px solid #333;border-radius:16px;padding:18px 20px;text-align:center;font-size:27px;font-weight:800;line-height:1.4}
.n small{display:block;font-size:22px;font-weight:400;color:#666;margin-top:6px;line-height:1.45}
.center{position:absolute;left:441px;top:700px;width:360px;background:#333;color:#fff;border-radius:18px;padding:22px;text-align:center;font-size:32px;font-weight:800}
.center small{display:block;font-size:22px;font-weight:400;color:#bbb;margin-top:8px;line-height:1.5}
.label{position:absolute;background:#f4f2ef;border:1px solid #ddd;border-radius:999px;padding:6px 18px;font-size:22px;color:#555}
.disc{position:absolute;left:100px;top:1400px;width:1042px;background:#eef1f5;border-radius:14px;padding:20px 26px;font-size:24px;line-height:1.55;color:#4a5568}
</style></head><body>
<div class="stage">
<svg width="1242" height="1656">
<line x1="621" y1="700" x2="900" y2="400" stroke="#999" stroke-width="3"/>
<line x1="621" y1="700" x2="340" y2="400" stroke="#999" stroke-width="3"/>
<line x1="621" y1="880" x2="340" y2="1130" stroke="#999" stroke-width="3"/>
<line x1="621" y1="880" x2="900" y2="1130" stroke="#999" stroke-width="3"/>
</svg>
<div class="h">类型 7 · 概念图（关系连线）<small>连线带标签，讲"这些情况之间是什么关系"</small></div>
<div class="center">呕吐<small>主人眼里的"吐了"<br>要和三件事分开看</small></div>
<div class="n" style="left:720px;top:260px">反流 / 吐毛球 / 咳嗽<small>在主人眼里长得几乎一样，处理方式完全不同</small></div>
<div class="n" style="left:160px;top:260px">先尿多、喝多、掉秤<small>之后才出现不吃和呕吐（慢性肾病共识的先后顺序）</small></div>
<div class="n" style="left:160px;top:1130px; border-color:#f0a52e">喝得多 + 体重在掉<small>方向不在"吃太快"，记一周水量体重带去就医</small></div>
<div class="n" style="left:720px;top:1130px; border-color:#e5484d">公猫蹲盆 + 尿团变小<small>尿路可能堵了，按急症处理，不是胃病</small></div>
<div class="label" style="left:700px;top:500px">需要分清</div>
<div class="label" style="left:390px;top:500px">先后顺序</div>
<div class="label" style="left:400px;top:1000px">提示方向</div>
<div class="label" style="left:730px;top:1000px">急症信号</div>
<div class="disc">症状不等于诊断：同一条"呕吐"在书上能对应十多种病因。概念图只帮你理清关系，最终由兽医排查。</div>
</div>
