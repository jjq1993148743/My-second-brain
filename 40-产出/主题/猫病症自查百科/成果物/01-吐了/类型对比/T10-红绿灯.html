<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1656px;background:#faf9f7;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:relative;width:1242px;height:1656px}
.h{position:absolute;text-align:center;width:1242px;top:40px;font-size:44px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:8px}
.light{position:absolute;left:100px;width:1042px;border-radius:22px;padding:30px 34px;display:flex;gap:28px;align-items:center}
.bulb{flex:none;width:120px;height:120px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff}
.lg{background:#e3f2e8;border:3px solid #2e9e5b}.lg .bulb{background:#2e9e5b}
.ly{background:#fdf3dd;border:3px solid #f0a52e}.ly .bulb{background:#f0a52e}
.lr{background:#fbe3e3;border:3px solid #e5484d}.lr .bulb{background:#e5484d}
.c h3{font-size:34px;font-weight:800}
.lg h3{color:#1c6b3c}.ly h3{color:#8a5b06}.lr h3{color:#9c2020}
.c p{margin-top:10px;font-size:25px;line-height:1.55;color:#333}
.c p b{color:#111}
</style></head><body>
<div class="stage">
<div class="h">类型 10 · 红绿灯（最简行动卡）<small>不用看懂原理，只看颜色办事</small></div>
<div class="light lg" style="top:250px"><div class="bulb">绿</div><div class="c"><h3>在家改喂法</h3><p>餐后吐未消化粮 → <b>粮摊薄平盘或换慢食碗，试 2 周</b><br>清晨吐黄水白沫 → <b>睡前留一小份，试 3 天</b><br>换毛季吐毛团 → <b>每天梳一次毛</b></p></div></div>
<div class="light ly" style="top:680px"><div class="bulb">黄</div><div class="c"><h3>开始记账，带着记录就医</h3><p>一周吐到 2 次以上、总在同一个钟点<br>同时喝得多、体重在掉<br>伸脖子"咔"没吐出东西 → 那是咳，<b>录段视频</b><br>记法：日期、几点、离饭多久、拍张照，记满 2 周</p></div></div>
<div class="light lr" style="top:1180px"><div class="bulb">红</div><div class="c"><h3>当天去医院，别自己扛</h3><p>吐出物带<b>血丝</b>、或<b>咖啡渣样深褐色</b><br>吐完精神一起垮掉、不吃不动<br><b>公猫</b>蹲猫砂盆使劲、尿团还变小<br>呼吸变快、不肯跳上跳下</p></div></div>
</div>
</body></html>
