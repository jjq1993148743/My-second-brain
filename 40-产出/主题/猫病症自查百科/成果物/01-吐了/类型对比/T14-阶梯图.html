<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1656px;background:#faf9f7;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:relative;width:1242px;height:1656px}
.h{position:absolute;text-align:center;width:1242px;top:40px;font-size:44px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:8px}
.step{position:absolute;border-radius:16px 16px 0 0;padding:22px 24px;color:#fff}
.s1{left:30px;top:1180px;width:300px;height:330px;background:#2e9e5b}
.s2{left:330px;top:940px;width:300px;height:570px;background:#3d8f63}
.s3{left:630px;top:700px;width:300px;height:810px;background:#f0a52e}
.s4{left:930px;top:460px;width:282px;height:1050px;background:#e5484d}
.n{font-size:26px;font-weight:800;opacity:.85}
.t{font-size:31px;font-weight:800;margin-top:6px}
.d{font-size:23px;line-height:1.55;margin-top:12px;opacity:.95}
.jump{position:absolute;left:30px;top:300px;width:1182px;background:#fbe3e3;border:3px dashed #e5484d;border-radius:16px;padding:20px 26px;font-size:26px;font-weight:800;color:#8a1f1f;line-height:1.5}
.jump small{display:block;font-size:22px;font-weight:400;margin-top:6px}
</style></head><body>
<div class="stage">
<div class="h">类型 14 · 阶梯图（什么时候升级）<small>从下往上一级级走；红线可以一步跳到顶</small></div>
<div class="step s1"><div class="n">第 1 级</div><div class="t">先记录</div><div class="d">拍一张吐出物；手机记日期、几点、离饭多久</div></div>
<div class="step s2"><div class="n">第 2 级</div><div class="t">改喂法 2 周</div><div class="d">粮摊薄平盘 / 慢食碗；睡前留一小份；每天梳毛<br><br>两周内不再吐 → 停在这级就行</div></div>
<div class="step s3"><div class="n">第 3 级</div><div class="t">带记录就医</div><div class="d">照旧吐、一周 2 次以上；或喝多+掉秤、伸脖子"咔"<br><br>把记录和照片一起给医生，比口头描述有用</div></div>
<div class="step s4"><div class="n">第 4 级</div><div class="t">当天就医</div><div class="d">血丝 / 咖啡渣样<br>吐完就蔫不吃不动<br>公猫蹲盆尿团变小<br>呼吸快、不肯跳<br><br>不用记录，直接去</div></div>
<div class="jump">随时可以跳级<small>出现上面第 4 级任何一条，不用从第 1 级走起。</small></div>
</div>
</body></html>
