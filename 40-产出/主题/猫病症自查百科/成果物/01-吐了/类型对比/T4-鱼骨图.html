<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:1656px;background:#faf9f7;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.stage{position:relative;width:1242px;height:1656px}
svg{position:absolute;left:0;top:0}
.h{position:absolute;text-align:center;width:1242px;top:40px;font-size:44px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:8px}
.head{position:absolute;left:1020px;top:780px;width:190px;height:140px;background:#333;color:#fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:800}
.head small{font-size:19px;font-weight:400;color:#aaa;margin-top:4px}
.bone{position:absolute;width:310px;background:#fff;border:1px solid #e3e0da;border-radius:14px;padding:16px 18px}
.bone h3{font-size:26px;margin-bottom:8px;padding-left:14px;border-left:8px solid #bbb}
.bone li{font-size:22px;color:#555;line-height:1.5;list-style:none;padding-left:22px;position:relative}
.bone li:before{content:"";position:absolute;left:2px;top:12px;width:9px;height:9px;border-radius:50%;background:#bbb}
.g h3{border-left-color:#2e9e5b;color:#1c6b3c}.y h3{border-left-color:#f0a52e;color:#8a5b06}.r h3{border-left-color:#e5484d;color:#9c2020}
</style></head><body>
<div class="stage">
<svg width="1242" height="1656">

<div class="h">类型 4 · 鱼骨图（因果归类）<small>问题在头，骨头是原因大类 —— 适合"可能是什么原因"</small></div>
<div class="head">猫呕吐<small>原因大类</small></div>
<div class="bone g" style="left:80px;top:330px"><h3>喂法与节奏</h3><ul><li>吃太快：餐后吐未消化粮</li><li>空腹久：清晨黄水</li><li>一次摆一大碗</li></ul></div>
<div class="bone g" style="left:370px;top:330px"><h3>毛与舔咬</h3><ul><li>换毛季吐毛团</li><li>掉毛突然变多</li></ul></div>
<div class="bone y" style="left:660px;top:330px"><h3>气道与心</h3><ul><li>咳嗽常被当成吐</li><li>布偶缅因英短美短留意</li></ul></div>
<div class="bone r" style="left:80px;top:1150px"><h3>吞入异物</h3><ul><li>线头、橡皮筋、发圈</li><li>塑料袋、猫草被啃</li></ul></div>
<div class="bone r" style="left:370px;top:1150px"><h3>感染与炎症</h3><ul><li>胃肠炎、胰腺炎</li><li>吐完精神一起垮</li></ul></div>
<div class="bone y" style="left:660px;top:1150px"><h3>内脏与代谢</h3><ul><li>肾病：喝多+掉秤</li><li>甲亢：能吃却瘦</li></ul></div>
</div>
