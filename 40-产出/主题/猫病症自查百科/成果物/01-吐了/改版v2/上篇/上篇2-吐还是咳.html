<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上篇2 · 是吐还是咳</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#16181d;
    padding:58px 54px 46px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:62px; font-weight:800; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:29px; color:#6b7280; margin-top:16px; line-height:1.45; }
  .tbl { margin-top:34px; flex:1; display:flex; flex-direction:column; gap:14px; }
  .thead { display:flex; gap:16px; }
  .thead .c0 { flex:0 0 150px; }
  .thead .c1, .thead .c2 {
    flex:1; text-align:center; font-size:36px; font-weight:800;
    border-radius:14px; padding:16px 0; color:#fff;
  }
  .c1 { background:#2e9e5b; }
  .c2 { background:#e5484d; }
  .trow { flex:1; display:flex; gap:16px; align-items:stretch; }
  .trow .c0 {
    flex:0 0 150px; display:flex; align-items:center;
    font-size:27px; color:#6b7280; font-weight:700;
  }
  .trow .c1, .trow .c2 {
    flex:1; display:flex; align-items:center;
    font-size:29px; line-height:1.4; border-radius:14px; padding:18px 24px;
  }
  .trow .c1 { background:#eef7f1; }
  .trow .c2 { background:#fdf3ee; }
  .foot { margin-top:26px; font-size:24px; color:#8a9099; line-height:1.55; }
</style>
</head>
<body>
  <h1>别搞混：它是<em>吐</em>，还是在<em>咳</em>？</h1>
  <div class="sub">这两件事方向完全不同 —— 很多猫的"咳"，被当成胃病拖了好几年</div>

  <div class="tbl">
    <div class="thead">
      <div class="c0"></div>
      <div class="c1">吐</div>
      <div class="c2">咳</div>
    </div>
    <div class="trow">
      <div class="c0">肚子</div>
      <div class="c1">明显一抽一抽地收缩</div>
      <div class="c2">不抽，脖子前伸、身子压低贴地</div>
    </div>
    <div class="trow">
      <div class="c0">声音</div>
      <div class="c1">"呕"</div>
      <div class="c2">"咔"</div>
    </div>
    <div class="trow">
      <div class="c0">吐出物</div>
      <div class="c1">粮、黄水、毛团</div>
      <div class="c2">常常什么也没有</div>
    </div>
    <div class="trow">
      <div class="c0">收尾</div>
      <div class="c1">把东西吐出来为止</div>
      <div class="c2">全身一抖，像打了个空嗝</div>
    </div>
    <div class="trow">
      <div class="c0">吐完</div>
      <div class="c1">有时还想回去吃</div>
      <div class="c2">没胃口，趴着不动</div>
    </div>
  </div>

  <div class="foot">还有一种叫反流：刚吃完就出来、没有"呕"的动作。<br>拿不准就录一段短视频，就医时直接给医生看，比嘴上描述准得多。</div>
</body>
</html>
