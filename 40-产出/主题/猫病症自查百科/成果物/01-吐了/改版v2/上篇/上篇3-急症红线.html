<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上篇3 · 急症红线</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1242px; height:1656px; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
    background:#ffffff; color:#16181d;
    padding:58px 54px 46px;
    display:flex; flex-direction:column;
  }
  h1 { font-size:62px; font-weight:800; line-height:1.18; }
  h1 em { font-style:normal; color:#e5484d; }
  .sub { font-size:29px; color:#6b7280; margin-top:16px; }
  .cards { margin-top:38px; flex:1; display:flex; flex-direction:column; gap:18px; }
  .card {
    flex:1; border:2px solid #f3d9cd; border-left:12px solid #e5484d;
    border-radius:18px; background:#fdf3ee; padding:26px 32px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .card .t { font-size:35px; font-weight:800; line-height:1.3; }
  .card .w { font-size:26px; color:#6b7280; margin-top:10px; line-height:1.45; }
  .foot { margin-top:26px; font-size:23px; color:#8a9099; line-height:1.5; }
</style>
</head>
<body>
  <h1>这 <em>4 种</em>，别在家等</h1>
  <div class="sub">出现了就别观察过夜，当天去医院</div>

  <div class="cards">
    <div class="card">
      <div class="t">吐出物带血丝、或呈咖啡渣样的深褐色</div>
      <div class="w">这是上消化道在出血的信号，不是普通呕吐。</div>
    </div>
    <div class="card">
      <div class="t">吐完精神一起垮，不吃不动</div>
      <div class="w">说明不只是胃的事，可能是全身性的问题。</div>
    </div>
    <div class="card">
      <div class="t">公猫蹲在猫砂盆里做呕状、却吐不出东西</div>
      <div class="w">这多半是尿路堵了，不是胃病 —— 拖不得。</div>
    </div>
    <div class="card">
      <div class="t">呼吸变快、张口呼吸、不肯跳上跳下</div>
      <div class="w">别按胃病治，要往心脏那条线核对。</div>
    </div>
  </div>

  <div class="foot">症状不等于诊断：以上是分流参考，最终由兽医排查。</div>
</body>
</html>
