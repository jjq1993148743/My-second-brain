<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;height:960px;background:#faf9f7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#222;overflow:hidden}
.wrap{padding:40px 44px}
.h{text-align:center;font-size:46px;font-weight:800}
.h small{display:block;font-size:23px;color:#888;font-weight:400;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:26px;background:#fff}
th{background:#333;color:#fff;font-size:22px;padding:14px 8px;font-weight:800}
td{border:1px solid #e3e0da;font-size:21px;padding:13px 10px;text-align:center;color:#444;height:64px}
tr.ex td{background:#f4f2ef;color:#666;font-size:20px}
tr.ex td b{color:#111}
.foot{margin-top:22px;background:#eef1f5;border-radius:14px;padding:16px 22px;font-size:22px;line-height:1.55;color:#4a5568}
.foot b{color:#111}
</style></head><body>
<div class="wrap">
  <div class="h">呕吐记录表：带去医院就靠它<small>截图存手机，吐一次记一行，拍照比写字快</small></div>
  <table>
    <tr><th style="width:12%">日期</th><th style="width:11%">几点吐</th><th style="width:17%">离上次吃饭</th><th style="width:26%">吐出物（拍照）</th><th style="width:11%">精神</th><th style="width:11%">便便</th><th style="width:12%">喝水</th></tr>
    <tr class="ex"><td>示例</td><td>早 6:40</td><td>11 小时</td><td>黄水一摊，无粮</td><td>好</td><td>软</td><td>正常</td></tr>

  </table>
  <div class="foot">记满两周，<b>一周吐到 2 次以上</b>就带着这张表去。医生问"多久一次、什么时候、吐出什么"，你直接递表，比回忆准。<b>吐出物拍照</b>比描述有用，光线暗也要拍。</div>
</div>
</body></html>
