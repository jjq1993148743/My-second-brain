    <div class="bh">为什么这么重</div>
    <div class="bl">
      <div><span class="x">✕</span>带"松"的是<b>激素类</b>（地塞米松、可的松、氟米龙等）</div>
      <div style="margin-top:10px"><span class="x">✕</span>万一有<b>角膜溃疡</b>，激素会压住炎症反应、加速角膜软化</div>
      <div style="margin-top:10px"><span class="x">✕</span>结果是<b>从"能治"变成"穿孔"</b>，这一步是不可逆的</div>
    </div>
  </div>

  <div class="good">猫用的眼药必须由宠物医院开。等医生确认过<b>没有角膜溃疡</b>，才谈用什么药——顺序不能反。</div>
