<script>
var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
var grps  = Array.prototype.slice.call(document.querySelectorAll('.grp'));
var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
var lbname = document.getElementById('lbname'), lbidx = document.getElementById('lbidx');
var vis = [], cur = 0;

function apply(){
  var ls = document.querySelector('.chip.on[data-layer-filter]');
  var layer = ls ? ls.getAttribute('data-layer-filter') : '全部';
  var gs = document.querySelector('.chip.on[data-group-chip]');
  var gsel = gs ? gs.getAttribute('data-group-chip') : null;
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  vis = [];
  cards.forEach(function(c){
    var okL = (layer === '全部') || c.dataset.layer === layer;
    var okG = !gsel || c.closest('.grp').dataset.group === gsel;
    var okQ = !q || c.dataset.name.toLowerCase().indexOf(q) >= 0;
    var on = okL && okG && okQ;
    c.style.display = on ? '' : 'none';
    if (on) vis.push(c);
  });
  var any = false;
  grps.forEach(function(g){
    var n = g.querySelectorAll('.card').length -
            g.querySelectorAll('.card[style*="display: none"]').length;
    g.style.display = n ? '' : 'none';
    if (n) any = true;
  });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
}

document.querySelectorAll('.chip[data-layer-filter]').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.chip[data-layer-filter]')
      .forEach(function(x){ x.classList.remove('on') });
    b.classList.add('on'); apply();
  };
});
document.querySelectorAll('.chip[data-group-chip]').forEach(function(b){
  b.onclick = function(){
    var was = b.classList.contains('on');
    document.querySelectorAll('.chip[data-group-chip]')
      .forEach(function(x){ x.classList.remove('on') });
    if (!was) b.classList.add('on');
    apply();
  };
});
document.getElementById('q').oninput = apply;

function show(){
  var c = vis[cur];
  if (!c) return;
  lbimg.src = c.dataset.src;
  lbname.textContent = c.dataset.name;
  lbidx.textContent = (cur + 1) + ' / ' + vis.length;
}
cards.forEach(function(c){
  c.onclick = function(){
    cur = vis.indexOf(c); if (cur < 0) cur = 0;
    show(); lb.classList.add('on');
  };
});
document.getElementById('close').onclick = function(){ lb.classList.remove('on') };
document.getElementById('prev').onclick = function(e){
  e.stopPropagation(); if(!vis.length) return;
  cur = (cur - 1 + vis.length) % vis.length; show();
};
document.getElementById('next').onclick = function(e){
  e.stopPropagation(); if(!vis.length) return;
  cur = (cur + 1) % vis.length; show();
};
lb.onclick = function(e){ if (e.target === lb) lb.classList.remove('on') };
document.addEventListener('keydown', function(e){
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});
apply();
</script>
</body>
</html>
